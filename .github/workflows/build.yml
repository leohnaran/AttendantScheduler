name: Build/Release Electron App

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run this manually from the GitHub "Actions" tab

permissions:
  contents: write # Required for creating releases and uploading assets

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # We run on all three major OS types provided by GitHub
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and Package Electron App
        # This will run the build script from your package.json
        # The 'electron-builder' automatically detects the OS it is running on.
        # We add --publish always to create a GitHub Release automatically.
        run: npm run electron:build -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: release/*.*
          if-no-files-found: error
