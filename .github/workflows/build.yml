name: Build/Release Electron App

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run this manually from the GitHub "Actions" tab

permissions:
  contents: write # Required for creating releases and uploading assets

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # We run on all three major OS types provided by GitHub
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and Package Electron App
        # This will run the build script from your package.json
        # The 'electron-builder' automatically detects the OS it is running on.
        # We use --publish never because we publish in a separate job.
        run: npm run electron:build -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build HTML Version
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:nocache

      - name: Copy HTML to release
        if: matrix.os == 'ubuntu-latest'
        run: cp schedule.html release/schedule.html

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            release/*.*
            !release/builder-debug.yml
            !release/builder-effective-config.yaml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get package version
        id: get_version
        run: echo "VERSION=v$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
