        function PrintView({ personnel, assignments, positions, shifts, language }) {
            const getBrotherAssignments = (p) => {
                const myAssignments = [];
                Object.keys(assignments).forEach(key => {
                    if (getAssignId(assignments[key]) === p.id) {
                        let posId = key;
                        let shiftId = 'all';
                        if (key.includes('_')) {
                            const parts = key.split('_');
                            const lastPart = parts[parts.length-1];
                            if (shifts.find(s => s.id === lastPart)) {
                                shiftId = lastPart;
                                posId = parts.slice(0, parts.length-1).join('_');
                            }
                        }
                        const pos = positions.find(x => x.id === posId);
                        const shift = shifts.find(s => s.id === shiftId);
                        if (pos) {
                            myAssignments.push({
                                posName: pos.name,
                                time: shift ? shift.label : (language === 'en' ? 'Full Day' : t('grid_all_day', language)),
                                shiftId: shiftId
                            });
                        }
                    }
                });
                // Sort by time/shift index
                myAssignments.sort((a, b) => {
                    const aIdx = shifts.findIndex(s => s.id === a.shiftId);
                    const bIdx = shifts.findIndex(s => s.id === b.shiftId);
                    return aIdx - bIdx;
                });
                return myAssignments;
            };

            const brothersWithAssignments = personnel.filter(p => getBrotherAssignments(p).length > 0);
            brothersWithAssignments.sort((a,b) => getLastName(a.name).localeCompare(getLastName(b.name)));

            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm print:shadow-none print:border-none print:bg-white">
                    <div className="flex justify-between items-center mb-8 print:hidden">
                        <h2 className="text-2xl font-bold text-gray-900 tracking-tight dark:text-white">{t('nav_slips', language)}</h2>
                        <button onClick={() => window.print()} className="bg-gray-800 text-white px-6 py-2 rounded-full hover:bg-gray-900 font-semibold shadow-sm transition-all active:scale-95 flex items-center gap-2 dark:bg-slate-700 dark:hover:bg-slate-600"><i className="fa fa-print"></i> {t('btn_print', language)}</button>
                    </div>
                    <div className="grid grid-cols-2 gap-4 print:block print:gap-0">
                        {brothersWithAssignments.map(p => (
                            <div key={p.id} className="border-2 border-gray-800 rounded p-4 mb-4 break-inside-avoid print:mb-6 print:border-black dark:border-slate-500">
                                <h3 className="font-bold text-xl border-b-2 border-gray-800 pb-2 mb-2 text-center uppercase dark:text-white dark:border-slate-500">{p.name}</h3>
                                <table className="w-full text-sm">
                                    <thead>
                                        <tr className="bg-gray-200 print:bg-gray-300 dark:bg-slate-700 dark:text-white">
                                            <th className="p-2 text-left w-1/2">{t('grid_position', language)}</th>
                                            <th className="p-2 text-right w-1/2">{t('stats_time', language)}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {getBrotherAssignments(p).map((a, idx) => (
                                            <tr key={idx} className="border-b border-gray-400 dark:border-slate-600">
                                                <td className="p-2 font-bold dark:text-gray-200">{a.posName}</td>
                                                <td className="p-2 text-right dark:text-gray-200">{a.time}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                <div className="mt-4 text-center text-xs text-gray-500 italic dark:text-gray-400">
                                    Please arrive at your post 5 minutes early.
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function TagsView({ tags, setTags, personnel, setPersonnel, shifts, areas, onDeleteTag, language }) {
            const [newTag, setNewTag] = useState({ name: '', restrictedShifts: [], restrictedAreas: [] });
            const [selectedTagId, setSelectedTagId] = useState('');
            const [filterName, setFilterName] = useState('');

            // --- TAG MANAGEMENT ---
            const addTag = () => {
                if (!newTag.name) return alert("Tag Name is required");
                const id = 'tag_' + Date.now();
                setTags([...tags, { id, ...newTag }]);
                setNewTag({ name: '', restrictedShifts: [], restrictedAreas: [] });
            };

            const deleteTag = (id) => {
                if (confirm("Delete this tag?")) {
                    onDeleteTag(id);
                    if (selectedTagId === id) setSelectedTagId('');
                }
            };

            // Toggle for NEW tag form
            const toggleShiftNew = (shiftId) => {
                const current = newTag.restrictedShifts;
                if (current.includes(shiftId)) {
                    setNewTag({ ...newTag, restrictedShifts: current.filter(s => s !== shiftId) });
                } else {
                    setNewTag({ ...newTag, restrictedShifts: [...current, shiftId] });
                }
            };

            const toggleAreaNew = (areaId) => {
                const current = newTag.restrictedAreas || [];
                if (current.includes(areaId)) {
                    setNewTag({ ...newTag, restrictedAreas: current.filter(a => a !== areaId) });
                } else {
                    setNewTag({ ...newTag, restrictedAreas: [...current, areaId] });
                }
            };

            // Toggle for EXISTING tag (Edit Mode)
            const toggleShiftEdit = (tag, shiftId) => {
                const current = tag.restrictedShifts || [];
                let newShifts;
                if (current.includes(shiftId)) {
                    newShifts = current.filter(s => s !== shiftId);
                } else {
                    newShifts = [...current, shiftId];
                }
                const updatedTag = { ...tag, restrictedShifts: newShifts };
                setTags(tags.map(t => t.id === tag.id ? updatedTag : t));
            };

            const toggleAreaEdit = (tag, areaId) => {
                const current = tag.restrictedAreas || [];
                let newAreas;
                if (current.includes(areaId)) {
                    newAreas = current.filter(a => a !== areaId);
                } else {
                    newAreas = [...current, areaId];
                }
                const updatedTag = { ...tag, restrictedAreas: newAreas };
                setTags(tags.map(t => t.id === tag.id ? updatedTag : t));
            };

            const updateTagName = (tag, newName) => {
                setTags(tags.map(t => t.id === tag.id ? { ...t, name: newName } : t));
            };

            // --- BULK ASSIGNMENT ---
            const togglePersonTag = (personId, tagId) => {
                const person = personnel.find(p => p.id === personId);
                if (!person) return;

                const currentTags = person.tags || [];
                let newTags;
                if (currentTags.includes(tagId)) {
                    newTags = currentTags.filter(t => t !== tagId);
                } else {
                    newTags = [...currentTags, tagId];
                }

                setPersonnel(personnel.map(p => p.id === personId ? { ...p, tags: newTags } : p));
            };

            const selectedTag = tags.find(t => t.id === selectedTagId);

            // FILTER & SORT
            const filteredPersonnel = personnel.filter(p =>
                p.name.toLowerCase().includes(filterName.toLowerCase()) ||
                (p.role && p.role.toLowerCase().includes(filterName.toLowerCase())) ||
                (p.congregation && p.congregation.toLowerCase().includes(filterName.toLowerCase()))
            );
            filteredPersonnel.sort((a,b) => a.name.localeCompare(b.name));

            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm">
                    <h2 className="text-2xl font-bold text-gray-900 tracking-tight mb-6 dark:text-white">Tags & Constraints</h2>

                    {/* TOP: CREATE TAG */}
                    <div className="bg-gray-50/50 p-6 rounded-2xl border border-gray-100 mb-8 dark:bg-slate-800/50 dark:border-slate-700">
                        <h3 className="font-bold text-lg mb-2 dark:text-gray-200">Create New Tag</h3>
                        <div className="flex flex-col md:flex-row gap-4 items-start mb-2">
                            <div className="flex-1 w-full">
                                <label className="block text-xs font-bold uppercase text-gray-400 mb-1 ml-1 dark:text-gray-500">Tag Name</label>
                                <input
                                    type="text"
                                    value={newTag.name}
                                    onChange={e => setNewTag({...newTag, name: e.target.value})}
                                    className="border border-gray-200 p-2.5 rounded-xl w-full bg-white focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white"
                                    placeholder="e.g. Bus Riders"
                                />
                            </div>
                            <div className="flex-1 w-full">
                                <label className="block text-xs font-bold uppercase text-gray-400 mb-1 ml-1 dark:text-gray-500">Restricted Shifts (Cannot Work)</label>
                                <div className="flex flex-wrap gap-2 mb-4">
                                    <label className={`flex items-center text-sm px-3 py-1.5 rounded-full cursor-pointer transition-all border ${newTag.restrictedShifts.includes('all_day') ? 'bg-blue-100 border-blue-200 text-blue-700 font-bold dark:bg-blue-900 dark:border-blue-700 dark:text-blue-300' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300 dark:hover:bg-slate-600'}`}>
                                        <input
                                            type="checkbox"
                                            checked={newTag.restrictedShifts.includes('all_day')}
                                            onChange={() => toggleShiftNew('all_day')}
                                            className="mr-2"
                                        />
                                        All Day (Auditorium)
                                    </label>
                                    {shifts.map(s => (
                                        <label key={s.id} className={`flex items-center text-sm px-3 py-1.5 rounded-full cursor-pointer transition-all border ${newTag.restrictedShifts.includes(s.id) ? 'bg-red-100 border-red-200 text-red-700 font-bold dark:bg-red-900/30 dark:border-red-800 dark:text-red-400' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300 dark:hover:bg-slate-600'}`}>
                                            <input
                                                type="checkbox"
                                                checked={newTag.restrictedShifts.includes(s.id)}
                                                onChange={() => toggleShiftNew(s.id)}
                                                className="mr-2"
                                            />
                                            {s.label}
                                        </label>
                                    ))}
                                </div>

                                <label className="block text-xs font-bold uppercase text-gray-400 mb-1 ml-1 dark:text-gray-500">Restricted Areas (Cannot Work)</label>
                                <div className="flex flex-wrap gap-2">
                                    {areas.map(a => (
                                        <label key={a.id} className={`flex items-center text-sm px-3 py-1.5 rounded-full cursor-pointer transition-all border ${newTag.restrictedAreas && newTag.restrictedAreas.includes(a.id) ? 'bg-purple-100 border-purple-200 text-purple-700 font-bold dark:bg-purple-900/30 dark:border-purple-800 dark:text-purple-400' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300 dark:hover:bg-slate-600'}`}>
                                            <input
                                                type="checkbox"
                                                checked={newTag.restrictedAreas && newTag.restrictedAreas.includes(a.id)}
                                                onChange={() => toggleAreaNew(a.id)}
                                                className="mr-2"
                                            />
                                            {a.name}
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <button onClick={addTag} className="bg-blue-600 text-white px-6 py-2.5 rounded-full font-bold hover:bg-blue-700 md:mt-5 w-full md:w-auto shadow-sm active:scale-95 transition-all dark:bg-blue-600 dark:hover:bg-blue-500">Create</button>
                        </div>
                    </div>

                    {/* MAIN SPLIT: LIST & ASSIGN */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* LEFT: TAG LIST */}
                        <div className="border rounded-2xl p-4 bg-white/50 dark:bg-slate-800/30 dark:border-slate-700">
                            <h3 className="font-bold text-lg mb-4 border-b border-gray-100 pb-2 dark:text-gray-200 dark:border-slate-700">Existing Tags</h3>
                            {tags.length === 0 && <p className="text-gray-400 italic">No tags created.</p>}
                            <ul className="space-y-2">
                                {tags.map(tag => (
                                    <li key={tag.id}
                                        onClick={() => setSelectedTagId(tag.id)}
                                        className={`p-3 rounded-xl border cursor-pointer flex justify-between items-center transition-all ${selectedTagId === tag.id ? 'bg-blue-50 border-blue-500 shadow-sm ring-1 ring-blue-200 dark:bg-slate-700 dark:border-blue-500 dark:ring-blue-900' : 'bg-white border-gray-200 hover:bg-gray-50 dark:bg-slate-800 dark:border-slate-600 dark:hover:bg-slate-700'}`}
                                    >
                                        <div>
                                            <div className="font-bold text-gray-800 dark:text-gray-200">{tag.name}</div>
                                            <div className="text-xs text-red-600 dark:text-red-400">
                                            {tag.restrictedShifts.length > 0 && <span>{tag.restrictedShifts.length} shifts</span>}
                                            {tag.restrictedShifts.length > 0 && tag.restrictedAreas && tag.restrictedAreas.length > 0 && <span>, </span>}
                                            {tag.restrictedAreas && tag.restrictedAreas.length > 0 && <span>{tag.restrictedAreas.length} areas</span>}
                                            {(!tag.restrictedShifts.length && (!tag.restrictedAreas || !tag.restrictedAreas.length)) && <span>No restrictions</span>}
                                            </div>
                                        </div>
                                        <button onClick={(e) => { e.stopPropagation(); deleteTag(tag.id); }} className="text-gray-400 hover:text-red-500 px-2 transition-colors dark:text-gray-500 dark:hover:text-red-400">
                                            <i className="fa fa-trash"></i>
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </div>

                        {/* RIGHT: ASSIGNMENT */}
                        <div className="col-span-2 border rounded-2xl p-6 flex flex-col h-[650px] bg-white/50 dark:bg-slate-800/30 dark:border-slate-700">
                            {selectedTag ? (
                                <>
                                    <div className="mb-6 pb-6 border-b border-gray-200 dark:border-slate-700">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="font-bold text-lg dark:text-gray-200">
                                                Edit Tag: <span className="text-blue-600 dark:text-blue-400">{selectedTag.name}</span>
                                            </h3>
                                        </div>

                                        {/* EDIT CONTROLS */}
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-bold uppercase text-gray-400 mb-1 dark:text-gray-500">Tag Name</label>
                                                <input
                                                    type="text"
                                                    value={selectedTag.name}
                                                    onChange={(e) => updateTagName(selectedTag, e.target.value)}
                                                    className="border border-gray-200 p-2 rounded-lg w-full max-w-sm text-sm focus:ring-2 focus:ring-blue-100 outline-none dark:bg-slate-700 dark:border-slate-600 dark:text-white"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold uppercase text-gray-400 mb-2 dark:text-gray-500">Restricted Shifts</label>
                                                <div className="flex flex-wrap gap-2">
                                                    <label className={`flex items-center text-xs px-2.5 py-1 rounded-full cursor-pointer transition-all border ${selectedTag.restrictedShifts.includes('all_day') ? 'bg-blue-100 border-blue-200 text-blue-700 font-bold dark:bg-blue-900 dark:border-blue-700 dark:text-blue-300' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300'}`}>
                                                        <input
                                                            type="checkbox"
                                                            checked={selectedTag.restrictedShifts.includes('all_day')}
                                                            onChange={() => toggleShiftEdit(selectedTag, 'all_day')}
                                                            className="mr-1.5"
                                                        />
                                                        All Day
                                                    </label>
                                                    {shifts.map(s => (
                                                        <label key={s.id} className={`flex items-center text-xs px-2.5 py-1 rounded-full cursor-pointer transition-all border ${selectedTag.restrictedShifts.includes(s.id) ? 'bg-red-100 border-red-200 text-red-700 font-bold dark:bg-red-900/30 dark:border-red-800 dark:text-red-400' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300'}`}>
                                                            <input
                                                                type="checkbox"
                                                                checked={selectedTag.restrictedShifts.includes(s.id)}
                                                                onChange={() => toggleShiftEdit(selectedTag, s.id)}
                                                                className="mr-1.5"
                                                            />
                                                            {s.label}
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold uppercase text-gray-400 mb-2 dark:text-gray-500">Restricted Areas</label>
                                                <div className="flex flex-wrap gap-2">
                                                    {areas.map(a => (
                                                        <label key={a.id} className={`flex items-center text-xs px-2.5 py-1 rounded-full cursor-pointer transition-all border ${selectedTag.restrictedAreas && selectedTag.restrictedAreas.includes(a.id) ? 'bg-purple-100 border-purple-200 text-purple-700 font-bold dark:bg-purple-900/30 dark:border-purple-800 dark:text-purple-400' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300'}`}>
                                                            <input
                                                                type="checkbox"
                                                                checked={selectedTag.restrictedAreas && selectedTag.restrictedAreas.includes(a.id)}
                                                                onChange={() => toggleAreaEdit(selectedTag, a.id)}
                                                                className="mr-1.5"
                                                            />
                                                            {a.name}
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-center mb-2">
                                        <h4 className="font-bold text-gray-700 dark:text-gray-300 text-sm uppercase tracking-wide">Manage Members</h4>
                                        <div className="relative w-64">
                                            <i className="fa fa-search absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                                            <input
                                                type="text"
                                                placeholder="Search Name or Role..."
                                                value={filterName}
                                                onChange={e => setFilterName(e.target.value)}
                                                className="w-full border border-gray-200 p-2 pl-9 rounded-lg bg-white focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex-1 overflow-y-auto border border-gray-100 rounded-xl bg-gray-50/50 shadow-inner dark:bg-slate-800/50 dark:border-slate-700">
                                        <table className="w-full text-sm">
                                            <thead className="bg-gray-100 sticky top-0 dark:bg-slate-700 dark:text-gray-300">
                                                <tr>
                                                    <th className="p-3 text-left w-10"></th>
                                                    <th className="p-3 text-left">Name</th>
                                                    <th className="p-3 text-left">Role</th>
                                                    <th className="p-3 text-left">Current Tags</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-200 dark:divide-slate-700">
                                                {filteredPersonnel.map(p => {
                                                    const isMember = p.tags && p.tags.includes(selectedTag.id);
                                                    return (
                                                        <tr key={p.id} className={`hover:bg-white transition-colors cursor-pointer group dark:hover:bg-slate-700 ${isMember ? 'bg-green-50 dark:bg-green-900/10' : ''}`} onClick={() => togglePersonTag(p.id, selectedTag.id)}>
                                                            <td className="p-3 text-center">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={isMember || false}
                                                                    onChange={() => {}} // Handled by row click
                                                                    className="w-4 h-4 cursor-pointer text-blue-600 rounded focus:ring-blue-500 dark:bg-slate-600 dark:border-slate-500"
                                                                />
                                                            </td>
                                                            <td className="p-3 font-medium text-gray-800 dark:text-gray-200 group-hover:text-blue-600 transition-colors">{p.name}</td>
                                                            <td className="p-3 text-xs text-gray-500 dark:text-gray-400">{p.role}</td>
                                                            <td className="p-3 text-xs text-gray-500">
                                                                {p.tags && p.tags.map(tid => {
                                                                    const t = tags.find(tag => tag.id === tid);
                                                                    return t ? <span key={tid} className="bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded mr-1 dark:bg-slate-600 dark:text-gray-300">{t.name}</span> : null;
                                                                })}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="mt-2 text-xs text-gray-400 text-right dark:text-gray-500">
                                        Click rows to toggle membership.
                                    </div>
                                </>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center text-gray-400 dark:text-gray-500">
                                    <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-2xl mb-4 dark:bg-slate-700">
                                        <i className="fa fa-tags"></i>
                                    </div>
                                    <p>Select a tag from the left to edit settings and manage members.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function ConfigView({ areas, setAreas, positions, setPositions, shifts, setShifts, personnel, rules, setRules, tags, blueprints, setBlueprints, onConfigUpdate, language }) {
            const [activeTab, setActiveTab] = useState('areas');

            const keyMen = useMemo(() => personnel.filter(p => p.caps && p.caps.includes('keyman')), [personnel]);
            const uniqueCongregations = useMemo(() => {
                return [...new Set(personnel.map(p => p.congregation).filter(c => c && c.trim() !== ''))].sort();
            }, [personnel]);

            const renderConstraintSelector = (form, setForm, prefix) => (
                <div className="flex gap-2 items-center">
                    <select value={form.limitType || ''} onChange={e => setForm({...form, limitType: e.target.value, limitValue: ''})} className={`border p-1 rounded text-xs dark:bg-slate-700 dark:border-slate-600 dark:text-white ${prefix ? 'w-full' : 'w-24'}`}>
                        <option value="">Any</option>
                        <option value="keyman">Key Man</option>
                        <option value="congregation">Congregation</option>
                        <option value="tag">Tag</option>
                    </select>
                    {form.limitType && (
                        <select value={form.limitValue || ''} onChange={e => setForm({...form, limitValue: e.target.value})} className={`border p-1 rounded text-xs dark:bg-slate-700 dark:border-slate-600 dark:text-white ${prefix ? 'w-full' : 'w-32'}`}>
                            <option value="">-- Select --</option>
                            {form.limitType === 'keyman' && keyMen.map(km => <option key={km.id} value={km.id}>{km.name}</option>)}
                            {form.limitType === 'congregation' && uniqueCongregations.map(c => <option key={c} value={c}>{c}</option>)}
                            {form.limitType === 'tag' && tags.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                        </select>
                    )}
                </div>
            );

            const getConstraintLabel = (obj) => {
                if (!obj.limitType) return '-';
                if (obj.limitType === 'keyman') {
                    const km = keyMen.find(k => k.id == obj.limitValue);
                    return `KM: ${km ? km.name : 'Unknown'}`;
                }
                if (obj.limitType === 'congregation') return `Cong: ${obj.limitValue}`;
                if (obj.limitType === 'tag') {
                    const t = tags.find(tag => tag.id === obj.limitValue);
                    return `Tag: ${t ? t.name : 'Unknown'}`;
                }
                return '-';
            };

            // --- AREA MANAGEMENT ---
            const [areaForm, setAreaForm] = useState({ id: '', name: '', capability: '', color: '#ffffff', textColor: '#000000', limitType: '', limitValue: '' });
            const [editingAreaId, setEditingAreaId] = useState(null);
            const [editAreaForm, setEditAreaForm] = useState(null);

            const addArea = () => {
                if (!areaForm.id || !areaForm.name) return alert("ID and Name are required");
                if (areas.find(a => a.id === areaForm.id)) return alert("ID must be unique");
                setAreas([...areas, {
                    id: areaForm.id,
                    name: areaForm.name,
                    capability: areaForm.capability || areaForm.id,
                    style: { backgroundColor: areaForm.color, color: areaForm.textColor },
                    limitType: areaForm.limitType,
                    limitValue: areaForm.limitValue
                }]);
                setAreaForm({ id: '', name: '', capability: '', color: '#ffffff', textColor: '#000000', limitType: '', limitValue: '' });
            };
            const deleteArea = (id) => {
                if (confirm("Delete this area? This may break positions linked to it.")) {
                    setAreas(areas.filter(a => a.id !== id));
                    if (editingAreaId === id) cancelEditArea();
                }
            };

            const startEditArea = (area) => {
                setEditingAreaId(area.id);
                setEditAreaForm({
                    id: area.id,
                    name: area.name,
                    capability: area.capability,
                    color: area.style.backgroundColor,
                    textColor: area.style.color,
                    limitType: area.limitType || '',
                    limitValue: area.limitValue || ''
                });
            };

            const cancelEditArea = () => {
                setEditingAreaId(null);
                setEditAreaForm(null);
            };

            const saveAreaUpdate = () => {
                if (!editAreaForm.name) return alert("Name is required");

                // Update Area
                const updatedAreas = areas.map(a => a.id === editingAreaId ? {
                    id: a.id, // ID remains immutable
                    name: editAreaForm.name,
                    capability: editAreaForm.capability,
                    style: { backgroundColor: editAreaForm.color, color: editAreaForm.textColor },
                    limitType: editAreaForm.limitType,
                    limitValue: editAreaForm.limitValue
                } : a);

                // Auto-apply to all positions in this area (Bulk Update)
                let updatedPositions = positions;
                if (editAreaForm.limitType) {
                    updatedPositions = positions.map(p => {
                        if (p.areaId === editingAreaId) {
                            return {
                                ...p,
                                limitType: editAreaForm.limitType,
                                limitValue: editAreaForm.limitValue
                            };
                        }
                        return p;
                    });
                }

                // Atomic update to avoid race conditions
                if (onConfigUpdate) {
                    onConfigUpdate({ areas: updatedAreas, positions: updatedPositions });
                } else {
                    // Fallback
                    setAreas(updatedAreas);
                    if (updatedPositions !== positions) setPositions(updatedPositions);
                }

                cancelEditArea();
            };

            // --- SHIFT MANAGEMENT ---
            const [shiftForm, setShiftForm] = useState({ id: '', label: '', minutes: 150 });
            const addShift = () => {
                if (!shiftForm.id || !shiftForm.label) return alert("ID and Label are required");
                if (shifts.find(s => s.id === shiftForm.id)) return alert("ID must be unique");
                setShifts([...shifts, { ...shiftForm, minutes: parseInt(shiftForm.minutes) }]);
                setShiftForm({ id: '', label: '', minutes: 150 });
            };
            const deleteShift = (id) => {
                if (confirm("Delete this shift?")) {
                    setShifts(shifts.filter(s => s.id !== id));
                }
            };

            // --- POSITION MANAGEMENT ---
            const [posForm, setPosForm] = useState({ id: '', name: '', areaId: '', type: 'rotational', keyMan: false, limitType: '', limitValue: '', section: '' });
            const [editingPosId, setEditingPosId] = useState(null);
            const [editPosForm, setEditPosForm] = useState(null);

            const addPosition = () => {
                if (!posForm.id || !posForm.name || !posForm.areaId) return alert("ID, Name, and Area are required");
                if (positions.find(p => p.id === posForm.id)) return alert("ID must be unique");
                setPositions([...positions, { ...posForm }]);
                setPosForm({ id: '', name: '', areaId: '', type: 'rotational', keyMan: false, limitType: '', limitValue: '', section: '' });
            };

            // Auto-Fill restriction when Area is selected
            useEffect(() => {
                if (posForm.areaId) {
                    const area = areas.find(a => a.id === posForm.areaId);
                    if (area && area.limitType) {
                        setPosForm(prev => ({
                            ...prev,
                            limitType: area.limitType,
                            limitValue: area.limitValue
                        }));
                    }
                }
            }, [posForm.areaId, areas]);
            const deletePosition = (id) => {
                if (confirm("Delete this position?")) {
                    setPositions(positions.filter(p => p.id !== id));
                    if (editingPosId === id) cancelEditPos();
                }
            };

            const startEditPos = (pos) => {
                setEditingPosId(pos.id);
                // Backward compatibility: map teamKeyManId to limitType='keyman' if present
                let lType = pos.limitType || '';
                let lVal = pos.limitValue || '';
                if (!lType && pos.teamKeyManId) {
                    lType = 'keyman';
                    lVal = pos.teamKeyManId;
                }

                setEditPosForm({
                    id: pos.id,
                    name: pos.name,
                    areaId: pos.areaId,
                    type: pos.type,
                    keyMan: pos.keyMan || false,
                    limitType: lType,
                    limitValue: lVal,
                    section: pos.section || ''
                });
            };

            const cancelEditPos = () => {
                setEditingPosId(null);
                setEditPosForm(null);
            };

            const savePosUpdate = () => {
                if (!editPosForm.name || !editPosForm.areaId) return alert("Name and Area are required");
                setPositions(positions.map(p => p.id === editingPosId ? {
                    id: p.id,
                    name: editPosForm.name,
                    areaId: editPosForm.areaId,
                    type: editPosForm.type,
                    keyMan: editPosForm.keyMan,
                    limitType: editPosForm.limitType,
                    limitValue: editPosForm.limitValue,
                    section: editPosForm.section
                } : p));
                cancelEditPos();
            };

            // --- BLUEPRINT MANAGEMENT ---
            const [blueprintName, setBlueprintName] = useState('');

            const saveBlueprint = () => {
                if (!blueprintName.trim()) return alert("Please enter a name for the blueprint.");
                const newBlueprint = {
                    id: 'bp_' + Date.now(),
                    name: blueprintName,
                    areas: [...areas],
                    positions: [...positions],
                    shifts: [...shifts]
                };
                setBlueprints([...blueprints, newBlueprint]);
                setBlueprintName('');
                alert("Blueprint saved!");
            };

            const loadBlueprint = (bp) => {
                if (!confirm(`Load "${bp.name}"? This will overwrite your current configuration AND clear all current assignments.`)) return;
                
                // Atomic update to overwrite layout and wipe assignments
                if (onConfigUpdate) {
                    onConfigUpdate({ 
                        areas: bp.areas, 
                        positions: bp.positions, 
                        shifts: bp.shifts,
                        assignments: {},
                        log: []
                    });
                } else {
                    setAreas(bp.areas);
                    setPositions(bp.positions);
                    setShifts(bp.shifts);
                }
                
                alert(`Blueprint "${bp.name}" loaded successfully.`);
            };

            const deleteBlueprint = (id) => {
                if (confirm("Delete this blueprint?")) {
                    setBlueprints(blueprints.filter(b => b.id !== id));
                }
            };

            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm">
                    <h2 className="text-2xl font-bold text-gray-900 tracking-tight mb-6 dark:text-white">Configuration</h2>

                    <div className="flex border-b mb-6 overflow-x-auto dark:border-slate-700">
                        <button onClick={() => setActiveTab('areas')} className={`px-4 py-2 ${activeTab === 'areas' ? 'border-b-2 border-blue-600 font-bold text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400'}`}>{t('config_areas', language)}</button>
                        <button onClick={() => setActiveTab('shifts')} className={`px-4 py-2 ${activeTab === 'shifts' ? 'border-b-2 border-blue-600 font-bold text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400'}`}>{t('config_shifts', language)}</button>
                        <button onClick={() => setActiveTab('positions')} className={`px-4 py-2 ${activeTab === 'positions' ? 'border-b-2 border-blue-600 font-bold text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400'}`}>{t('config_positions', language)}</button>
                        <button onClick={() => setActiveTab('blueprints')} className={`px-4 py-2 ${activeTab === 'blueprints' ? 'border-b-2 border-blue-600 font-bold text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400'}`}>{t('config_blueprints', language)}</button>
                        <button onClick={() => setActiveTab('rules')} className={`px-4 py-2 ${activeTab === 'rules' ? 'border-b-2 border-blue-600 font-bold text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400'}`}>{t('config_rules', language)}</button>
                    </div>

                    {/* RULES TAB */}
                    {activeTab === 'rules' && <RulesView rules={rules} setRules={setRules} language={language} />}

                    {/* AREAS TAB */}
                    {activeTab === 'areas' && (
                        <div>
                            <div className="bg-gray-50 p-4 rounded border mb-4 dark:bg-slate-800 dark:border-slate-700">
                                <h3 className="font-bold mb-2 dark:text-white">{t('add_new_area', language) || 'Add New Area'}</h3>
                                <div className="flex gap-2 mb-2">
                                    <input placeholder="ID (e.g. parking)" value={areaForm.id} onChange={e => setAreaForm({...areaForm, id: e.target.value})} className="border p-2 rounded w-32 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                    <input placeholder={t('roster_name', language)} value={areaForm.name} onChange={e => setAreaForm({...areaForm, name: e.target.value})} className="border p-2 rounded w-64 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                    <input placeholder={t('roster_perms', language)} value={areaForm.capability} onChange={e => setAreaForm({...areaForm, capability: e.target.value})} className="border p-2 rounded w-32 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                </div>
                                <div className="flex gap-2 items-center">
                                    <label className="text-sm dark:text-gray-300">{t('bg_color', language) || 'Bg Color'}:</label>
                                    <input type="color" value={areaForm.color} onChange={e => setAreaForm({...areaForm, color: e.target.value})} />
                                    <label className="text-sm ml-2 dark:text-gray-300">{t('text_color', language) || 'Text Color'}:</label>
                                    <input type="color" value={areaForm.textColor} onChange={e => setAreaForm({...areaForm, textColor: e.target.value})} />
                                    <button onClick={addArea} className="ml-auto bg-blue-600 text-white px-4 py-1 rounded">{t('btn_add', language)} {t('area', language) || 'Area'}</button>
                                </div>
                            </div>
                            <div className="mt-2 bg-white p-2 rounded border dark:bg-slate-700 dark:border-slate-600">
                                <span className="text-xs font-bold text-gray-500 uppercase mr-2 dark:text-gray-400">{t('restriction', language) || 'Restriction'}:</span>
                                {renderConstraintSelector(areaForm, setAreaForm, false)}
                            </div>
                            <table className="w-full text-sm mt-4">
                                <thead><tr className="bg-gray-100 dark:bg-slate-700 dark:text-gray-300"><th className="p-2 text-left">ID</th><th className="p-2 text-left">{t('roster_name', language)}</th><th className="p-2 text-left">{t('roster_perms', language)}</th><th className="p-2 text-left">{t('restriction', language) || 'Restriction'}</th><th className="p-2 text-left">{t('preview', language) || 'Preview'}</th><th className="p-2 w-24">{t('action', language) || 'Action'}</th></tr></thead>
                                <tbody>
                                    {areas.map(a => {
                                        const isEditing = editingAreaId === a.id;
                                        return (
                                            <tr key={a.id} className={`border-b dark:border-slate-700 dark:text-gray-200 ${isEditing ? 'bg-yellow-50 dark:bg-yellow-900/20' : ''}`}>
                                                <td className="p-2 font-mono text-xs text-gray-500">{a.id}</td>
                                                <td className="p-2">
                                                    {isEditing ? (
                                                        <input value={editAreaForm.name} onChange={e => setEditAreaForm({...editAreaForm, name: e.target.value})} className="border p-1 rounded w-full text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                                    ) : a.name}
                                                </td>
                                                <td className="p-2">
                                                    {isEditing ? (
                                                        <input value={editAreaForm.capability} onChange={e => setEditAreaForm({...editAreaForm, capability: e.target.value})} className="border p-1 rounded w-full text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                                    ) : a.capability}
                                                </td>
                                                <td className="p-2 text-xs">
                                                    {isEditing ? renderConstraintSelector(editAreaForm, setEditAreaForm, true) : getConstraintLabel(a)}
                                                </td>
                                                <td className="p-2">
                                                    {isEditing ? (
                                                        <div className="flex gap-1 items-center">
                                                            <input type="color" value={editAreaForm.color} onChange={e => setEditAreaForm({...editAreaForm, color: e.target.value})} className="w-6 h-6 border-none" title="Background" />
                                                            <input type="color" value={editAreaForm.textColor} onChange={e => setEditAreaForm({...editAreaForm, textColor: e.target.value})} className="w-6 h-6 border-none" title="Text" />
                                                        </div>
                                                    ) : (
                                                        <div style={a.style} className="px-2 py-1 text-xs rounded text-center">Preview</div>
                                                    )}
                                                </td>
                                                <td className="p-2 text-center">
                                                    {isEditing ? (
                                                        <div className="flex justify-center gap-2">
                                                            <button onClick={saveAreaUpdate} className="text-green-600 hover:text-green-800"><i className="fa fa-check"></i></button>
                                                            <button onClick={cancelEditArea} className="text-gray-500 hover:text-gray-700"><i className="fa fa-times"></i></button>
                                                        </div>
                                                    ) : (
                                                        <div className="flex justify-center gap-2">
                                                            <button onClick={() => startEditArea(a)} className="text-blue-500 hover:text-blue-700"><i className="fa fa-pencil"></i></button>
                                                            <button onClick={() => deleteArea(a.id)} className="text-red-500 hover:text-red-700"><i className="fa fa-trash"></i></button>
                                                        </div>
                                                    )}
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>

        function useUndoRedo(initialState) {
            const [history, setHistory] = useState([initialState]);
            const [index, setIndex] = useState(0);

            const state = history[index];

            const setState = (newState) => {
                const newHistory = history.slice(0, index + 1);
                newHistory.push(newState);
                if(newHistory.length > 50) newHistory.shift();
                setHistory(newHistory);
                setIndex(newHistory.length - 1);
            };

            const undo = () => index > 0 && setIndex(index - 1);
            const redo = () => index < history.length - 1 && setIndex(index + 1);

            return { state, setState, undo, redo, canUndo: index > 0, canRedo: index < history.length - 1 };

                }
            }, []);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('dark_mode', darkMode);
            }, [darkMode]);

            useEffect(() => {
                localStorage.setItem('app_language', language);
            }, [language]);

            // --- WIZARD HANDLERS ---
            const handleWizardNext = () => {
                const nextStep = wizardStep + 1;
                if (nextStep < WIZARD_STEPS.length) {
                    setWizardStep(nextStep);
                    setView(WIZARD_STEPS[nextStep].view);
                } else {
                    handleWizardClose();
                }
            };

            const handleWizardBack = () => {
                 if (wizardStep > 0) {
                     const prevStep = wizardStep - 1;
                     setWizardStep(prevStep);
                     setView(WIZARD_STEPS[prevStep].view);
                 }
            };

            const handleWizardClose = () => {
                setShowWizard(false);
                localStorage.setItem('wizard_complete', 'true');
                localStorage.setItem('has_seen_quickstart', 'true');
            };

            // --- WRAPPERS FOR STATE UPDATES ---
            const updateState = (updates) => setState({ ...state, ...updates });

            const setPersonnel = (val) => updateState({ personnel: typeof val === 'function' ? val(personnel) : val });
            const setTags = (val) => updateState({ tags: typeof val === 'function' ? val(tags) : val });
            const setAssignments = (val) => updateState({ assignments: typeof val === 'function' ? val(assignments) : val });
            const setAreas = (val) => updateState({ areas: typeof val === 'function' ? val(areas) : val });
            const setPositions = (val) => updateState({ positions: typeof val === 'function' ? val(positions) : val });
            const setShifts = (val) => updateState({ shifts: typeof val === 'function' ? val(shifts) : val });
            const setBlueprints = (val) => updateState({ blueprints: typeof val === 'function' ? val(blueprints) : val });
            const setRules = (val) => updateState({ rules: typeof val === 'function' ? val(rules) : val });

            const handleAutoFill = (newAssignments, newLog) => {
                updateState({ assignments: newAssignments, log: newLog });
            };

            const handleDeleteTag = (tagId) => {
                 const newTags = tags.filter(t => t.id !== tagId);
                 const newPersonnel = personnel.map(p => ({
                    ...p,
                    tags: p.tags ? p.tags.filter(tid => tid !== tagId) : []
                 }));
                 updateState({ tags: newTags, personnel: newPersonnel });
            };

            // --- PERSISTENCE ---
            useEffect(() => {
                const saved = localStorage.getItem('circuit_scheduler_data');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        // Merge default rules if not present in saved data
                        const defaultRules = INITIAL_STATE.rules;
                        const loadedState = {
                            ...INITIAL_STATE,
                            ...parsed,
                            rules: { ...defaultRules, ...(parsed.rules || {}) }
                        };
                        setState(loadedState);
                    } catch (e) { console.error("Failed to load cache", e); }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('circuit_scheduler_data', JSON.stringify(state));
            }, [state]);

            const resetAll = () => {
                if(confirm("Are you sure you want to clear EVERYTHING? This cannot be undone.")) {
                    localStorage.removeItem('circuit_scheduler_data');
                    window.location.reload();
                }
            };


            const handleExport = () => {
                if(!password) return alert("Please enter a password.");
                const data = JSON.stringify(state);
                const encrypted = CryptoJS.AES.encrypt(data, password).toString();
                const blob = new Blob([encrypted], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Attendants_Schedule_${new Date().toISOString().slice(0,10)}.lock`;
                a.click();
                setShowSaveModal(false);
                setPassword('');
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const encrypted = event.target.result;
                        const bytes = CryptoJS.AES.decrypt(encrypted, password);
                        const decryptedData = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
                        if(decryptedData.personnel && decryptedData.assignments) {
                            setState({ ...INITIAL_STATE, ...decryptedData });
                            alert("Loaded successfully!");
                            setShowLoadModal(false);
                            setPassword('');
                        } else {
                            throw new Error("Invalid structure");
                        }
                    } catch (err) {
                        alert("Failed to load! Incorrect password or corrupted file.");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen pb-10 text-gray-800">
                    <header className="glass-header sticky top-0 z-50 px-6 py-3 shadow-sm mb-8">
                        <div className="container mx-auto flex flex-col xl:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-6">
                                <h1 className="text-lg font-semibold text-gray-900 dark:text-white flex items-center gap-3">
                                    <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md bg-gradient-to-br from-blue-500 to-blue-700">
                                        <i className="fa fa-clipboard-user"></i>
                                    </div>
                                    <span className="tracking-tight">{t('app_title', language)}</span>
                                </h1>
                                <div className="h-6 w-px bg-gray-300 hidden sm:block"></div>
                                <div className="flex gap-1">
                                    <button onClick={undo} disabled={!canUndo} className={`w-8 h-8 flex items-center justify-center rounded-full transition-all ${!canUndo ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-100 hover:text-blue-600'}`} title="Undo"><i className="fa fa-undo"></i></button>
                                    <button onClick={redo} disabled={!canRedo} className={`w-8 h-8 flex items-center justify-center rounded-full transition-all ${!canRedo ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-100 hover:text-blue-600'}`} title="Redo"><i className="fa fa-redo"></i></button>
                                </div>
                            </div>

                            <nav className="flex items-center p-1 bg-gray-100/80 rounded-full overflow-hidden shadow-inner border border-gray-200">
                                {['schedule', 'roster', 'stats', 'dept', 'log', 'tags', 'print', 'config'].map(v => (
                                    <button
                                        key={v}
                                        onClick={() => setView(v)}
                                        className={`px-4 py-1.5 rounded-full text-xs font-semibold transition-all duration-200 ${view===v ? 'bg-white text-gray-900 shadow-sm ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-800'}`}
                                    >
                                        {v === 'schedule' ? t('nav_schedule', language) :
                                         v === 'roster' ? t('nav_roster', language) :
                                         v === 'stats' ? t('nav_stats', language) :
                                         v === 'dept' ? t('nav_depts', language) :
                                         v === 'log' ? t('nav_log', language) :
                                         v === 'tags' ? t('nav_tags', language) :
                                         v === 'print' ? t('nav_slips', language) : t('nav_config', language)}
                                    </button>
                                ))}
                            </nav>

                            <div className="flex gap-3 items-center">
                                <div className="flex bg-gray-100 dark:bg-slate-800 p-1 rounded-xl border border-gray-200 dark:border-slate-700 mr-2">
                                    {['en', 'es', 'fr', 'pt', 'tl', 'it'].map(l => (
                                        <button 
                                            key={l} 
                                            onClick={() => setLanguage(l)} 
                                            className={`px-2 py-0.5 rounded-lg text-[10px] font-black uppercase transition-all ${language === l ? 'bg-white dark:bg-slate-700 text-blue-600 shadow-sm' : 'text-gray-400 hover:text-gray-600'}`}
                                        >
                                            {l}
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setDarkMode(!darkMode)} className={`w-8 h-8 flex items-center justify-center rounded-full transition-all ${darkMode ? 'text-yellow-400 hover:bg-white/10' : 'text-gray-400 hover:text-yellow-500 hover:bg-yellow-50'}`} title="Toggle Dark Mode">
                                    <i className={`fa ${darkMode ? 'fa-sun' : 'fa-moon'}`}></i>
                                </button>
                                <button onClick={() => setShowQuickStart(true)} className="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-white/10 dark:text-gray-500 dark:hover:text-blue-400 transition-all" title="Help / Quick Start"><i className="fa fa-circle-question text-lg"></i></button>
                                <div className="w-px h-6 bg-gray-200 dark:bg-gray-700"></div>
                                <button onClick={resetAll} className="text-gray-400 hover:text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">{t('btn_reset', language)}</button>
                                <button onClick={() => setShowSaveModal(true)} className="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 hover:border-gray-300 px-4 py-1.5 rounded-full text-xs font-semibold shadow-sm transition-all flex items-center gap-2 dark:bg-slate-800 dark:border-slate-700 dark:text-gray-300 dark:hover:bg-slate-700"><i className="fa fa-download text-blue-500"></i> {t('btn_save', language)}</button>
                                <button onClick={() => setShowLoadModal(true)} className="bg-blue-600 text-white hover:bg-blue-700 px-4 py-1.5 rounded-full text-xs font-semibold shadow-sm shadow-blue-200 transition-all flex items-center gap-2"><i className="fa fa-upload"></i> {t('btn_load', language)}</button>
                            </div>
                        </div>
                    </header>
                    {showQuickStart && <QuickStartModal onClose={() => setShowQuickStart(false)} language={language} />}
                    <div className="container mx-auto mt-6 px-4">
                        {view === 'roster' ? <RosterView personnel={personnel} setPersonnel={setPersonnel} areas={areas} shifts={shifts} tags={tags} language={language} /> :
                         view === 'stats' ? <StatsView personnel={personnel} assignments={assignments} shifts={shifts} positions={positions} language={language} /> :
                         view === 'dept' ? <DepartmentView personnel={personnel} assignments={assignments} areas={areas} positions={positions} shifts={shifts} language={language} /> :
                         view === 'log' ? <LogView log={log} language={language} /> :
                         view === 'tags' ? <TagsView tags={tags} setTags={setTags} personnel={personnel} setPersonnel={setPersonnel} shifts={shifts} areas={areas} onDeleteTag={handleDeleteTag} language={language} /> :
                         view === 'print' ? <PrintView personnel={personnel} assignments={assignments} positions={positions} shifts={shifts} language={language} /> :
                         view === 'config' ? <ConfigView areas={areas} setAreas={setAreas} positions={positions} setPositions={setPositions} shifts={shifts} setShifts={setShifts} personnel={personnel} rules={rules} setRules={setRules} tags={tags} blueprints={blueprints} setBlueprints={setBlueprints} onConfigUpdate={updateState} language={language} /> :
                         <ScheduleView personnel={personnel} assignments={assignments} setAssignments={setAssignments} onAutoFill={handleAutoFill} areas={areas} positions={positions} shifts={shifts} rules={rules} tags={tags} language={language} />}
                    </div>
                    {showSaveModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded shadow-xl w-96">
                                <h3 className="font-bold text-lg mb-4">Secure Export</h3>
                                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full border p-2 rounded mb-4" placeholder="Password" />
                                <div className="flex justify-end gap-2">
                                    <button onClick={()=>setShowSaveModal(false)} className="px-4 py-2 text-gray-600">Cancel</button>
                                    <button onClick={handleExport} className="px-4 py-2 bg-blue-600 text-white rounded">Download</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {showLoadModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded shadow-xl w-96">
                                <h3 className="font-bold text-lg mb-4">Load Schedule</h3>
                                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full border p-2 rounded mb-4" placeholder="Password" />
                                <input type="file" onChange={handleImport} className="w-full mb-4" />
                                <div className="flex justify-end gap-2">
                                    <button onClick={()=>setShowLoadModal(false)} className="px-4 py-2 text-gray-600">Cancel</button>
                                    <button onClick={handleExport} className="px-4 py-2 bg-blue-600 text-white rounded">Download</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {showWizard && <Wizard step={wizardStep} steps={WIZARD_STEPS} onNext={handleWizardNext} onBack={handleWizardBack} onClose={handleWizardClose} language={language} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
