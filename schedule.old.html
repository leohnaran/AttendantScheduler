    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .dark body { background-color: #0f172a; color: #e2e8f0; color-scheme: dark; }

        .conflict-border { border: 2px solid #ef4444; }
        .warning-border { border: 2px solid #f59e0b; }
        .auto-assigned { background-color: #dcfce7; }
        .dark .auto-assigned { background-color: rgba(22, 163, 74, 0.2); }

        .blocked-cell { background-color: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
        .dark .blocked-cell { background-color: #1e293b; color: #475569; }

        .mirrored-cell { background-color: #fff7ed; color: #9a3412; font-style: italic; border: 1px dashed #fdba74; }
        .dark .mirrored-cell { background-color: rgba(255, 247, 237, 0.1); color: #fed7aa; border-color: #9a3412; }

        .overflow-x-auto::-webkit-scrollbar { height: 8px; }
        .overflow-x-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .overflow-x-auto::-webkit-scrollbar-thumb { background: #475569; }

        .log-entry { border-bottom: 1px solid #e5e7eb; padding: 8px 0; font-family: monospace; font-size: 0.85rem; }
        .dark .log-entry { border-color: #334155; }

        @keyframes pulse-blue {
            0%, 100% { border-color: #3b82f6; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            50% { border-color: #60a5fa; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); }
        }
        .mirror-highlight {
            animation: pulse-blue 2s infinite;
            border: 2px solid #3b82f6 !important;
            z-index: 20;
        }

        /* Drag and Drop Styles */
        .draggable-row { cursor: grab; }
        .draggable-row:active { cursor: grabbing; }
        .droppable-group { transition: background-color 0.2s; }
        .droppable-group.drag-over { background-color: #e0f2fe; border-color: #3b82f6; }
        .dark .droppable-group.drag-over { background-color: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }

        /* Schedule Drag and Drop */
        .schedule-drop-zone.drag-over {
            background-color: #dbeafe !important;
            box-shadow: inset 0 0 0 2px #3b82f6 !important;
            z-index: 10;
        }
        .dark .schedule-drop-zone.drag-over {
            background-color: rgba(59, 130, 246, 0.2) !important;
            box-shadow: inset 0 0 0 2px #3b82f6 !important;
        }

        /* Enhanced Sticky Headers */
        .sticky-header-row {
            position: sticky;
            top: 0;
            z-index: 40;
            background-color: rgba(249, 250, 251, 0.95);
            backdrop-filter: blur(8px);
        }
        .dark .sticky-header-row {
            background-color: rgba(15, 23, 42, 0.95);
        }
        .scrolled-y .sticky-header-row {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .sticky-header-col {
            position: sticky;
            left: 0;
            z-index: 30;
            background-color: inherit;
        }
        .scrolled-x .sticky-header-col {
            box-shadow: 4px 0 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Corner header (both sticky) */
        .sticky-header-corner {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 50;
            background-color: rgba(249, 250, 251, 1);
        }
        .dark .sticky-header-corner {
            background-color: rgba(15, 23, 42, 1);
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        .dark .glass-header {
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>

        <button onclick="location.reload()" style="margin-top:10px; padding:5px 10px; cursor:pointer; border:1px solid #991b1b; background: #fff;">Reload Page</button>

            document.getElementById('global-error').style.display = 'block';
            document.getElementById('error-message').textContent = message + '\n\nLocation: ' + lineno + ':' + colno;
        };

        const parseCSV = (text) => {
            const arr = [];
            let quote = false;
            let row = [];
            let col = '';
            text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const next = text[i+1];
                if (char === '"') {
                    if (quote && next === '"') { col += '"'; i++; } else { quote = !quote; }
                } else if (char === ',' && !quote) {
                    row.push(col); col = '';
                } else if (char === '\n' && !quote) {
                    row.push(col); arr.push(row); row = []; col = '';
                } else { col += char; }
            }
            if (col || row.length > 0) { row.push(col); arr.push(row); }
            return arr;
        };

        // --- CENTRALIZED CANDIDATE FINDER (Now relies on props) ---
        const getCandidatesForPosition = (pos, personnel, areas, tags) => {
            const area = areas.find(a => a.id === pos.areaId);
            if(!area) return [];
            const requiredCap = area.capability;

            // Determine effective restriction
            // Position restriction takes precedence, then Area restriction
            let limitType = pos.limitType;
            let limitValue = pos.limitValue;

            // Legacy backward compatibility for Position
            if (!limitType && pos.teamKeyManId) {
                limitType = 'keyman';
                limitValue = pos.teamKeyManId;
            }

            // Fallback to Area restriction if none on Position
            if (!limitType && area.limitType) {
                limitType = area.limitType;
                limitValue = area.limitValue;
            }

            return personnel.filter(p => {
                if (!p.caps || !p.caps.includes(requiredCap)) return false;
                if (pos.keyMan && (!p.caps || !p.caps.includes('keyman'))) return false;

                // Check Area Restrictions from Tags
                if (tags && p.tags) {
                    for (let tid of p.tags) {
                        const tag = tags.find(t => t.id === tid);
                        if (tag && tag.restrictedAreas && tag.restrictedAreas.includes(pos.areaId)) return false;
                    }
                }

                // Check Assignment Constraints
                if (limitType && limitValue) {
                    if (limitType === 'keyman') {
                        if (p.keyManId !== parseInt(limitValue)) return false;
                    } else if (limitType === 'congregation') {
                        if (p.congregation !== limitValue) return false;
                    } else if (limitType === 'tag') {
                        if (!p.tags || !p.tags.includes(limitValue)) return false;
                    }
                }

                return true;
            });
        };

                return [...new Set(personnel.map(p => p.congregation).filter(c => c && c.trim() !== ''))].sort();
            }, [personnel]);

            // --- FORM HANDLERS ---
            const handleCapChange = (cap, checked) => {
                setFormData(prev => ({ ...prev, caps: { ...prev.caps, [cap]: checked } }));
            };

            const handleUnavailableChange = (shiftId, checked) => {
                setFormData(prev => {
                     const newUnavailable = checked
                        ? [...(prev.unavailable || []), shiftId]
                        : (prev.unavailable || []).filter(id => id !== shiftId);
                     return { ...prev, unavailable: newUnavailable };
                });
            };

            const handleTagAdd = (tagId) => {
                if (!tagId) return;
                setFormData(prev => {
                    const current = prev.tags || [];
                    if (current.includes(tagId)) return prev;
                    return { ...prev, tags: [...current, tagId] };
                });
            };

            const handleTagRemove = (tagId) => {
                setFormData(prev => ({ ...prev, tags: (prev.tags || []).filter(t => t !== tagId) }));
            };

            const startEdit = (person) => {
                setEditingId(person.id);
                const newCaps = { keyman: false };
                areas.forEach(a => newCaps[a.capability] = false);

                person.caps.forEach(c => { newCaps[c] = true; });
                setFormData({
                    name: person.name,
                    congregation: person.congregation || '',
                    role: person.role || 'Exemplary',
                    caps: newCaps,
                    keyManId: person.keyManId ? person.keyManId.toString() : '',
                    unavailable: person.unavailable || [],
                    tags: person.tags || []
                });
            };

            const cancelEdit = () => {
                setEditingId(null);
                setFormData({
                    name: '', congregation: '', role: 'Exemplary',
                    caps: initialCaps,
                    keyManId: '',
                    unavailable: [],
                    tags: []
                });
            };

            const savePerson = () => {
                if (!formData.name.trim()) return;
                const capabilityList = Object.keys(formData.caps).filter(k => formData.caps[k]);
                const newKeyManId = formData.keyManId ? parseInt(formData.keyManId) : null;

                const newPerson = {
                    name: formData.name,
                    congregation: formData.congregation,
                    role: formData.role,
                    caps: capabilityList,
                    keyManId: newKeyManId,
                    unavailable: formData.unavailable,
                    tags: formData.tags
                };

                if (editingId !== null) {
                    setPersonnel(personnel.map(p => p.id === editingId ? { ...p, ...newPerson } : p));
                    cancelEdit();
                } else {
                    const maxId = personnel.reduce((max, p) => (p.id > max ? p.id : max), 0);
                    setPersonnel([...personnel, { id: maxId + 1, ...newPerson }]);
                    setFormData({ name: '', congregation: '', role: 'Exemplary', caps: initialCaps, keyManId: '', unavailable: [], tags: [] });
                }
            };

            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const rows = parseCSV(event.target.result);
                        if (rows.length < 2) return alert("CSV file seems empty or invalid.");
                        setCsvData(rows);
                    } catch (err) { alert("Error parsing CSV: " + err.message); }
                };
                reader.readAsText(file);
                e.target.value = ""; // Reset input
            };

            const handleImportFinish = (mapping) => {
                if (!csvData) return;
                const rows = csvData;
                const dataRows = rows.slice(1).filter(r => r.length > 0 && r[mapping.nameIdx] && r[mapping.nameIdx].trim() !== '');

                let newPersonnel = [...personnel];
                let maxId = newPersonnel.reduce((max, p) => (p.id > max ? p.id : max), 0);

                let updatedCount = 0;
                let newCount = 0;

                dataRows.forEach(row => {
                    const name = row[mapping.nameIdx].trim();
                    const rawRole = mapping.roleIdx !== -1 ? (row[mapping.roleIdx] || "") : "";
                    const keyManName = mapping.keyManIdx !== -1 ? (row[mapping.keyManIdx] || "") : "";
                    const congregation = mapping.congregationIdx !== -1 ? (row[mapping.congregationIdx] || "") : "";

                    let role = 'Exemplary';
                    if (rawRole.includes('Elder')) role = 'Elder';
                    else if (rawRole.includes('Ministerial')) role = 'MS';

                    // Default caps
                    let caps = ['lobby', 'dining', 'stairs', 'exterior', 'backstage'];
                    if (role === 'Elder' || role === 'MS') caps.push('auditorium', 'upper_level', 'backstage');
                    if (keyManName.trim().toLowerCase() === name.toLowerCase()) caps.push('keyman');

                    const existingIndex = newPersonnel.findIndex(p => p.name.toLowerCase() === name.toLowerCase());

                    if (existingIndex >= 0) {
                        const existing = newPersonnel[existingIndex];
                        newPersonnel[existingIndex] = {
                            ...existing,
                            role: role,
                            congregation: congregation || existing.congregation,
                            caps: [...new Set([...existing.caps, ...caps])],
                            tempKeyManName: keyManName
                        };
                        updatedCount++;
                    } else {
                        maxId++;
                        newPersonnel.push({
                            id: maxId,
                            name: name,
                            role: role,
                            congregation: congregation,
                            caps: caps,
                            tempKeyManName: keyManName
                        });
                        newCount++;
                    }
                });

                // Link Key Men
                newPersonnel = newPersonnel.map(p => {
                    if (p.tempKeyManName && p.tempKeyManName.toLowerCase() !== p.name.toLowerCase()) {
                        const km = newPersonnel.find(c => c.name.toLowerCase() === p.tempKeyManName.toLowerCase());
                        if (km) return { ...p, keyManId: km.id };
                    }
                    return p;
                });

                setPersonnel(newPersonnel);
                setCsvData(null);
                alert(`Import Complete!\nAdded: ${newCount}\nUpdated: ${updatedCount}`);
            };

            const deletePerson = (id) => {
                if(confirm("Delete this person?")) {
                    setPersonnel(personnel.filter(p => p.id !== id));
                    if (editingId === id) cancelEdit();
                }
            };

            // --- DRAG AND DROP LOGIC ---
            const handleDragStart = (e, personId) => {
                setDraggedPersonId(personId);
                e.dataTransfer.effectAllowed = "move";
            };

            const handleDragOver = (e, groupId) => {
                e.preventDefault();
                setDragOverGroup(groupId);
            };

            const handleDrop = (e, targetKeyManId) => {
                e.preventDefault();
                setDragOverGroup(null);
                if (draggedPersonId === null) return;
                if (draggedPersonId === targetKeyManId) return;

                setPersonnel(prev => prev.map(p => {
                    if (p.id === draggedPersonId) {
                        return { ...p, keyManId: targetKeyManId };
                    }
                    return p;
                }));
                setDraggedPersonId(null);
            };


            const renderCheckbox = (key, label) => (
                <label className="flex items-center cursor-pointer mr-4 mb-2">
                    <input type="checkbox" checked={formData.caps[key]} onChange={e=>handleCapChange(key, e.target.checked)} className="mr-2"/>
                    <span className="text-xs font-bold text-gray-700 dark:text-gray-300">{label}</span>
                </label>
            );

            // --- GROUPING & SORTING LOGIC ---
            const keyMen = personnel.filter(p => p.caps && p.caps.includes('keyman'));
            keyMen.sort((a, b) => getLastName(a.name).localeCompare(getLastName(b.name)));

            const groups = keyMen.map(km => {
                const members = personnel.filter(p => p.keyManId === km.id);
                members.sort((a, b) => getLastName(a.name).localeCompare(getLastName(b.name)));
                return { keyMan: km, members: members };
            });

            const orphans = personnel.filter(p => !p.keyManId && (!p.caps || !p.caps.includes('keyman')));
            orphans.sort((a, b) => getLastName(a.name).localeCompare(getLastName(b.name)));

            if (orphans.length > 0) {
                groups.push({ keyMan: null, members: orphans });
            }

            if (personnel.length === 0) {
                return (
                    <div className="glass-panel p-8 rounded-3xl shadow-sm">
                        {csvData && <CSVMapperModal data={csvData} onImport={handleImportFinish} onClose={() => setCsvData(null)} language={language} />}
                        <div className="flex justify-between items-center mb-8">
                            <div>
                                <h2 className="text-2xl font-bold text-gray-900 tracking-tight dark:text-white">{t('roster_title', language)}</h2>
                                <p className="text-gray-500 text-sm mt-1 dark:text-gray-400">{t('roster_start_desc', language) || "Start by adding your team"}</p>
                            </div>
                            <div className="relative overflow-hidden inline-block group">
                                <button className="bg-purple-500 text-white py-2 px-5 rounded-full font-semibold shadow-sm hover:bg-purple-600 hover:shadow-md transition-all active:scale-95 flex items-center gap-2 dark:bg-purple-600 dark:hover:bg-purple-700"><i className="fa fa-file-csv"></i> {t('roster_import', language)}</button>
                                <input type="file" accept=".csv" onChange={handleCSVUpload} className="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer" />
                            </div>
                        </div>

                        {/* EDIT FORM */}
                        <div className={`p-6 rounded-2xl border mb-8 bg-gray-50/50 border-gray-200 dark:bg-slate-800/50 dark:border-slate-700`}>
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-sm font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400">{t('roster_add_person', language)}</h3>
                            </div>
                            <div className="flex flex-wrap gap-4 items-end">
                                <div className="mb-2">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_name', language)}</label>
                                    <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="border border-gray-300 p-2.5 rounded-xl w-48 bg-white text-gray-900 focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:ring-blue-800" placeholder="Full Name" />
                                </div>
                                <div className="mb-2">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_cong', language)}</label>
                                    <input type="text" list="congregation-list" value={formData.congregation} onChange={(e) => setFormData({...formData, congregation: e.target.value})} className="border border-gray-300 p-2.5 rounded-xl w-32 bg-white text-gray-900 focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:ring-blue-800" placeholder="Congregation" />
                                    <datalist id="congregation-list">
                                        {uniqueCongregations.map(c => <option key={c} value={c} />)}
                                    </datalist>
                                </div>
                                <div className="mb-2">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_role', language)}</label>
                                    <select value={formData.role} onChange={(e) => setFormData({...formData, role: e.target.value})} className="border border-gray-300 p-2.5 rounded-xl w-32 bg-white text-gray-900 focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm cursor-pointer dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:ring-blue-800">
                                        <option value="Exemplary">{t('role_exemplary', language)}</option>
                                        <option value="MS">{t('role_ms', language)}</option>
                                        <option value="Elder">{t('role_elder', language)}</option>
                                    </select>
                                </div>
                                <div className="mb-2">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_keyman', language)}</label>
                                    <select value={formData.keyManId} onChange={(e) => setFormData({...formData, keyManId: e.target.value})} className="border border-gray-300 p-2.5 rounded-xl w-48 bg-white text-gray-900 focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm cursor-pointer dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:ring-blue-800" disabled>
                                        <option value="">-- None --</option>
                                    </select>
                                </div>

                                <div className="w-full">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_perms', language)}</label>
                                    <div className="flex flex-wrap bg-white p-4 rounded-xl border border-gray-200 mb-4 shadow-sm dark:bg-slate-800 dark:border-slate-700">
                                        {areas.map(area => renderCheckbox(area.capability, area.name))}
                                        {renderCheckbox('keyman', t('roster_keyman', language).toUpperCase())}
                                    </div>
                                </div>
                                <div className="w-full mb-4">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_unavail', language)}</label>
                                    <div className="flex flex-wrap bg-white p-4 rounded-xl border border-gray-200 shadow-sm dark:bg-slate-800 dark:border-slate-700">
                                        {shifts.map(s => (
                                            <label key={s.id} className="flex items-center cursor-pointer mr-6 select-none">
                                                <input type="checkbox" checked={formData.unavailable && formData.unavailable.includes(s.id)} onChange={e=>handleUnavailableChange(s.id, e.target.checked)} className="mr-2 w-4 h-4 text-red-500 rounded border-gray-300 focus:ring-red-200 dark:border-slate-600 dark:bg-slate-700"/>
                                                <span className="text-sm font-medium text-gray-700 dark:text-gray-300">{s.label}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={savePerson} className={`px-6 py-2.5 rounded-full font-bold shadow-md transition-all active:scale-95 text-white bg-blue-600 hover:bg-blue-700 shadow-blue-200 dark:shadow-none`}>{t('roster_add_person', language)}</button>
                            </div>
                        </div>

                        <div className="flex flex-col items-center justify-center py-16 text-center border-2 border-dashed border-gray-200 rounded-3xl bg-gray-50/50 dark:bg-slate-800/50 dark:border-slate-700">
                            <div className="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center text-2xl mb-4 shadow-sm dark:bg-slate-700 dark:text-blue-400">
                                <i className="fa fa-user-plus"></i>
                            </div>
                            <h3 className="text-xl font-bold text-gray-800 mb-2 dark:text-white">{t('roster_empty', language)}</h3>
                            <p className="text-gray-500 max-w-sm mb-6 dark:text-gray-400">{t('roster_empty_desc', language) || "Add brothers manually using the form above, or import your existing list to get started quickly."}</p>
                            <div className="relative overflow-hidden inline-block group">
                                <button className="bg-white border border-gray-200 text-gray-700 py-2.5 px-6 rounded-full font-semibold shadow-sm hover:bg-gray-50 transition-all active:scale-95 flex items-center gap-2 dark:bg-slate-800 dark:border-slate-600 dark:text-gray-200 dark:hover:bg-slate-700">
                                    <i className="fa fa-file-csv text-green-600 dark:text-green-400"></i> {t('roster_import', language)}
                                </button>
                                <input type="file" accept=".csv" onChange={handleCSVUpload} className="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer" />
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm">
                    {csvData && <CSVMapperModal data={csvData} onImport={handleImportFinish} onClose={() => setCsvData(null)} language={language} />}
                    {/* HEADER & IMPORT */}
                    <div className="flex justify-between items-center mb-8">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-900 tracking-tight dark:text-white">{t('roster_title', language)}</h2>
                            <p className="text-gray-500 text-sm mt-1 dark:text-gray-400">{personnel.length} {t('brothers_available', language) || 'brothers available'}</p>
                        </div>
                        <div className="relative overflow-hidden inline-block group">
                            <button className="bg-purple-500 text-white py-2 px-5 rounded-full font-semibold shadow-sm hover:bg-purple-600 hover:shadow-md transition-all active:scale-95 flex items-center gap-2"><i className="fa fa-file-csv"></i> {t('roster_import', language)}</button>
                            <input type="file" accept=".csv" onChange={handleCSVUpload} className="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer" />
                        </div>
                    </div>

                    {/* EDIT FORM */}
                        <div className={`p-6 rounded-2xl border mb-8 transition-colors ${editingId ? 'bg-yellow-50/50 border-yellow-200 dark:bg-yellow-900/20 dark:border-yellow-700' : 'bg-gray-50/50 border-gray-200 dark:bg-slate-800/50 dark:border-slate-700'}`}>
                        <div className="flex justify-between items-center mb-4">
                                <h3 className="text-sm font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400">{editingId ? 'Editing Personnel' : t('roster_add_person', language)}</h3>
                            {editingId && <button onClick={cancelEdit} className="text-xs text-red-500 hover:text-red-700 font-medium dark:text-red-400 dark:hover:text-red-300">{t('btn_cancel', language)}</button>}
                        </div>
                        <div className="flex flex-wrap gap-4 items-end">
                            <div className="mb-2">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_name', language)}</label>
                                    <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="border border-gray-300 p-2.5 rounded-xl w-48 bg-white text-gray-900 focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:ring-blue-800" placeholder="Full Name" />
                            </div>
                            <div className="mb-2">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_cong', language)}</label>
                                    <input type="text" list="congregation-list" value={formData.congregation} onChange={(e) => setFormData({...formData, congregation: e.target.value})} className="border border-gray-300 p-2.5 rounded-xl w-32 bg-white text-gray-900 focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:ring-blue-800" placeholder="Congregation" />
                                    <datalist id="congregation-list">
                                        {uniqueCongregations.map(c => <option key={c} value={c} />)}
                                    </datalist>
                            </div>
                            <div className="mb-2">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_role', language)}</label>
                                    <select value={formData.role} onChange={(e) => setFormData({...formData, role: e.target.value})} className="border border-gray-300 p-2.5 rounded-xl w-32 bg-white text-gray-900 focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm cursor-pointer dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:ring-blue-800">
                                    <option value="Exemplary">{t('role_exemplary', language)}</option>
                                    <option value="MS">{t('role_ms', language)}</option>
                                    <option value="Elder">{t('role_elder', language)}</option>
                                </select>
                            </div>
                            <div className="mb-2">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_keyman', language)}</label>
                                    <select value={formData.keyManId} onChange={(e) => setFormData({...formData, keyManId: e.target.value})} className="border border-gray-300 p-2.5 rounded-xl w-48 bg-white text-gray-900 focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm cursor-pointer dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:ring-blue-800">
                                    <option value="">-- None --</option>
                                    {personnel.filter(p => p.caps && p.caps.includes('keyman') && p.id !== editingId).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                </select>
                            </div>

                            <div className="w-full">
                                <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_perms', language)}</label>
                                <div className="flex flex-wrap bg-white p-4 rounded-xl border border-gray-200 mb-4 shadow-sm dark:bg-slate-800 dark:border-slate-700">
                                    {areas.map(area => renderCheckbox(area.capability, area.name))}
                                    {renderCheckbox('keyman', t('roster_keyman', language).toUpperCase())}
                                </div>
                            </div>
                            <div className="w-full mb-4">
                                <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">{t('roster_unavail', language)}</label>
                                <div className="flex flex-wrap bg-white p-4 rounded-xl border border-gray-200 shadow-sm dark:bg-slate-800 dark:border-slate-700">
                                    {shifts.map(s => (
                                        <label key={s.id} className="flex items-center cursor-pointer mr-6 select-none">
                                            <input type="checkbox" checked={formData.unavailable && formData.unavailable.includes(s.id)} onChange={e=>handleUnavailableChange(s.id, e.target.checked)} className="mr-2 w-4 h-4 text-red-500 rounded border-gray-300 focus:ring-red-200 dark:border-slate-600 dark:bg-slate-700"/>
                                            <span className="text-sm font-medium text-gray-700 dark:text-gray-300">{s.label}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <button onClick={savePerson} className={`px-6 py-2.5 rounded-full font-bold shadow-md transition-all active:scale-95 text-white ${editingId ? 'bg-yellow-500 hover:bg-yellow-600 shadow-yellow-200 dark:shadow-none' : 'bg-blue-600 hover:bg-blue-700 shadow-blue-200 dark:shadow-none'}`}>{editingId ? 'Update Person' : t('roster_add_person', language)}</button>
                        </div>
                    </div>

                    {/* ROSTER LIST (Key Man Groups) */}
                    <div className="space-y-8">
                        {groups.map(group => (
                            <div
                                key={group.keyMan ? group.keyMan.id : 'none'}
                                className={`droppable-group border border-gray-100 rounded-2xl overflow-hidden shadow-sm transition-all duration-300 ${dragOverGroup === (group.keyMan ? group.keyMan.id : 'none') ? 'bg-blue-50/50 ring-2 ring-blue-200 ring-offset-2' : 'bg-white'}`}
                                onDragOver={(e) => handleDragOver(e, group.keyMan ? group.keyMan.id : 'none')}
                                onDrop={(e) => handleDrop(e, group.keyMan ? group.keyMan.id : null)}
                            >
                                {/* GROUP HEADER */}
                                <div className="bg-gray-50/50 p-4 border-b border-gray-100 flex justify-between items-center backdrop-blur-sm dark:bg-slate-800/50 dark:border-slate-700">
                                    {group.keyMan && editingId === group.keyMan.id ? (
                                        <div className="w-full">
                                            <div className="flex justify-between items-start mb-4">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-8 h-8 rounded-lg flex items-center justify-center shadow-sm bg-blue-100 text-blue-600 dark:bg-blue-900 dark:text-blue-300">
                                                        <i className="fa fa-user-tie"></i>
                                                    </div>

                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
                                                {/* ROW 1: Name & Role */}
                                                <div>

                                                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                                                        className="border border-gray-300 p-2 rounded-lg w-full bg-white text-gray-900 focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white"

                                                        autoFocus

                                                    <input

                                                        list="congregation-list"
                                                        value={formData.congregation}
                                                        onChange={(e) => setFormData({...formData, congregation: e.target.value})}

        function SearchableSelect({ value, onChange, options, placeholder, conflictMsg, isWarning, isAuto, getConflict, pos, shiftId, assignments, language }) {
            const [isOpen, setIsOpen] = useState(false);
            const [search, setSearch] = useState("");
            const dropdownRef = useRef(null);
            const inputRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setIsOpen(false);
                        setSearch("");
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const selectedOption = useMemo(() => {
                const id = parseInt(value);
                return isNaN(id) ? null : options.find(o => o.id === id);
            }, [options, value]);

            const filteredOptions = useMemo(() => {
                const s = search.toLowerCase();
                // Pre-calculate shift counts for sorting
                const list = options.map(o => {
                    let count = 0;
                    Object.keys(assignments).forEach(key => {
                        if (getAssignId(assignments[key]) === o.id && key.includes('_')) count++;
                    });
                    return { ...o, shiftCount: count };
                });

                return list
                    .filter(o => o.name.toLowerCase().includes(s))
                    .sort((a, b) => {
                        // 1. Qualified first
                        if (a.qualified && !b.qualified) return -1;
                        if (!a.qualified && b.qualified) return 1;
                        // 2. Least busy first
                        if (a.shiftCount !== b.shiftCount) return a.shiftCount - b.shiftCount;
                        // 3. Alphabetical
                        return a.name.localeCompare(b.name);
                    });
            }, [options, search, assignments]);

            return (
                <div className="relative w-full" ref={dropdownRef}>
                    <div
                        className={`w-full py-1.5 px-2 pr-6 rounded-lg text-sm transition-all cursor-pointer flex items-center justify-between
                            ${conflictMsg
                                ? (isWarning ? 'bg-white border border-yellow-300 text-yellow-800 shadow-sm shadow-yellow-100 dark:bg-slate-800 dark:border-yellow-600 dark:text-yellow-300' : 'bg-white border border-red-300 text-red-700 shadow-sm shadow-red-100 dark:bg-slate-800 dark:border-red-600 dark:text-red-300')
                                : 'bg-white/50 border border-transparent hover:bg-white hover:border-gray-200 hover:shadow-sm focus-within:bg-white focus-within:border-blue-300 text-gray-700 dark:bg-slate-700/50 dark:text-gray-200 dark:hover:bg-slate-600 dark:focus-within:bg-slate-600 dark:border-transparent'}
                            ${!value ? 'text-gray-400 dark:text-gray-500 font-normal' : 'font-medium'}
                        `}
                        onClick={() => {
                            setIsOpen(!isOpen);
                            if (!isOpen) setTimeout(() => inputRef.current?.focus(), 50);
                        }}
                    >
                        <span className="truncate">{selectedOption ? selectedOption.name : (placeholder || "Select...")}</span>

                                        const id = parseInt(value);

        function PersonnelSidebar({ personnel, shifts, assignments, positions, language }) {

                    <div className="p-4 border-b border-gray-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50">

                            <input
                                type="text"
                                className="w-full pl-8 pr-3 py-1.5 text-xs border border-gray-200 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                                placeholder={t('search_placeholder', language)}
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}

                        </div>
                        <select
                            value={filterRole}
                            onChange={(e) => setFilterRole(e.target.value)}
                            className="w-full p-1.5 text-[10px] font-black uppercase border border-gray-200 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 outline-none"
                        >

                                >
                                    <div className="flex justify-between items-start gap-1">
                                        <div className="truncate flex items-center gap-2">
                                            <div className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${getHeatColor(shiftCount)}`}></div>
                                            <div className="truncate">
                                                <div className="text-xs font-bold text-gray-700 dark:text-gray-200 group-hover:text-blue-600 transition-colors truncate">{p.name}</div>
                                                <div className="text-[9px] text-gray-400 uppercase font-bold">{p.role}</div>

        function AssignmentCell({ shiftId, pos, assignments, personnel, onAssign, onFindReplacement, getConflict, areas, tags, hoveredMirrorKey, setHoveredMirrorKey, language }) {
            const [isDragOver, setIsDragOver] = useState(false);

            if (pos.validShifts && !pos.validShifts.includes(shiftId) && shiftId !== 'all') return <td className="p-3 bg-gray-50/50 border-l border-dashed border-gray-200 dark:bg-slate-800/50 dark:border-slate-700 text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest cursor-not-allowed">N/A</td>;

            const isMirror = pos.isMirror;
            const sourcePosId = isMirror ? (pos.id === 'lobby_ext_1' ? 'ext_walk_1' : 'ext_walk_2') : null;
            const assignmentKey = pos.type === 'auditorium' ? pos.id : `${pos.id}_${shiftId}`;

            // Check if THIS cell is being hovered by its mirror counterpart
            const isTargetedByHover = hoveredMirrorKey === assignmentKey;

            if (isMirror) {
                const mirrorKey = `${sourcePosId}_${shiftId}`;
                const mirrorId = getAssignId(assignments[mirrorKey]);
                const mirrorPerson = personnel.find(p => p.id === mirrorId);
                return (
                    <td 
                        onMouseEnter={() => setHoveredMirrorKey(mirrorKey)}
                        onMouseLeave={() => setHoveredMirrorKey(null)}
                        className={`p-3 mirrored-cell text-xs border-l border-dashed border-gray-200 transition-all ${isTargetedByHover ? 'mirror-highlight' : ''}`}
                    >
                        {mirrorPerson ? <span className="flex items-center gap-1 text-orange-700"><i className="fa fa-link text-xs"></i> {mirrorPerson.name}</span> : <span className="text-gray-400 italic">-- Linked --</span>}
                    </td>
                );
            }

            const assignmentVal = assignments[assignmentKey];
            const assignedId = getAssignId(assignmentVal);
            const isAuto = isAutoAssigned(assignmentVal);
            const conflictData = getConflict(assignedId, pos, shiftId, assignments);
            const conflictMsg = conflictData ? conflictData.msg : null;
            const isWarning = conflictData ? conflictData.type === 'warning' : false;
            const assignedPerson = personnel.find(p => p.id === assignedId);

            // Handle hover for source cells (highlight their mirrors)
            const handleMouseEnter = () => {
                // If this is a source for mirrors, highlight the mirrors
                if (pos.id === 'ext_walk_1') setHoveredMirrorKey(`lobby_ext_1_${shiftId}`);
                if (pos.id === 'ext_walk_2') setHoveredMirrorKey(`lobby_ext_2_${shiftId}`);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragOver(false);
                const personId = e.dataTransfer.getData("personId");
                if (personId) {
                    onAssign(assignmentKey, personId);
                }
            };

            const getFilteredCandidates = () => {
                const area = areas.find(a => a.id === pos.areaId);
                const requiredCap = area ? area.capability : '';

                // Determine effective restriction (Inheritance: Pos > Legacy > Area)
                let limitType = pos.limitType;
                let limitValue = pos.limitValue;
                if (!limitType && pos.teamKeyManId) {
                    limitType = 'keyman';
                    limitValue = pos.teamKeyManId;
                }
                if (!limitType && area && area.limitType) {
                    limitType = area.limitType;
                    limitValue = area.limitValue;
                }

                // Create a list of ALL personnel, but mark if they are recommended or not
                let candidates = personnel.map(p => {
                    let qualified = true;
                    if (!p.caps || !p.caps.includes(requiredCap)) qualified = false;
                    if (pos.keyMan && (!p.caps || !p.caps.includes('keyman'))) qualified = false;

                    // Tag Restrictions
                    if (tags && p.tags) {
                        for (let tid of p.tags) {
                            const tag = tags.find(t => t.id === tid);
                            if (tag && tag.restrictedAreas && tag.restrictedAreas.includes(pos.areaId)) qualified = false;
                        }
                    }

                    // Assignment Constraints
                    if (limitType && limitValue) {
                        if (limitType === 'keyman') {
                            if (p.keyManId !== parseInt(limitValue)) qualified = false;
                        } else if (limitType === 'congregation') {
                            if (p.congregation !== limitValue) qualified = false;
                        } else if (limitType === 'tag') {
                            if (!p.tags || !p.tags.includes(limitValue)) qualified = false;
                        }
                    }

                    return { ...p, qualified };
                });

                // Sort: Qualified first, then Team-Match (Legacy), then Alphabetical
                candidates.sort((a,b) => {
                    if (a.qualified && !b.qualified) return -1;
                    if (!a.qualified && b.qualified) return 1;

                    // Prioritize Team Match (Legacy support for highlighting if no strict constraint)
                    if (pos.teamKeyManId && !limitType) {
                        const aTeam = a.keyManId === pos.teamKeyManId;
                        const bTeam = b.keyManId === pos.teamKeyManId;
                        if(aTeam && !bTeam) return -1;
                        if(!aTeam && bTeam) return 1;
                    }

                    return a.name.localeCompare(b.name);
                });

                if (assignedId && !assignedPerson) {
                    const unknownPerson = { id: assignedId, name: "Unknown (Removed)", qualified: false };
                    return [unknownPerson, ...candidates];
                }

                if (assignedPerson && !candidates.find(c => c.id === assignedPerson.id)) {
                    // Ensure current assignment is in list even if logic changes
                    return [assignedPerson, ...candidates];
                }
                return candidates;
            };

            const filteredCandidates = getFilteredCandidates();

            const quickFixes = useMemo(() => {
                if (!conflictMsg) return [];
                // Top 3 qualified candidates with ZERO conflicts
                return filteredCandidates
                    .filter(p => p.qualified && !getConflict(p.id, pos, shiftId, assignments))
                    .slice(0, 3);
            }, [conflictMsg, filteredCandidates, getConflict, pos, shiftId, assignments]);

            return (
                <td
                    onMouseEnter={handleMouseEnter}
                    onMouseLeave={() => setHoveredMirrorKey(null)}
                    onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }}
                    onDragLeave={() => setIsDragOver(false)}
                    onDrop={handleDrop}
                    className={`p-3 border-l border-dashed border-gray-200 dark:border-slate-700 transition-all duration-300 relative group-hover:bg-opacity-50 schedule-drop-zone ${isDragOver ? 'drag-over' : ''} ${isTargetedByHover ? 'mirror-highlight' : ''} ${conflictMsg ? (isWarning ? 'bg-yellow-50/80 dark:bg-yellow-900/40' : 'bg-red-50/80 dark:bg-red-900/40') : (isAuto ? 'bg-green-50/30 dark:bg-green-900/20' : '')}`}
                >
                    <div className="flex items-center gap-2">
                        {isAuto && <i className="fa fa-robot text-green-600 dark:text-green-400 text-[10px]" title="Auto-Assigned"></i>}
                        <div className="relative w-full">
                            <SearchableSelect
                                value={assignedId || ""}
                                onChange={(val) => onAssign(assignmentKey, val)}
                                options={filteredCandidates}
                                placeholder={t('grid_unassigned', language)}
                                conflictMsg={conflictMsg}
                                isWarning={isWarning}
                                isAuto={isAuto}
                                getConflict={getConflict}
                                pos={pos}
                                shiftId={shiftId}
                                assignments={assignments}
                                language={language}
                            />
                        </div>
                        <button onClick={() => onFindReplacement(pos, shiftId)} className="w-6 h-6 flex items-center justify-center rounded-full text-gray-300 hover:text-blue-600 hover:bg-blue-50 transition-colors" title="Find Replacement"><i className="fa fa-search text-xs"></i></button>
                    </div>
                    {conflictMsg && (
                        <div className="mt-1.5 space-y-1.5">
                            <div className={`text-[10px] font-bold flex items-center gap-1 ${isWarning ? 'text-yellow-600' : 'text-red-500'}`}>
                                <i className={`fa ${isWarning ? 'fa-exclamation-triangle' : 'fa-ban'}`}></i> {conflictMsg}
                            </div>
                            {quickFixes.length > 0 && (
                                <div className="flex flex-wrap gap-1">
                                    <span className="text-[8px] font-black uppercase text-gray-400 w-full mb-0.5">{t('grid_suggestions', language)}:</span>
                                    {quickFixes.map(p => (
                                        <button
                                            key={p.id}
                                            onClick={() => onAssign(assignmentKey, p.id)}
                                            className="text-[9px] bg-white border border-gray-200 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-200 hover:bg-green-50 hover:border-green-300 hover:text-green-700 px-1.5 py-0.5 rounded shadow-sm transition-all active:scale-95"
                                            title={`Quick Assign ${p.name}`}
                                        >
                                            {p.name.split(" ")[0]}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </td>
            );
        }

        function FindReplacementModal({ slot, personnel, assignments, areas, positions, shifts, tags, onAssign, onClose, language }) {
            const [candidates, setCandidates] = useState([]);

            useEffect(() => {
                if (!slot) return;
                const { pos, shiftId } = slot;
                const area = areas.find(a => a.id === pos.areaId);
                const requiredCap = area ? area.capability : '';

                // Logic similar to Auto-Fill but purely filtering
                const potential = personnel.filter(p => {
                    // 1. Capabilities
                    if (!p.caps || !p.caps.includes(requiredCap)) return false;
                    if (pos.keyMan && (!p.caps || !p.caps.includes('keyman'))) return false;

                    // 2. Availability
                    if (p.unavailable && p.unavailable.includes(shiftId)) return false;

                    // 3. Tag Restrictions
                    if (tags && p.tags) {
                        for (let tid of p.tags) {
                            const tag = tags.find(t => t.id === tid);
                            if (tag) {
                                if (tag.restrictedAreas && tag.restrictedAreas.includes(pos.areaId)) return false;
                                if (tag.restrictedShifts) {
                                    if (tag.restrictedShifts.includes(shiftId)) return false;
                                    if (shiftId === 'all' && tag.restrictedShifts.includes('all_day')) return false;
                                }
                            }
                        }
                    }

                    return true;
                });

                // Now check if they are free
                const freeCandidates = potential.filter(p => {
                     // Check if busy at ANY auditorium spot
                     for (let otherPos of positions) {
                         if (otherPos.type === 'auditorium' && getAssignId(assignments[otherPos.id]) === p.id) return false;

                         if (otherPos.type === 'rotational' && !otherPos.isMirror) {
                            // Check if busy at THIS shift
                            if (otherPos.validShifts && !otherPos.validShifts.includes(shiftId)) continue;
                            if (getAssignId(assignments[`${otherPos.id}_${shiftId}`]) === p.id) return false;
                         }
                     }
                     return true;
                });

                setCandidates(freeCandidates.sort((a,b) => a.name.localeCompare(b.name)));

            }, [slot, personnel, assignments, areas, positions, shifts]);

            if (!slot) return null;

            return (
                <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50">
                    <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-lg h-3/4 flex flex-col border border-gray-100 transform transition-all scale-100 dark:bg-slate-900 dark:border-slate-800">
                        <div className="flex justify-between items-center mb-6">
                            <div>
                                <h3 className="font-bold text-xl text-gray-900 tracking-tight dark:text-white">{t('grid_find_replacement', language)}</h3>
                                <p className="text-sm text-gray-500 dark:text-gray-400">{slot.pos.name} • {slot.shiftId === 'all' ? (t('grid_all_day', language)) : shifts.find(s=>s.id===slot.shiftId)?.label}</p>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 hover:text-gray-800 transition-colors dark:bg-slate-800 dark:text-gray-400 dark:hover:text-white"><i className="fa fa-times"></i></button>
                        </div>
                        <div className="overflow-y-auto flex-1 border border-gray-100 rounded-2xl p-2 bg-gray-50/50 shadow-inner dark:bg-slate-800/50 dark:border-slate-800">
                            {candidates.length === 0 ? <div className="text-center text-gray-500 mt-10 dark:text-gray-400">{t('no_candidates_found', language) || "No qualified, available candidates found."}</div> : (
                                <table className="w-full text-sm">
                                    <tbody>
                                        {candidates.map(p => (
                                            <tr key={p.id} className="bg-white border-b hover:bg-blue-50 cursor-pointer dark:bg-slate-900 dark:border-slate-800 dark:hover:bg-slate-800 dark:text-gray-200" onClick={() => onAssign(p.id)}>
                                                <td className="p-3 font-medium">{p.name}</td>
                                                <td className="p-3 text-right text-xs text-gray-500 dark:text-gray-400">{p.role}</td>
                                                <td className="p-3 text-right"><button className="bg-green-500 text-white px-3 py-1 rounded text-xs hover:bg-green-600 shadow-sm shadow-green-200 dark:shadow-none">{t('btn_assign', language) || 'Assign'}</button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- LOG VIEW COMPONENT ---
        function LogView({ log, language }) {
            if (!log || log.length === 0) return <div className="glass-panel p-8 rounded-3xl text-gray-500 text-center italic dark:text-gray-400">{t('no_logs', language) || "No logs available. Run Auto-Fill first."}</div>;
            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm">
                    <h2 className="text-2xl font-bold mb-6 text-gray-900 tracking-tight dark:text-white">{t('log_title', language)}</h2>
                    <div className="h-96 overflow-y-auto border border-gray-100 p-4 rounded-xl bg-gray-50/50 text-xs font-mono shadow-inner dark:bg-slate-900/50 dark:border-slate-800">
                        {log.map((entry, i) => (
                            <div key={i} className={`log-entry ${entry.type === 'auditorium' ? 'text-blue-700 dark:text-blue-300' : 'text-gray-700 dark:text-gray-300'}`}>
                                {entry.msg}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function StatsView({ personnel, assignments, shifts, positions, language }) {
            const formatMinutesToHHMM = (totalMinutes) => {
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                const pad = (num) => num.toString().padStart(2, '0');
                return `${pad(hours)}:${pad(minutes)}`;
            };

            const getBrotherStats = () => {
                const stats = personnel.map(p => {
                    let minutesAway = 0;
                    let assignmentLabels = [];

                    Object.keys(assignments).forEach(key => {
                        const assignVal = assignments[key];
                        const assignedId = getAssignId(assignVal);

                        if (assignedId === p.id) {
                            let posId = key;
                            let shiftId = 'all';
                            if (key.includes('_')) {
                                const parts = key.split('_');
                                const lastPart = parts[parts.length-1];
                                if (shifts.find(s => s.id === lastPart)) {
                                    shiftId = lastPart;
                                    posId = parts.slice(0, parts.length-1).join('_');
                                }
                            }
                            const pos = positions.find(pos => pos.id === posId);
                            if (pos) {
                                const shift = shifts.find(s => s.id === shiftId);
                                if (pos.type !== 'auditorium') {
                                    if (shift) minutesAway += shift.minutes;
                                }
                                assignmentLabels.push(`${pos.name} (${shift ? shift.label : (language === 'en' ? 'All Day' : t('grid_all_day', language))})`);
                            }
                        }
                    });

                    const percentage = Math.round((minutesAway / TOTAL_PROGRAM_MINUTES) * 100);
                    return { ...p, minutesAway, percentage, assignmentLabels };
                });

                return stats.sort((a,b) => b.minutesAway - a.minutesAway);
            };

            const stats = getBrotherStats();

            const getBarColor = (pct) => {
                if (pct > 50) return 'bg-red-500';
                if (pct > 25) return 'bg-yellow-500';
                if (pct === 0) return 'bg-blue-400';
                return 'bg-green-500';
            };

            const getRoleColor = (role) => {
                if(role === 'Elder') return 'text-yellow-600 font-bold';
                if(role === 'MS') return 'text-blue-600 font-bold';
                return 'text-gray-500';
            };

            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm">

                                        <td className={`p-4 ${p.percentage > 50 ? 'text-red-500 font-bold dark:text-red-400' : 'text-gray-600 dark:text-gray-300'}`}>{p.percentage}%</td>

                            {rules.auditoriumRotationMode && (
                                <div className="mt-4 pt-4 border-t border-blue-200 dark:border-blue-800">

                                        <h4 className="font-bold text-gray-700 dark:text-gray-300 text-sm">Max Relief % per Shift</h4>

                                    <p className="text-xs text-gray-500 mb-2 dark:text-gray-400">Limit how many Auditorium brothers can be pulled away at once.</p>
                                    <input type="range" min="5" max="50" step="5" value={rules.auditoriumCoverage || 25} onChange={e=>setVal('auditoriumCoverage', parseInt(e.target.value))} className="w-full" />
