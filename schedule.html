                                                            <td className="px-6 py-3 text-center">
                                                                {isEditing ? (
                                                                    <div className="flex justify-center gap-2">
                                                                        <button onClick={savePerson} className="text-green-600 hover:text-green-800 font-bold text-xs bg-green-50 px-2 py-1 rounded border border-green-200">Save</button>
                                                                        <button onClick={cancelEdit} className="text-gray-500 hover:text-gray-700 text-xs px-2 py-1">Cancel</button>
                                                                    </div>
                                                                ) : (
                                                                    <div className="flex justify-center gap-3">
                                                                        <button onClick={() => startEdit(p)} className="text-gray-400 hover:text-blue-600 transition-colors"><i className="fa fa-pencil"></i></button>
                                                                        <button onClick={() => deletePerson(p.id)} className="text-gray-400 hover:text-red-500 transition-colors"><i className="fa fa-trash"></i></button>
                                                                    </div>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function AssignmentCell({ shiftId, pos, assignments, personnel, onAssign, onFindReplacement, getConflict, areas, tags }) {
            if (pos.validShifts && !pos.validShifts.includes(shiftId) && shiftId !== 'all') return <td className="p-3 bg-gray-50/50 border-l border-dashed border-gray-200 dark:bg-slate-800/50 dark:border-slate-700 text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest cursor-not-allowed">N/A</td>;

            if (pos.isMirror) {
                const sourceKey = pos.id === 'lobby_ext_1' ? 'ext_walk_1' : 'ext_walk_2';
                const mirrorKey = `${sourceKey}_${shiftId}`;
                const mirrorId = getAssignId(assignments[mirrorKey]);
                const mirrorPerson = personnel.find(p => p.id === mirrorId);
                return (
                    <td className="p-3 mirrored-cell text-xs border-l border-dashed border-gray-200">
                        {mirrorPerson ? <span className="flex items-center gap-1 text-orange-700"><i className="fa fa-link text-xs"></i> {mirrorPerson.name}</span> : <span className="text-gray-400 italic">-- Linked --</span>}
                    </td>
                );
            }

            const assignmentKey = pos.type === 'auditorium' ? pos.id : `${pos.id}_${shiftId}`;
            const assignmentVal = assignments[assignmentKey];
            const assignedId = getAssignId(assignmentVal);
            const isAuto = isAutoAssigned(assignmentVal);
            const conflictData = getConflict(assignedId, pos, shiftId, assignments);
            const conflictMsg = conflictData ? conflictData.msg : null;
            const isWarning = conflictData ? conflictData.type === 'warning' : false;
            const assignedPerson = personnel.find(p => p.id === assignedId);

            const getFilteredCandidates = () => {
                const area = areas.find(a => a.id === pos.areaId);
                const requiredCap = area ? area.capability : '';

                // Determine effective restriction (Inheritance: Pos > Legacy > Area)
                let limitType = pos.limitType;
                let limitValue = pos.limitValue;
                if (!limitType && pos.teamKeyManId) {
                    limitType = 'keyman';
                    limitValue = pos.teamKeyManId;
                }
                if (!limitType && area && area.limitType) {
                    limitType = area.limitType;
                    limitValue = area.limitValue;
                }

                // Create a list of ALL personnel, but mark if they are recommended or not
                let candidates = personnel.map(p => {
                    let qualified = true;
                    if (!p.caps || !p.caps.includes(requiredCap)) qualified = false;
                    if (pos.keyMan && (!p.caps || !p.caps.includes('keyman'))) qualified = false;

                    // Tag Restrictions
                    if (tags && p.tags) {
                        for (let tid of p.tags) {
                            const tag = tags.find(t => t.id === tid);
                            if (tag && tag.restrictedAreas && tag.restrictedAreas.includes(pos.areaId)) qualified = false;
                        }
                    }

                    // Assignment Constraints
                    if (limitType && limitValue) {
                        if (limitType === 'keyman') {
                            if (p.keyManId !== parseInt(limitValue)) qualified = false;
                        } else if (limitType === 'congregation') {
                            if (p.congregation !== limitValue) qualified = false;
                        } else if (limitType === 'tag') {
                            if (!p.tags || !p.tags.includes(limitValue)) qualified = false;
                        }
                    }

                    return { ...p, qualified };
                });

                // Sort: Qualified first, then Team-Match (Legacy), then Alphabetical
                candidates.sort((a,b) => {
                    if (a.qualified && !b.qualified) return -1;
                    if (!a.qualified && b.qualified) return 1;

                    // Prioritize Team Match (Legacy support for highlighting if no strict constraint)
                    if (pos.teamKeyManId && !limitType) {
                        const aTeam = a.keyManId === pos.teamKeyManId;
                        const bTeam = b.keyManId === pos.teamKeyManId;
                        if(aTeam && !bTeam) return -1;
                        if(!aTeam && bTeam) return 1;
                    }

                    return a.name.localeCompare(b.name);
                });

                if (assignedPerson && !candidates.find(c => c.id === assignedPerson.id)) {
                    // Ensure current assignment is in list even if logic changes
                    return [assignedPerson, ...candidates];
                }
                return candidates;
            };

            const filteredCandidates = getFilteredCandidates();

            return (
                <td className={`p-3 border-l border-dashed border-gray-200 dark:border-slate-700 transition-colors duration-300 relative group-hover:bg-opacity-50 ${conflictMsg ? (isWarning ? 'bg-yellow-50/80 dark:bg-yellow-900/40' : 'bg-red-50/80 dark:bg-red-900/40') : (isAuto ? 'bg-green-50/30 dark:bg-green-900/20' : '')}`}>
                    <div className="flex items-center gap-2">
                        {isAuto && <i className="fa fa-magic text-green-600 dark:text-green-400 text-[10px]" title="Auto-Assigned"></i>}
                        <div className="relative w-full">
                            <select
                                className={`w-full py-1.5 px-2 pr-6 rounded-lg text-sm appearance-none outline-none focus:ring-2 focus:ring-opacity-50 transition-shadow cursor-pointer
                                    ${conflictMsg
                                        ? (isWarning ? 'bg-white border border-yellow-300 text-yellow-800 focus:ring-yellow-400 dark:bg-slate-800 dark:border-yellow-600 dark:text-yellow-300' : 'bg-white border border-red-300 text-red-700 focus:ring-red-400 dark:bg-slate-800 dark:border-red-600 dark:text-red-300')
                                        : 'bg-white/50 border border-transparent hover:bg-white hover:border-gray-200 hover:shadow-sm focus:bg-white focus:border-blue-300 focus:ring-blue-400 text-gray-700 dark:bg-slate-700/50 dark:text-gray-200 dark:hover:bg-slate-600 dark:focus:bg-slate-600 dark:border-transparent'}
                                    ${!assignedId ? 'text-gray-400 dark:text-gray-500 font-normal' : 'font-medium'}
                                `}
                                value={assignedId || ""}
                                onChange={(e) => onAssign(assignmentKey, e.target.value)}
                            >
                                <option value="">Select...</option>
                                {assignedId && !assignedPerson && <option value={assignedId}>Unknown (Removed)</option>}
                                {filteredCandidates.map(p => {
                                    const cData = getConflict(p.id, pos, shiftId, assignments);
                                    const isWarn = cData && cData.type === 'warning';
                                    const isTeamMatch = pos.teamKeyManId && p.keyManId === pos.teamKeyManId;
                                    return <option key={p.id} value={p.id} className={!p.qualified ? 'text-gray-400 dark:text-gray-500' : (isTeamMatch ? 'font-bold bg-green-50 dark:bg-green-900 dark:text-green-100' : 'dark:bg-slate-800 dark:text-gray-200')}>
                                        {p.name}
                                        {isTeamMatch ? " (Team)" : ""}
                                        {!p.qualified ? " (Not Qual)" : ""}
                                        {cData ? (isWarn ? " ⚠️" : " ⛔") : ""}
                                    </option>;
                                })}
                            </select>
                            {/* Custom Arrow */}
                            <div className="absolute right-2 top-1/2 transform -translate-y-1/2 pointer-events-none text-gray-400 text-xs">
                                <i className="fa fa-chevron-down"></i>
                            </div>
                        </div>
                        <button onClick={() => onFindReplacement(pos, shiftId)} className="w-6 h-6 flex items-center justify-center rounded-full text-gray-300 hover:text-blue-600 hover:bg-blue-50 transition-colors" title="Find Replacement"><i className="fa fa-search text-xs"></i></button>
                    </div>
                    {conflictMsg && <div className={`text-[10px] mt-1.5 font-bold flex items-center gap-1 ${isWarning ? 'text-yellow-600' : 'text-red-500'}`}><i className={`fa ${isWarning ? 'fa-exclamation-triangle' : 'fa-ban'}`}></i> {conflictMsg}</div>}
                </td>
            );
        }

        function FindReplacementModal({ slot, personnel, assignments, areas, positions, shifts, tags, onAssign, onClose }) {
            const [candidates, setCandidates] = useState([]);

            useEffect(() => {
                if (!slot) return;
                const { pos, shiftId } = slot;
                const area = areas.find(a => a.id === pos.areaId);
                const requiredCap = area ? area.capability : '';

                // Logic similar to auto-fill but purely filtering
                const potential = personnel.filter(p => {
                    // 1. Capabilities
                    if (!p.caps || !p.caps.includes(requiredCap)) return false;
                    if (pos.keyMan && (!p.caps || !p.caps.includes('keyman'))) return false;

                    // 2. Availability
                    if (p.unavailable && p.unavailable.includes(shiftId)) return false;

                    // 3. Tag Restrictions
                    if (tags && p.tags) {
                        for (let tid of p.tags) {
                            const tag = tags.find(t => t.id === tid);
                            if (tag) {
                                if (tag.restrictedAreas && tag.restrictedAreas.includes(pos.areaId)) return false;
                                if (tag.restrictedShifts) {
                                    if (tag.restrictedShifts.includes(shiftId)) return false;
                                    if (shiftId === 'all' && tag.restrictedShifts.includes('all_day')) return false;
                                }
                            }
                        }
                    }

                    return true;
                });

                // Now check if they are free
                const freeCandidates = potential.filter(p => {
                     // Check if busy at ANY auditorium spot
                     for (let otherPos of positions) {
                         if (otherPos.type === 'auditorium' && getAssignId(assignments[otherPos.id]) === p.id) return false;

                         if (otherPos.type === 'rotational' && !otherPos.isMirror) {
                            // Check if busy at THIS shift
                            if (otherPos.validShifts && !otherPos.validShifts.includes(shiftId)) continue;
                            if (getAssignId(assignments[`${otherPos.id}_${shiftId}`]) === p.id) return false;
                         }
                     }
                     return true;
                });

                setCandidates(freeCandidates.sort((a,b) => a.name.localeCompare(b.name)));

            }, [slot, personnel, assignments, areas, positions, shifts]);

            if (!slot) return null;

            return (
                <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50">
                    <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-lg h-3/4 flex flex-col border border-gray-100 transform transition-all scale-100 dark:bg-slate-900 dark:border-slate-800">
                        <div className="flex justify-between items-center mb-6">
                            <div>
                                <h3 className="font-bold text-xl text-gray-900 tracking-tight dark:text-white">Find Replacement</h3>
                                <p className="text-sm text-gray-500 dark:text-gray-400">{slot.pos.name} • {slot.shiftId === 'all' ? 'All Day' : shifts.find(s=>s.id===slot.shiftId)?.label}</p>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 hover:text-gray-800 transition-colors dark:bg-slate-800 dark:text-gray-400 dark:hover:text-white"><i className="fa fa-times"></i></button>
                        </div>
                        <div className="overflow-y-auto flex-1 border border-gray-100 rounded-2xl p-2 bg-gray-50/50 shadow-inner dark:bg-slate-800/50 dark:border-slate-800">
                            {candidates.length === 0 ? <div className="text-center text-gray-500 mt-10 dark:text-gray-400">No qualified, available candidates found.</div> : (
                                <table className="w-full text-sm">
                                    <tbody>
                                        {candidates.map(p => (
                                            <tr key={p.id} className="bg-white border-b hover:bg-blue-50 cursor-pointer dark:bg-slate-900 dark:border-slate-800 dark:hover:bg-slate-800 dark:text-gray-200" onClick={() => onAssign(p.id)}>
                                                <td className="p-3 font-medium">{p.name}</td>
                                                <td className="p-3 text-right text-xs text-gray-500 dark:text-gray-400">{p.role}</td>
                                                <td className="p-3 text-right"><button className="bg-green-500 text-white px-3 py-1 rounded text-xs hover:bg-green-600 shadow-sm shadow-green-200 dark:shadow-none">Assign</button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- LOG VIEW COMPONENT ---
        function LogView({ log }) {
            if (!log || log.length === 0) return <div className="glass-panel p-8 rounded-3xl text-gray-500 text-center italic dark:text-gray-400">No logs available. Run Auto-Fill first.</div>;
            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm">
                    <h2 className="text-2xl font-bold mb-6 text-gray-900 tracking-tight dark:text-white">Auto-Assign Logic Log</h2>
                    <div className="h-96 overflow-y-auto border border-gray-100 p-4 rounded-xl bg-gray-50/50 text-xs font-mono shadow-inner dark:bg-slate-900/50 dark:border-slate-800">
                        {log.map((entry, i) => (
                            <div key={i} className={`log-entry ${entry.type === 'auditorium' ? 'text-blue-700 dark:text-blue-300' : 'text-gray-700 dark:text-gray-300'}`}>
                                {entry.msg}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function StatsView({ personnel, assignments, shifts, positions }) {
            const formatMinutesToHHMM = (totalMinutes) => {
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                const pad = (num) => num.toString().padStart(2, '0');
                return `${pad(hours)}:${pad(minutes)}`;
            };

            const getBrotherStats = () => {
                const stats = personnel.map(p => {
                    let minutesAway = 0;
                    let assignmentLabels = [];

                    Object.keys(assignments).forEach(key => {
                        const assignVal = assignments[key];
                        const assignedId = getAssignId(assignVal);

                        if (assignedId === p.id) {
                            let posId = key;
                            let shiftId = 'all';
                            if (key.includes('_')) {
                                const parts = key.split('_');
                                const lastPart = parts[parts.length-1];
                                if (shifts.find(s => s.id === lastPart)) {
                                    shiftId = lastPart;
                                    posId = parts.slice(0, parts.length-1).join('_');
                                }
                            }
                            const pos = positions.find(pos => pos.id === posId);
                            if (pos) {
                                const shift = shifts.find(s => s.id === shiftId);
                                if (pos.type !== 'auditorium') {
                                    if (shift) minutesAway += shift.minutes;
                                }
                                assignmentLabels.push(`${pos.name} (${shift ? shift.label : 'All Day'})`);
                            }
                        }
                    });

                    const percentage = Math.round((minutesAway / TOTAL_PROGRAM_MINUTES) * 100);
                    return { ...p, minutesAway, percentage, assignmentLabels };
                });

                return stats.sort((a,b) => b.minutesAway - a.minutesAway);
            };

            const stats = getBrotherStats();

            const getBarColor = (pct) => {
                if (pct > 50) return 'bg-red-500';
                if (pct > 25) return 'bg-yellow-500';
                if (pct === 0) return 'bg-blue-400';
                return 'bg-green-500';
            };

            const getRoleColor = (role) => {
                if(role === 'Elder') return 'text-yellow-600 font-bold';
                if(role === 'MS') return 'text-blue-600 font-bold';
                return 'text-gray-500';
            };

            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm">
                    <h2 className="text-2xl font-bold mb-6 text-gray-900 tracking-tight dark:text-white">Time Statistics (Balance Check)</h2>
                    <div className="overflow-hidden rounded-xl border border-gray-100 shadow-sm dark:border-slate-700">
                        <table className="w-full text-sm">
                            <thead>
                                <tr className="bg-gray-50/50 border-b border-gray-100 text-left text-xs font-semibold uppercase tracking-wider text-gray-500 dark:bg-slate-800 dark:border-slate-700 dark:text-gray-400">
                                    <th className="p-4">Brother Name</th>
                                    <th className="p-4">Role</th>
                                    <th className="p-4">Assignments</th>
                                    <th className="p-4">Out-of-Auditorium Time</th>
                                    <th className="p-4">% Missed</th>
                                    <th className="p-4 w-1/3">Visual Load</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-50 dark:divide-slate-700">
                                {stats.map(p => (
                                    <tr key={p.id} className="hover:bg-gray-50/50 transition-colors dark:hover:bg-slate-800/50">
                                        <td className="p-4 font-medium text-gray-700 dark:text-gray-200">{p.name}</td>
                                        <td className={`p-4 ${getRoleColor(p.role)}`}>{p.role}</td>
                                        <td className="p-4 text-xs text-gray-500 dark:text-gray-400">
                                            {p.assignmentLabels.length > 0 ? (
                                                <ul className="list-disc pl-4 space-y-1">
                                                    {p.assignmentLabels.map((lbl, idx) => <li key={idx}>{lbl}</li>)}
                                                </ul>
                                            ) : <span className="text-gray-300 italic dark:text-gray-600">-</span>}
                                        </td>
                                        <td className={`p-4 ${p.minutesAway === 0 ? 'text-blue-600 font-bold dark:text-blue-400' : 'text-gray-600 dark:text-gray-300'}`}>{formatMinutesToHHMM(p.minutesAway)}</td>
                                        <td className={`p-4 ${p.percentage > 50 ? 'text-red-500 font-bold dark:text-red-400' : 'text-gray-600 dark:text-gray-300'}`}>{p.percentage}%</td>
                                        <td className="p-4">
                                            <div className="w-full bg-gray-100 rounded-full h-3 overflow-hidden shadow-inner dark:bg-slate-700">
                                                <div className={`h-full rounded-full ${getBarColor(p.percentage)} transition-all duration-500`} style={{ width: `${Math.max(p.percentage, 5)}%` }}></div>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function RulesView({ rules, setRules }) {
            const toggleRule = (key) => setRules({ ...rules, [key]: !rules[key] });
            const setSeverity = (key, val) => setRules({ ...rules, [key]: val });
            const setVal = (key, val) => setRules({ ...rules, [key]: val });

            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm">
                    <h2 className="text-2xl font-bold text-gray-900 tracking-tight mb-6 dark:text-white">Assignment Rules</h2>
                    <div className="grid gap-4 max-w-2xl">

                        {/* 1. Capabilities */}
                        <div className="flex justify-between items-center p-4 bg-gray-50 rounded border dark:bg-slate-800 dark:border-slate-700">
                            <div>
                                <h3 className="font-bold text-gray-800 dark:text-white">Enforce Capabilities</h3>
                                <p className="text-xs text-gray-500 dark:text-gray-400">Only allow qualified brothers (e.g. 'Auditorium', 'Key Man') to be assigned.</p>
                            </div>
                            <div className="flex items-center gap-2">
                                <select value={rules.capabilitySeverity || 'error'} onChange={e=>setSeverity('capabilitySeverity', e.target.value)} className="border rounded p-1 text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                                    <option value="error">Block (Red)</option>
                                    <option value="warning">Warn (Yellow)</option>
                                    <option value="off">Off</option>
                                </select>
                            </div>
                        </div>

                        {/* 2. Double Booking */}
                        <div className="flex justify-between items-center p-4 bg-gray-50 rounded border dark:bg-slate-800 dark:border-slate-700">
                            <div>
                                <h3 className="font-bold text-gray-800 dark:text-white">Prevent Double Booking</h3>
                                <p className="text-xs text-gray-500 dark:text-gray-400">Ensure a brother is not in two places at once.</p>
                            </div>
                            <select value={rules.doubleBookingSeverity || 'error'} onChange={e=>setSeverity('doubleBookingSeverity', e.target.value)} className="border rounded p-1 text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                                <option value="error">Block (Red)</option>
                                <option value="warning">Warn (Yellow)</option>
                                <option value="off">Off</option>
                            </select>
                        </div>

                        {/* 3. Unavailability */}
                        <div className="flex justify-between items-center p-4 bg-gray-50 rounded border dark:bg-slate-800 dark:border-slate-700">
                            <div>
                                <h3 className="font-bold text-gray-800 dark:text-white">Respect Unavailability</h3>
                                <p className="text-xs text-gray-500 dark:text-gray-400">Do not assign if brother has program part or marked unavailable.</p>
                            </div>
                            <select value={rules.unavailableSeverity || 'error'} onChange={e=>setSeverity('unavailableSeverity', e.target.value)} className="border rounded p-1 text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                                <option value="error">Block (Red)</option>
                                <option value="warning">Warn (Yellow)</option>
                                <option value="off">Off</option>
                            </select>
                        </div>

                        {/* 4. Max Work Percentage */}
                        <div className="p-4 bg-gray-50 rounded border dark:bg-slate-800 dark:border-slate-700">
                            <div className="flex justify-between items-center mb-2">
                                <h3 className="font-bold text-gray-800 dark:text-white">Max Work Load (Program Watch %)</h3>
                                <span className="font-bold text-blue-600 dark:text-blue-400">{rules.maxWorkPercent || 50}%</span>
                            </div>
                            <p className="text-xs text-gray-500 mb-2 dark:text-gray-400">Auto-fill will skip brothers who have worked more than this % of the day.</p>
                            <input type="range" min="10" max="100" step="5" value={rules.maxWorkPercent || 50} onChange={e=>setVal('maxWorkPercent', parseInt(e.target.value))} className="w-full" />
                        </div>

                        {/* 5. Consecutive Shifts */}
                        <div className="flex justify-between items-center p-4 bg-gray-50 rounded border dark:bg-slate-800 dark:border-slate-700">
                            <div>
                                <h3 className="font-bold text-gray-800 dark:text-white">Avoid Consecutive Shifts (Auto-Fill)</h3>
                                <p className="text-xs text-gray-500 dark:text-gray-400">Try to give a break between shifts.</p>
                            </div>
                            <input type="checkbox" checked={rules.avoidConsecutive !== false} onChange={() => toggleRule('avoidConsecutive')} className="h-5 w-5" />
                        </div>

                        {/* 6. Anchor Limits */}
                        <div className="flex justify-between items-center p-4 bg-gray-50 rounded border dark:bg-slate-800 dark:border-slate-700">
                            <div>
                                <h3 className="font-bold text-gray-800 dark:text-white">Enforce Anchor Limits (Auto-Fill)</h3>
                                <p className="text-xs text-gray-500 dark:text-gray-400">Limit how many "All Day" staff can be pulled for temporary relief (Max 1 per section).</p>
                            </div>
                            <input type="checkbox" checked={rules.anchorLimits !== false} onChange={() => toggleRule('anchorLimits')} className="h-5 w-5" />
                        </div>

                        {/* 7. Auditorium Relief Mode */}
                        <div className="p-4 bg-blue-50 rounded border border-blue-100 dark:bg-blue-900/20 dark:border-blue-800">
                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <h3 className="font-bold text-blue-900 dark:text-blue-300">Auditorium Relief Mode</h3>
                                    <p className="text-xs text-blue-700 dark:text-blue-400">Allow Auditorium staff to be double-booked for rotational assignments (Relief Duty).</p>
                                </div>
                                <input type="checkbox" checked={rules.auditoriumRotationMode === true} onChange={() => toggleRule('auditoriumRotationMode')} className="h-5 w-5" />
                            </div>

                            {rules.auditoriumRotationMode && (
                                <div className="mt-4 pt-4 border-t border-blue-200 dark:border-blue-800">
                                    <div className="flex justify-between items-center mb-2">
                                        <h4 className="font-bold text-gray-700 dark:text-gray-300 text-sm">Max Relief % per Shift</h4>
                                        <span className="font-bold text-blue-600 dark:text-blue-400">{rules.auditoriumCoverage || 25}%</span>
                                    </div>
                                    <p className="text-xs text-gray-500 mb-2 dark:text-gray-400">Limit how many Auditorium brothers can be pulled away at once.</p>
                                    <input type="range" min="5" max="50" step="5" value={rules.auditoriumCoverage || 25} onChange={e=>setVal('auditoriumCoverage', parseInt(e.target.value))} className="w-full" />
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        }

        function ScheduleView({ personnel, assignments, setAssignments, onAutoFill, areas, positions, shifts, rules, tags }) {
            const [pendingAction, setPendingAction] = useState(null);
            const [replacementSlot, setReplacementSlot] = useState(null);

            const handleFindReplacement = (pos, shiftId) => {
                setReplacementSlot({ pos, shiftId });
            };

            const handleReplacementAssign = (personId) => {
                if (!replacementSlot) return;
                const { pos, shiftId } = replacementSlot;
                const assignmentKey = pos.type === 'auditorium' ? pos.id : `${pos.id}_${shiftId}`;
                handleAssignAttempt(assignmentKey, personId);
                setReplacementSlot(null);
            };

            const getConflict = (personId, pos, currentShiftId, currentAssignments) => {
                if (!personId) return null;
                const pid = parseInt(personId);
                const person = personnel.find(p => p.id === pid);
                if (!person) return null;

                const area = areas.find(a => a.id === pos.areaId);
                const requiredCap = area ? area.capability : null;

                // 1. Check Permissions
                if (rules.capabilitySeverity !== 'off') {
                    const sev = rules.capabilitySeverity || 'error';
                    if (pos.type === 'auditorium' && (!person.caps || !person.caps.includes('auditorium'))) return { msg: "Qual: Not Aud.", type: sev, key: null };
                    if (pos.keyMan && (!person.caps || !person.caps.includes('keyman'))) return { msg: "Qual: Not Key Man", type: sev, key: null };
                    if (pos.type !== 'auditorium' && requiredCap && (!person.caps || !person.caps.includes(requiredCap))) return { msg: `Qual: Not ${area.name}`, type: sev, key: null };
                }

                // 2. Check Unavailability (Personal & Tags)
                if (rules.unavailableSeverity !== 'off') {
                    const sev = rules.unavailableSeverity || 'error';
                    // Personal
                    if (person.unavailable && person.unavailable.includes(currentShiftId)) return { msg: "Marked Unavailable", type: sev, key: null };
                    if (pos.type === 'auditorium' && person.unavailable && person.unavailable.length > 0) return { msg: "Partial Unavailability", type: sev, key: null };

                    // Tags
                    if (person.tags && tags) {
                        for (let tid of person.tags) {
                            const tag = tags.find(t => t.id === tid);
                            if (tag) {
                                // Area Block
                                if (tag.restrictedAreas && tag.restrictedAreas.includes(pos.areaId)) return { msg: `Tag: ${tag.name} (Area)`, type: sev, key: null };

                                if (tag.restrictedShifts) {
                                    // Specific Shift Block
                                    if (tag.restrictedShifts.includes(currentShiftId)) return { msg: `Tag: ${tag.name}`, type: sev, key: null };

                                    // All Day Block (Only applies if pos is auditorium)
                                    if (pos.type === 'auditorium' && tag.restrictedShifts.includes('all_day')) return { msg: `Tag: ${tag.name} (All Day)`, type: sev, key: null };

                                    // Partial Warning (if assigned to All Day but has SOME shift restrictions, warn but don't block unless 'all_day' is set)
                                    if (pos.type === 'auditorium' && tag.restrictedShifts.length > 0 && !tag.restrictedShifts.includes('all_day')) {
                                         // Check if the partial restriction actually overlaps with "All Day". Technically all shifts overlap all day.
                                         // So a warning is appropriate.
                                         return { msg: `Tag: ${tag.name} (Partial)`, type: 'warning', key: null };
                                    }
                                }
                            }
                        }
                    }
                }

                // 3. Check Existing Assignments (Double Booking)
                if (rules.doubleBookingSeverity !== 'off') {
                    const sev = rules.doubleBookingSeverity || 'error';
                    for (let p of positions) {
                        // A. Check for All Day assignments (Auditorium)
                        if (p.type === 'auditorium') {
                            if (getAssignId(currentAssignments[p.id]) === pid) {
                                // Conflict?
                                if (p.id !== pos.id) {
                                    // If target is ALSO all day -> Conflict
                                    if (pos.type === 'auditorium') return { msg: `Assigned at ${p.name}`, type: sev, key: p.id };

                                    // If target is Rotational -> Depends on "Relief Mode"
                                    if (pos.type === 'rotational') {
                                        if (!rules.auditoriumRotationMode) {
                                            return { msg: `Assigned at ${p.name}`, type: sev, key: p.id };
                                        }
                                        // Relief Mode is ON: Double booking allowed, BUT check Constraints:

                                        // 1. Section Safety: Is the OTHER brother from this section also gone?
                                        if (p.section) {
                                            let sectionAbandoned = false;
                                            // Find all other auditorium positions in this section
                                            const sectionMates = positions.filter(op => op.type === 'auditorium' && op.section === p.section && op.id !== p.id);

                                            // Check if ANY of them are currently assigned to a rotational shift
                                            for(let mate of sectionMates) {
                                                const mateId = getAssignId(currentAssignments[mate.id]);
                                                if (mateId) {
                                                    // Is THIS mate assigned to a rotational shift at this time?
                                                    for (let rp of positions.filter(x => x.type === 'rotational' && !x.isMirror)) {
                                                        if (rp.validShifts && !rp.validShifts.includes(currentShiftId)) continue;
                                                        if (rp.id === pos.id) continue; // Skip the spot we are trying to fill
                                                        if (getAssignId(currentAssignments[`${rp.id}_${currentShiftId}`]) === mateId) {
                                                            sectionAbandoned = true;
                                                            break;
                                                        }
                                                    }
                                                }
                                            }
                                            if (sectionAbandoned) return { msg: `Section ${p.section} Abandoned`, type: 'error', key: null };
                                        }

                                        // 2. Max Relief %
                                        const audPositions = positions.filter(x => x.type === 'auditorium');
                                        const totalAud = audPositions.length;
                                        const maxRelief = Math.floor(totalAud * ((rules.auditoriumCoverage || 25) / 100));

                                        let currentReliefCount = 0;
                                        // Count how many auditorium brothers are on rotational duty this shift
                                        for (let ap of audPositions) {
                                            const apId = getAssignId(currentAssignments[ap.id]);
                                            if (!apId) continue;
                                            if (apId === pid) continue; // Don't count self yet

                                            for (let rp of positions.filter(x => x.type === 'rotational' && !x.isMirror)) {
                                                if (rp.validShifts && !rp.validShifts.includes(currentShiftId)) continue;
                                                if (getAssignId(currentAssignments[`${rp.id}_${currentShiftId}`]) === apId) {
                                                    currentReliefCount++;
                                                    break; // Counted once per person per shift
                                                }
                                            }
                                        }

                                        if (currentReliefCount >= maxRelief) return { msg: `Max Relief (${maxRelief}) Hit`, type: 'warning', key: null };

                                        // If we pass checks, return INFO
                                        return { msg: "Auditorium Relief", type: "warning", key: p.id };
                                    }
                                }
                            }
                        }

                        // B. Check for Rotational assignments (Standard)
                        if (p.type === 'rotational' && !p.isMirror) {
                            if (p.id === pos.id) continue; // Skip self check

                            if (!p.validShifts || p.validShifts.includes(currentShiftId)) {
                                const checkKey = `${p.id}_${currentShiftId}`;
                                if (getAssignId(currentAssignments[checkKey]) === pid) {
                                    return { msg: `Busy at ${p.name}`, type: sev, key: checkKey };
                                }
                            }
                        }
                    }
                }
                return null;
            };

            const handleAssignAttempt = (key, value) => {
                const assignObj = value ? { id: parseInt(value), isAuto: false } : null;
                if (!value) { setAssignments(prev => ({ ...prev, [key]: null })); return; }

                let posId = key;
                let shiftId = 'all';
                if (key.includes('_')) {
                    const parts = key.split('_');
                    const lastPart = parts[parts.length-1];
                    if (shifts.find(s => s.id === lastPart)) {
                        shiftId = lastPart;
                        posId = parts.slice(0, parts.length-1).join('_');
                    }
                }

                const pos = positions.find(p => p.id === posId);
                if (!pos) { setAssignments(prev => ({ ...prev, [key]: assignObj })); return; }

                const conflict = getConflict(value, pos, shiftId, assignments);
                if (conflict && conflict.type === 'error') {
                    setPendingAction({ targetKey: key, targetValue: assignObj, conflictMsg: conflict.msg, conflictSourceKey: conflict.key, personName: personnel.find(p => p.id === parseInt(value))?.name });
                } else {
                    setAssignments(prev => ({ ...prev, [key]: assignObj }));
                }
            };

            const confirmConflict = () => {
                if (pendingAction) { setAssignments(prev => ({ ...prev, [pendingAction.targetKey]: pendingAction.targetValue })); setPendingAction(null); }
            };

            const resolveAndAssign = () => {
                if (pendingAction && pendingAction.conflictSourceKey) {
                    setAssignments(prev => ({ ...prev, [pendingAction.conflictSourceKey]: null, [pendingAction.targetKey]: pendingAction.targetValue }));
                    setPendingAction(null);
                }
            };

            // === HELPER FUNCTIONS FOR AUTO-FILL & CONFLICT RESOLUTION ===
            const getShiftCount = (pid, currentAssignments) => {
                let count = 0;
                Object.keys(currentAssignments).forEach(key => {
                    if (getAssignId(currentAssignments[key]) === pid) {
                        if (key.includes('_') && !key.includes('pos12')) count++;
                    }
                });
                return count;
            };

            const isPersonFree = (pid, shiftId, currentAssignments) => {
                 const person = personnel.find(p => p.id === pid);
                 if (!person) return false;

                 // Personal Unavailable
                 if (person.unavailable && person.unavailable.includes(shiftId)) return false;

                 // Tag Unavailable
                 if (person.tags && tags) {
                     for (let tid of person.tags) {
                         const tag = tags.find(t => t.id === tid);
                         if (tag && tag.restrictedShifts) {
                             if (tag.restrictedShifts.includes(shiftId)) return false;
                             // If checking for 'all' (Auditorium), check if 'all_day' is restricted
                             if (shiftId === 'all' && tag.restrictedShifts.includes('all_day')) return false;
                         }
                     }
                 }

                 for (let p of positions) {
                     // Check if busy at ANY auditorium spot (All Day Key)
                     if (p.type === 'auditorium' && getAssignId(currentAssignments[p.id]) === pid) {
                         // IF checking for a rotational shift ('shiftId' is not 'all')
                         // AND Relief Mode is ON
                         // THEN this does NOT count as "busy" (return true effectively for this check)
                         if (shiftId !== 'all' && rules.auditoriumRotationMode) {
                             // Continue to check other conflicts, but don't return false yet
                         } else {
                             return false;
                         }
                     }

                     // Check Shift Keys (Rotational)
                     if (p.type === 'rotational' && !p.isMirror) {
                        if (shiftId === 'all') {
                            // If checking for 'all day' (Auditorium), must be free ALL shifts
                            for (let s of shifts) {
                                if (p.validShifts && !p.validShifts.includes(s.id)) continue;
                                if (getAssignId(currentAssignments[`${p.id}_${s.id}`]) === pid) return false;
                            }
                        } else {
                            // Check if busy at THIS specific shift
                            if (p.validShifts && !p.validShifts.includes(shiftId)) continue;
                            if (getAssignId(currentAssignments[`${p.id}_${shiftId}`]) === pid) return false;
                        }
                     }
                 }
                 return true;
            };

            const isAnchorAvailableForShift = (person, shiftId, currentAssignments) => {
                if (rules.anchorLimits === false) return true;

                // 1. Is he an anchor?
                const anchorPos = positions.find(p => p.type === 'auditorium' && getAssignId(currentAssignments[p.id]) === person.id);
                if (!anchorPos) return true;

                // 2. Is he already over 25%? (1 shift)
                if (getShiftCount(person.id, currentAssignments) >= 1) return false;

                // 3. Check Section Limits
                const section = anchorPos.section;

                // Get all rotational assignments for this shift
                const activeAssignments = [];
                positions.filter(p => p.type === 'rotational' && !p.isMirror).forEach(p => {
                    if (p.validShifts && !p.validShifts.includes(shiftId)) return;
                    const assignedId = getAssignId(currentAssignments[`${p.id}_${shiftId}`]);
                    if (assignedId) activeAssignments.push(assignedId);
                });

                // Count how many anchors from this section are already working this shift
                let sectionCount = 0;
                let mainTotalCount = 0;
                let upperCount = 0;

                activeAssignments.forEach(aid => {
                    const ap = positions.find(p => p.type === 'auditorium' && getAssignId(currentAssignments[p.id]) === aid);
                    if (ap) {
                        if (ap.areaId === 'upper_level') upperCount++;
                        else {
                            mainTotalCount++;
                            if (ap.section === section) sectionCount++;
                        }
                    }
                });

                if (anchorPos.areaId === 'upper_level') {
                    return upperCount < 1; // Max 1 from Upper
                } else {
                    // Main Auditorium Rules
                    if (mainTotalCount >= 2) return false; // Max 2 total form main
                    if (sectionCount >= 1) return false; // Max 1 from this section (excluding self)
                    return true;
                }
            };

            const workedPreviousShift = (pid, currentShiftId, currentAssignments) => {
                if (rules.avoidConsecutive === false) return false;
                const shiftIndex = shifts.findIndex(s => s.id === currentShiftId);
                if (shiftIndex <= 0) return false;
                const prevShiftId = shifts[shiftIndex - 1].id;
                let worked = false;
                positions.filter(p => p.type === 'rotational' && !p.isMirror).forEach(p => {
                    if (getAssignId(currentAssignments[`${p.id}_${prevShiftId}`]) === pid) worked = true;
                });
                return worked;
            };

            const isOverWorkLimit = (pid, currentAssignments) => {
                const limit = rules.maxWorkPercent || 50;

                let minutesWorked = 0;
                Object.keys(currentAssignments).forEach(key => {
                    if (getAssignId(currentAssignments[key]) === pid) {
                        // Check if key has a shift ID suffix (e.g. pos_morning)
                        if (key.includes('_')) {
                            const parts = key.split('_');
                            const shiftId = parts[parts.length - 1];
                            const shift = shifts.find(s => s.id === shiftId);
                            if (shift) minutesWorked += shift.minutes;
                        }
                        // Note: Auditorium assignments (no underscore) do not count towards "Work Load" (Time Away)
                        // as they are considered "Attending Session" for the purpose of relief calculation.
                    }
                });

                const pct = (minutesWorked / TOTAL_PROGRAM_MINUTES) * 100;
                return pct >= limit;
            };

            const fixConflicts = () => {
                let newAssignments = { ...assignments };
                let fixedCount = 0;
                let reassignedCount = 0;
                let unassignedCount = 0;

                Object.keys(newAssignments).forEach(key => {
                    const assignVal = newAssignments[key];
                    const personId = getAssignId(assignVal);
                    if (!personId) return;

                    let posId = key;
                    let shiftId = 'all';
                    if (key.includes('_')) {
                        const parts = key.split('_');
                        const lastPart = parts[parts.length-1];
                        if (shifts.find(s => s.id === lastPart)) {
                            shiftId = lastPart;
                            posId = parts.slice(0, parts.length-1).join('_');
                        }
                    }

                    const pos = positions.find(p => p.id === posId);
                    if (!pos) return;

                    const conflict = getConflict(personId, pos, shiftId, newAssignments);
                    if (conflict && (conflict.type === 'error' || conflict.type === 'warning')) {
                        // Ignore accepted Auditorium Relief warnings (don't auto-fix them)
                        if (conflict.msg === "Auditorium Relief") return;

                        // 1. Unassign current
                        newAssignments[key] = null;

                        // 2. Try to find a replacement
                        let candidates = getCandidatesForPosition(pos, personnel, areas, tags);

                        candidates = candidates.filter(p =>
                            isPersonFree(p.id, shiftId, newAssignments) &&
                            !workedPreviousShift(p.id, shiftId, newAssignments) &&
                            isAnchorAvailableForShift(p, shiftId, newAssignments) &&
                            !isOverWorkLimit(p.id, newAssignments)
                        );

                        if (candidates.length > 0) {
                            // Find fairest candidate
                            candidates = candidates.map(c => ({...c, shifts: getShiftCount(c.id, newAssignments)}));
                            const minShifts = Math.min(...candidates.map(c => c.shifts));
                            let fairPool = candidates.filter(c => c.shifts === minShifts);

                            // Team Prioritization
                            if (pos.teamKeyManId) {
                                const teamMembers = fairPool.filter(c => c.keyManId === pos.teamKeyManId);
                                if (teamMembers.length > 0) fairPool = teamMembers;
                            }

                            if (fairPool.length > 0) {
                                    // Tie-breaker: If mixed pool of Rotational (with 0 shifts) vs Auditorium Relief (with 0 shifts),
                                    // prioritize Auditorium Relief if "Auditorium Rotation Mode" is ON (user preference to rotate them).
                                    // Otherwise, random.
                                    if (rules.auditoriumRotationMode) {
                                        const audReliefCandidates = fairPool.filter(c => c.caps && c.caps.includes('auditorium'));
                                        if (audReliefCandidates.length > 0 && audReliefCandidates.length < fairPool.length) {
                                            // Optional: Favor them? Or favor true Rotational?
                                            // Logic: Auditorium guys are working 100%. Rotational guys with 0 shifts are working 0%.
                                            // Fairness dictates we should prioritize the Rotational guy to get him to >0.
                                            // BUT user asked "who will it pick?". Current logic picks randomly.
                                            // Let's refine to prioritize PURE Rotational if they are at 0 shifts.
                                            const pureRotational = fairPool.filter(c => !c.caps || !c.caps.includes('auditorium'));
                                            if (pureRotational.length > 0 && minShifts === 0) {
                                                fairPool = pureRotational;
                                            }
                                        }
                                    }

                                const chosen = fairPool[Math.floor(Math.random() * fairPool.length)];
                                newAssignments[key] = { id: chosen.id, isAuto: true };
                                reassignedCount++;
                            } else {
                                unassignedCount++;
                            }
                        } else {
                            unassignedCount++;
                        }
                        fixedCount++;
                    }
                });

                if (fixedCount > 0) {
                    setAssignments(newAssignments);
                    alert(`Resolved ${fixedCount} conflicts:\n- Reassigned: ${reassignedCount}\n- Unassigned: ${unassignedCount}`);
                } else {
                    alert("No conflicts found to fix.");
                }
            };

            // === SEQUENTIAL & FAIR AUTO FILL ===
            const autoFill = () => {
                let newAssignments = { ...assignments };
                let filledCount = 0;
                let audFilled = 0;
                let rotFilled = 0;
                let logEntries = [];

                const addLog = (msg, type) => logEntries.push({ msg, type });

                // 1. Auditorium First (Always run - Auditorium is now always "All Day")
                addLog("--- Starting Auditorium Fill ---", 'auditorium');
                positions.filter(p => p.type === 'auditorium').forEach(pos => {
                    if (!getAssignId(newAssignments[pos.id])) {
                        let candidates = getCandidatesForPosition(pos, personnel, areas, tags);
                        candidates = candidates.filter(p => isPersonFree(p.id, 'all', newAssignments));

                        if(candidates.length > 0) {
                            const chosen = candidates[Math.floor(Math.random() * candidates.length)];
                            newAssignments[pos.id] = { id: chosen.id, isAuto: true };
                            addLog(`Assigned ${chosen.name} to ${pos.name}`, 'auditorium');
                            filledCount++;
                            audFilled++;
                        } else {
                            addLog(`No candidates for ${pos.name}`, 'error');
                        }
                    }
                });

                // 2. Rotational
                addLog("--- Starting Rotational Fill ---", 'rotational');
                shifts.forEach(shift => {
                    addLog(`>> Processing ${shift.label}`, 'shift');

                    // Count Auditorium Relief Usage for this Shift
                    const audPositions = positions.filter(x => x.type === 'auditorium');
                    const maxRelief = Math.floor(audPositions.length * ((rules.auditoriumCoverage || 25) / 100));

                    let reliefUsedCount = 0;
                    // Count manually assigned relief first
                    positions.filter(p => p.type === 'rotational' && !p.isMirror).forEach(rp => {
                        const pid = getAssignId(newAssignments[`${rp.id}_${shift.id}`]);
                        if(pid) {
                            // Is this person mainly auditorium?
                            if (audPositions.some(ap => getAssignId(newAssignments[ap.id]) === pid)) {
                                reliefUsedCount++;
                            }
                        }
                    });

                    // --- STANDARD ROTATIONAL LOGIC ---
                    positions.filter(p => p.type === 'rotational' && !p.isMirror).forEach(pos => {
                        if (pos.validShifts && !pos.validShifts.includes(shift.id)) return;
                        const key = `${pos.id}_${shift.id}`;

                        if (!getAssignId(newAssignments[key])) {
                            let candidates = getCandidatesForPosition(pos, personnel, areas, tags);

                            candidates = candidates.filter(p => {
                                // Basic Checks
                                if (!isPersonFree(p.id, shift.id, newAssignments)) return false;
                                if (workedPreviousShift(p.id, shift.id, newAssignments)) return false;
                                if (!isAnchorAvailableForShift(p, shift.id, newAssignments)) return false;
                                if (isOverWorkLimit(p.id, newAssignments)) return false;

                                // --- RELIEF MODE LOGIC ---
                                // Check if this candidate is an Auditorium person on Relief
                                const myAudPos = audPositions.find(ap => getAssignId(newAssignments[ap.id]) === p.id);
                                if (myAudPos) {
                                    if (!rules.auditoriumRotationMode) return false; // Not allowed if mode off

                                    // 1. Max Relief Check
                                    if (reliefUsedCount >= maxRelief) return false;

                                    // 2. Section Safety Check
                                    if (myAudPos.section) {
                                        const mates = audPositions.filter(ap => ap.section === myAudPos.section && ap.id !== myAudPos.id);
                                        for(let m of mates) {
                                            const mid = getAssignId(newAssignments[m.id]);
                                            if (mid) {
                                                // Is mate assigned elsewhere this shift?
                                                // Check rotational assignments
                                                for(let otherRP of positions.filter(x => x.type === 'rotational' && !x.isMirror)) {
                                                    const assignedId = getAssignId(newAssignments[`${otherRP.id}_${shift.id}`]);
                                                    if (assignedId === mid) return false; // Mate is gone, I must stay
                                                }
                                            }
                                        }
                                    }
                                }
                                return true;
                            });

                            if (candidates.length === 0) {
                                addLog(`Slot ${pos.name}: No candidates.`, 'warn');
                                return;
                            }

                            candidates = candidates.map(c => ({...c, shifts: getShiftCount(c.id, newAssignments)}));
                            const minShifts = Math.min(...candidates.map(c => c.shifts));
                            let fairPool = candidates.filter(c => c.shifts === minShifts);

                            // TEAM PRIORITIZATION
                            if (pos.teamKeyManId) {
                                const teamMembers = fairPool.filter(c => c.keyManId === pos.teamKeyManId);
                                if (teamMembers.length > 0) {
                                    fairPool = teamMembers;
                                    addLog(`  > Prioritizing Team Members (${teamMembers.length})`, 'info');
                                }
                            }

                            // LOGIC: If picking between Brother A (Rotational, 0 shifts) and Brother B (Auditorium Relief, 0 relief shifts)
                            // Fairness dictates Brother A needs a job more than Brother B needs relief.
                            if (rules.auditoriumRotationMode && minShifts === 0) {
                                const pureRotational = fairPool.filter(c => !c.caps || !c.caps.includes('auditorium'));
                                if (pureRotational.length > 0) {
                                    fairPool = pureRotational;
                                    addLog(`  > Prioritizing Idle Rotational Staff (${pureRotational.length})`, 'info');
                                }
                            }

                            addLog(`Slot ${pos.name}: Candidates ${candidates.length}, Fair (${minShifts}) ${fairPool.length}`, 'info');

                            if (fairPool.length > 0) {
                                const chosen = fairPool[Math.floor(Math.random() * fairPool.length)];
                                newAssignments[key] = { id: chosen.id, isAuto: true };

                                // Increment relief count if necessary
                                if (audPositions.some(ap => getAssignId(newAssignments[ap.id]) === chosen.id)) {
                                    reliefUsedCount++;
                                    addLog(`  > Assigned Relief: ${chosen.name} (from Aud)`, 'success');
                                } else {
                                    addLog(`  > Assigned ${chosen.name} (Shifts: ${chosen.shifts})`, 'success');
                                }
                                filledCount++;
                                rotFilled++;
                            }
                        }
                    });
                });

                const assignedIds = new Set();
                Object.keys(newAssignments).forEach(k => {
                    const pid = getAssignId(newAssignments[k]);
                    if (pid) assignedIds.add(pid);
                });
                const totalPersonnel = personnel.length;
                const participated = assignedIds.size;
                const participationPct = totalPersonnel > 0 ? Math.round((participated / totalPersonnel) * 100) : 0;

                onAutoFill(newAssignments, logEntries);
                alert(`Auto-Fill Complete!\n\nTotal Volunteers Filled: ${filledCount}\n- All Day: ${audFilled}\n- Rotating: ${rotFilled}\n\nTotal Assignments: ${participated}/${totalPersonnel} Volunteers (${participationPct}%)`);
            };

            const clearAutoAssignments = () => {
                let count = 0;
                const cleanedAssignments = { ...assignments };
                Object.keys(cleanedAssignments).forEach(key => {
                    if (isAutoAssigned(cleanedAssignments[key])) { cleanedAssignments[key] = null; count++; }

            const isScheduleEmpty = useMemo(() => {

            }, [assignments]);

            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm mt-8 relative">

                            <button onClick={autoFill} className={`text-white px-5 py-2 rounded-full font-semibold shadow-sm transition-all flex items-center gap-2 active:scale-95 ${isScheduleEmpty ? 'bg-green-600 hover:bg-green-700 shadow-green-200 ring-4 ring-green-100 animate-pulse' : 'bg-green-600 hover:bg-green-700 shadow-green-200'}`}><i className="fa fa-magic"></i> Fill in Unassigned</button>
                        </div>
                    </div>

                    {isScheduleEmpty && personnel.length > 0 && (

                    <div className="overflow-x-auto rounded-xl border border-gray-200 shadow-sm bg-white dark:bg-slate-800 dark:border-slate-700">

        function PrintView({ personnel, assignments, positions, shifts }) {

                Object.keys(assignments).forEach(key => {
                    if (getAssignId(assignments[key]) === p.id) {
                        let posId = key;
                        let shiftId = 'all';
                        if (key.includes('_')) {
                            const parts = key.split('_');
                            const lastPart = parts[parts.length-1];
                            if (shifts.find(s => s.id === lastPart)) {
                                shiftId = lastPart;
                                posId = parts.slice(0, parts.length-1).join('_');
                            }
                        }
                        const pos = positions.find(x => x.id === posId);
                        const shift = shifts.find(s => s.id === shiftId);
                        if (pos) {
                            myAssignments.push({
                                posName: pos.name,
                                time: shift ? shift.label : "Full Day",
                                shiftId: shiftId
                            });
                        }
                    }
                });
                // Sort by time/shift index
                myAssignments.sort((a, b) => {
                    const aIdx = shifts.findIndex(s => s.id === a.shiftId);
                    const bIdx = shifts.findIndex(s => s.id === b.shiftId);
                    return aIdx - bIdx;
                });
                return myAssignments;
            };

            const brothersWithAssignments = personnel.filter(p => getBrotherAssignments(p).length > 0);
            brothersWithAssignments.sort((a,b) => getLastName(a.name).localeCompare(getLastName(b.name)));

        function TagsView({ tags, setTags, personnel, setPersonnel, shifts, areas, onDeleteTag }) {
            const [newTag, setNewTag] = useState({ name: '', restrictedShifts: [], restrictedAreas: [] });
            const [selectedTagId, setSelectedTagId] = useState('');
            const [filterName, setFilterName] = useState('');

            // --- TAG MANAGEMENT ---
            const addTag = () => {
                if (!newTag.name) return alert("Tag Name is required");
                const id = 'tag_' + Date.now();
                setTags([...tags, { id, ...newTag }]);
                setNewTag({ name: '', restrictedShifts: [], restrictedAreas: [] });
            };

            const deleteTag = (id) => {
                if (confirm("Delete this tag?")) {
                    onDeleteTag(id);
                    if (selectedTagId === id) setSelectedTagId('');
                }
            };

            // Toggle for NEW tag form
            const toggleShiftNew = (shiftId) => {
                const current = newTag.restrictedShifts;
                if (current.includes(shiftId)) {
                    setNewTag({ ...newTag, restrictedShifts: current.filter(s => s !== shiftId) });
                } else {
                    setNewTag({ ...newTag, restrictedShifts: [...current, shiftId] });
                }
            };

            const toggleAreaNew = (areaId) => {
                const current = newTag.restrictedAreas || [];
                if (current.includes(areaId)) {
                    setNewTag({ ...newTag, restrictedAreas: current.filter(a => a !== areaId) });
                } else {
                    setNewTag({ ...newTag, restrictedAreas: [...current, areaId] });
                }
            };

            // Toggle for EXISTING tag (Edit Mode)
            const toggleShiftEdit = (tag, shiftId) => {
                const current = tag.restrictedShifts || [];
                let newShifts;
                if (current.includes(shiftId)) {
                    newShifts = current.filter(s => s !== shiftId);
                } else {
                    newShifts = [...current, shiftId];
                }
                const updatedTag = { ...tag, restrictedShifts: newShifts };
                setTags(tags.map(t => t.id === tag.id ? updatedTag : t));
            };

            const toggleAreaEdit = (tag, areaId) => {
                const current = tag.restrictedAreas || [];
                let newAreas;
                if (current.includes(areaId)) {
                    newAreas = current.filter(a => a !== areaId);
                } else {
                    newAreas = [...current, areaId];
                }
                const updatedTag = { ...tag, restrictedAreas: newAreas };
                setTags(tags.map(t => t.id === tag.id ? updatedTag : t));
            };

            const updateTagName = (tag, newName) => {
                setTags(tags.map(t => t.id === tag.id ? { ...t, name: newName } : t));
            };

            // --- BULK ASSIGNMENT ---
            const togglePersonTag = (personId, tagId) => {
                const person = personnel.find(p => p.id === personId);
                if (!person) return;

                const currentTags = person.tags || [];
                let newTags;
                if (currentTags.includes(tagId)) {
                    newTags = currentTags.filter(t => t !== tagId);
                } else {
                    newTags = [...currentTags, tagId];
                }

                setPersonnel(personnel.map(p => p.id === personId ? { ...p, tags: newTags } : p));
            };

            const selectedTag = tags.find(t => t.id === selectedTagId);

            // FILTER & SORT
            const filteredPersonnel = personnel.filter(p =>
                p.name.toLowerCase().includes(filterName.toLowerCase()) ||
                (p.role && p.role.toLowerCase().includes(filterName.toLowerCase())) ||
                (p.congregation && p.congregation.toLowerCase().includes(filterName.toLowerCase()))

            filteredPersonnel.sort((a,b) => a.name.localeCompare(b.name));

            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm">
                    <h2 className="text-2xl font-bold text-gray-900 tracking-tight mb-6 dark:text-white">Tags & Constraints</h2>

                    {/* TOP: CREATE TAG */}
                    <div className="bg-gray-50/50 p-6 rounded-2xl border border-gray-100 mb-8 dark:bg-slate-800/50 dark:border-slate-700">
                        <h3 className="font-bold text-lg mb-2 dark:text-gray-200">Create New Tag</h3>
                        <div className="flex flex-col md:flex-row gap-4 items-start mb-2">
                            <div className="flex-1 w-full">

                            </div>
                            <div className="flex-1 w-full">
                                <label className="block text-xs font-bold uppercase text-gray-400 mb-1 ml-1 dark:text-gray-500">Restricted Shifts (Cannot Work)</label>
                                <div className="flex flex-wrap gap-2 mb-4">
                                    <label className={`flex items-center text-sm px-3 py-1.5 rounded-full cursor-pointer transition-all border ${newTag.restrictedShifts.includes('all_day') ? 'bg-blue-100 border-blue-200 text-blue-700 font-bold dark:bg-blue-900 dark:border-blue-700 dark:text-blue-300' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300 dark:hover:bg-slate-600'}`}>
                                        <input

                                    </label>
                                    {shifts.map(s => (
                                        <label key={s.id} className={`flex items-center text-sm px-3 py-1.5 rounded-full cursor-pointer transition-all border ${newTag.restrictedShifts.includes(s.id) ? 'bg-red-100 border-red-200 text-red-700 font-bold dark:bg-red-900/30 dark:border-red-800 dark:text-red-400' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300 dark:hover:bg-slate-600'}`}>
                                            <input

                                </div>

                                <label className="block text-xs font-bold uppercase text-gray-400 mb-1 ml-1 dark:text-gray-500">Restricted Areas (Cannot Work)</label>
                                <div className="flex flex-wrap gap-2">
                                    {areas.map(a => (

                                            <input

                            <button onClick={addTag} className="bg-blue-600 text-white px-6 py-2.5 rounded-full font-bold hover:bg-blue-700 md:mt-5 w-full md:w-auto shadow-sm active:scale-95 transition-all dark:bg-blue-600 dark:hover:bg-blue-500">Create</button>

                    {/* MAIN SPLIT: LIST & ASSIGN */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* LEFT: TAG LIST */}
                        <div className="border rounded-2xl p-4 bg-white/50 dark:bg-slate-800/30 dark:border-slate-700">

                                        <div>
                                            <div className="font-bold text-gray-800 dark:text-gray-200">{tag.name}</div>
                                            <div className="text-xs text-red-600 dark:text-red-400">
                                            {tag.restrictedShifts.length > 0 && <span>{tag.restrictedShifts.length} shifts</span>}
                                            {tag.restrictedShifts.length > 0 && tag.restrictedAreas && tag.restrictedAreas.length > 0 && <span>, </span>}
                                            {tag.restrictedAreas && tag.restrictedAreas.length > 0 && <span>{tag.restrictedAreas.length} areas</span>}

                                        <button onClick={(e) => { e.stopPropagation(); deleteTag(tag.id); }} className="text-gray-400 hover:text-red-500 px-2 transition-colors dark:text-gray-500 dark:hover:text-red-400">
                                            <i className="fa fa-trash"></i>

                        </div>

                        {/* RIGHT: ASSIGNMENT */}
                        <div className="col-span-2 border rounded-2xl p-6 flex flex-col h-[650px] bg-white/50 dark:bg-slate-800/30 dark:border-slate-700">
                            {selectedTag ? (

                                    <div className="mb-6 pb-6 border-b border-gray-200 dark:border-slate-700">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="font-bold text-lg dark:text-gray-200">
                                                Edit Tag: <span className="text-blue-600 dark:text-blue-400">{selectedTag.name}</span>
