<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Circuit Assembly Scheduler</title>

    <!-- React & ReactDOM (Production) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- Crypto JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .dark body { background-color: #0f172a; color: #e2e8f0; color-scheme: dark; }

        .conflict-border { border: 2px solid #ef4444; }
        .warning-border { border: 2px solid #f59e0b; }
        .auto-assigned { background-color: #dcfce7; }
        .dark .auto-assigned { background-color: rgba(22, 163, 74, 0.2); }

        .blocked-cell { background-color: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
        .dark .blocked-cell { background-color: #1e293b; color: #475569; }

        .mirrored-cell { background-color: #fff7ed; color: #9a3412; font-style: italic; border: 1px dashed #fdba74; }
        .dark .mirrored-cell { background-color: rgba(255, 247, 237, 0.1); color: #fed7aa; border-color: #9a3412; }

        .overflow-x-auto::-webkit-scrollbar { height: 8px; }
        .overflow-x-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .overflow-x-auto::-webkit-scrollbar-thumb { background: #475569; }

        .log-entry { border-bottom: 1px solid #e5e7eb; padding: 8px 0; font-family: monospace; font-size: 0.85rem; }
        .dark .log-entry { border-color: #334155; }

        /* Drag and Drop Styles */
        .draggable-row { cursor: grab; }
        .draggable-row:active { cursor: grabbing; }
        .droppable-group { transition: background-color 0.2s; }
        .droppable-group.drag-over { background-color: #e0f2fe; border-color: #3b82f6; }
        .dark .droppable-group.drag-over { background-color: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        .dark .glass-header {
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <!-- Error Display -->
    <div id="global-error" style="display:none; padding: 20px; background-color: #fee2e2; color: #b91c1c; border: 1px solid #ef4444; margin: 20px; border-radius: 8px;">
        <h2 style="margin-top:0; font-weight: bold;">Application Error</h2>
        <pre id="error-message" style="white-space: pre-wrap;"></pre>
        <button onclick="location.reload()" style="margin-top:10px; padding:5px 10px; cursor:pointer; border:1px solid #991b1b; background: #fff;">Reload Page</button>
    </div>

    <div id="root"></div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('global-error').style.display = 'block';
            document.getElementById('error-message').textContent = message + '\n\nLocation: ' + lineno + ':' + colno;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // ---------------- DATA CONSTANTS (DEFAULTS) ----------------

        const DEFAULT_SHIFTS = [
            { id: 'morning', label: 'Morning (7:30-10:00)', minutes: 150 },
            { id: 'second', label: 'Second (10:00-12:30)', minutes: 150 },
            { id: 'late', label: 'Late (12:30-3:00)', minutes: 150 },
            { id: 'concluding', label: 'Concluding (3:00-5:30)', minutes: 150 }
        ];

        const TOTAL_PROGRAM_MINUTES = 600;

        const DEFAULT_AREAS = [
            { id: 'auditorium', name: 'Auditorium', capability: 'auditorium', style: { backgroundColor: '#000000', color: '#ffffff' } },
            { id: 'upper_level', name: 'Upper Level', capability: 'upper_level', style: { backgroundColor: '#000000', color: '#ffffff' } },
            { id: 'stairs', name: 'Stairs', capability: 'stairs', style: { backgroundColor: '#e2e5e4', color: '#000000' } },
            { id: 'backstage', name: 'Backstage / South Auditorium', capability: 'backstage', style: { backgroundColor: '#8999f7', color: '#000000' } },
            { id: 'dining', name: 'Dining Room', capability: 'dining', style: { backgroundColor: '#9cfa8a', color: '#000000' } },
            { id: 'lobby', name: 'Lobby', capability: 'lobby', style: { backgroundColor: '#e2e5e4', color: '#000000' } },
            { id: 'exterior', name: 'Exterior', capability: 'exterior', style: { backgroundColor: '#fefe92', color: '#000000' } }
        ];

        const DEFAULT_POSITIONS = [
            // AUDITORIUM (Black)
            { id: 'pos12', name: 'Pos 12 (Sect A - Key Man)', areaId: 'auditorium', type: 'auditorium', keyMan: true, section: 'A' },
            { id: 'pos09', name: 'Pos 09 (Sect A)', areaId: 'auditorium', type: 'auditorium', section: 'A' },
            { id: 'pos13', name: 'Pos 13 (Sect B - Key Man)', areaId: 'auditorium', type: 'auditorium', keyMan: true, section: 'B' },
            { id: 'pos10', name: 'Pos 10 (Sect B)', areaId: 'auditorium', type: 'auditorium', section: 'B' },
            { id: 'pos14', name: 'Pos 14 (Sect C)', areaId: 'auditorium', type: 'auditorium', section: 'C' },
            { id: 'pos11', name: 'Pos 11 (Sect C - Bapt Walk)', areaId: 'auditorium', type: 'auditorium', section: 'C' },
            { id: 'pos18', name: 'Pos 18 (Sect D)', areaId: 'auditorium', type: 'auditorium', section: 'D' },
            { id: 'pos15', name: 'Pos 15 (Sect D)', areaId: 'auditorium', type: 'auditorium', section: 'D' },
            { id: 'pos16', name: 'Pos 16 (Sect E - Key Man)', areaId: 'auditorium', type: 'auditorium', keyMan: true, section: 'E' },
            { id: 'pos19', name: 'Pos 19 (Sect E)', areaId: 'auditorium', type: 'auditorium', section: 'E' },
            { id: 'pos20', name: 'Pos 20 (Sect F)', areaId: 'auditorium', type: 'auditorium', section: 'F' },
            { id: 'pos17', name: 'Pos 17 (Sect F)', areaId: 'auditorium', type: 'auditorium', section: 'F' },

            // UPPER LEVEL (Black)
            { id: 'pos27', name: 'Pos 27', areaId: 'upper_level', type: 'auditorium' },
            { id: 'pos28', name: 'Pos 28 (Key Man Count)', areaId: 'upper_level', type: 'auditorium', keyMan: true },
            { id: 'pos29', name: 'Pos 29', areaId: 'upper_level', type: 'auditorium' },
            { id: 'pos30', name: 'Pos 30', areaId: 'upper_level', type: 'auditorium' },
            { id: 'pos31', name: 'Pos 31', areaId: 'upper_level', type: 'auditorium' },
            { id: 'pos32', name: 'Pos 32', areaId: 'upper_level', type: 'auditorium' },

            // STAIRS (Lobby Color)
            { id: 'pos25', name: 'Pos 25 (Stairs)', areaId: 'stairs', type: 'rotational' },
            { id: 'pos26', name: 'Pos 26 (Stairs)', areaId: 'stairs', type: 'rotational' },

            // BACKSTAGE / SOUTH AUDITORIUM (Periwinkle)
            { id: 'door_backstage', name: 'Pos 04 (Back Stage)', areaId: 'backstage', type: 'rotational' },
            { id: 'pos_05', name: 'Pos 05 (Chair Lift Hall)', areaId: 'backstage', type: 'rotational' },
            { id: 'pos_06', name: 'Pos 06 (South Aud)', areaId: 'backstage', type: 'rotational' },
            { id: 'pos_07', name: 'Pos 07 (Chair Lift Stairs)', areaId: 'backstage', type: 'rotational' },
            { id: 'pos_08', name: 'Pos 08 (South Aud)', areaId: 'backstage', type: 'rotational' },

            // DINING ROOM (Green)
            { id: 'dining_01_a', name: 'Pos 01 (South Dining) A', areaId: 'dining', type: 'rotational' },
            { id: 'dining_01_b', name: 'Pos 01 (South Dining) B', areaId: 'dining', type: 'rotational' },
            { id: 'dining_03_a', name: 'Pos 03 (North Dining) A', areaId: 'dining', type: 'rotational' },
            { id: 'dining_03_b', name: 'Pos 03 (North Dining) B', areaId: 'dining', type: 'rotational' },
            { id: 'dining_02',   name: 'Pos 02 (7am-8am Only)', areaId: 'dining', type: 'rotational', validShifts: ['morning'] },

            // LOBBY (Grey)
            { id: 'lobby_km', name: 'Lobby Key Man', areaId: 'lobby', type: 'rotational', keyMan: true },
            { id: 'lobby_1', name: 'Lobby Attendant 1', areaId: 'lobby', type: 'rotational' },
            { id: 'lobby_2', name: 'Lobby Attendant 2', areaId: 'lobby', type: 'rotational' },
            { id: 'lobby_3', name: 'Lobby Attendant 3', areaId: 'lobby', type: 'rotational' },
            { id: 'door_north', name: 'North Exit Door', areaId: 'lobby', type: 'rotational' },

            // MIRRORS
            { id: 'lobby_ext_1', name: 'Lobby Security (Ext Walk 1)', areaId: 'lobby', type: 'rotational', isMirror: true },
            { id: 'lobby_ext_2', name: 'Lobby Security (Ext Walk 2)', areaId: 'lobby', type: 'rotational', isMirror: true },

            // EXTERIOR (Yellow)
            { id: 'ext_walk_1', name: 'Exterior Walk 1', areaId: 'exterior', type: 'rotational' },
            { id: 'ext_walk_2', name: 'Exterior Walk 2', areaId: 'exterior', type: 'rotational' }
        ];

        const INITIAL_ROSTER = [];

        // ---------------- HELPER FUNCTIONS ----------------

        const getAssignId = (val) => {
            if (!val) return null;
            if (typeof val === 'object') return parseInt(val.id);
            return parseInt(val);
        };

        const isAutoAssigned = (val) => {
            if (val && typeof val === 'object') return val.isAuto === true;
            return false;
        };

        const getKeyManName = (personnel, id) => {
            const km = personnel.find(p => p.id === id);
            return km ? km.name : '';
        };

        const getLastName = (fullName) => {
            if (!fullName) return '';
            const parts = fullName.trim().split(' ');
            return parts[parts.length - 1].toLowerCase();
        };

        const parseCSV = (text) => {
            const arr = [];
            let quote = false;
            let row = [];
            let col = '';
            text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const next = text[i+1];
                if (char === '"') {
                    if (quote && next === '"') { col += '"'; i++; } else { quote = !quote; }
                } else if (char === ',' && !quote) {
                    row.push(col); col = '';
                } else if (char === '\n' && !quote) {
                    row.push(col); arr.push(row); row = []; col = '';
                } else { col += char; }
            }
            if (col || row.length > 0) { row.push(col); arr.push(row); }
            return arr;
        };

        // --- CENTRALIZED CANDIDATE FINDER (Now relies on props) ---
        const getCandidatesForPosition = (pos, personnel, areas, tags) => {
            const area = areas.find(a => a.id === pos.areaId);
            if(!area) return [];
            const requiredCap = area.capability;

            // Determine effective restriction
            // Position restriction takes precedence, then Area restriction
            let limitType = pos.limitType;
            let limitValue = pos.limitValue;

            // Legacy backward compatibility for Position
            if (!limitType && pos.teamKeyManId) {
                limitType = 'keyman';
                limitValue = pos.teamKeyManId;
            }

            // Fallback to Area restriction if none on Position
            if (!limitType && area.limitType) {
                limitType = area.limitType;
                limitValue = area.limitValue;
            }

            return personnel.filter(p => {
                if (!p.caps || !p.caps.includes(requiredCap)) return false;
                if (pos.keyMan && (!p.caps || !p.caps.includes('keyman'))) return false;

                // Check Area Restrictions from Tags
                if (tags && p.tags) {
                    for (let tid of p.tags) {
                        const tag = tags.find(t => t.id === tid);
                        if (tag && tag.restrictedAreas && tag.restrictedAreas.includes(pos.areaId)) return false;
                    }
                }

                // Check Assignment Constraints
                if (limitType && limitValue) {
                    if (limitType === 'keyman') {
                        if (p.keyManId !== parseInt(limitValue)) return false;
                    } else if (limitType === 'congregation') {
                        if (p.congregation !== limitValue) return false;
                    } else if (limitType === 'tag') {
                        if (!p.tags || !p.tags.includes(limitValue)) return false;
                    }
                }

                return true;
            });
        };

        // ---------------- COMPONENTS ----------------

        function RosterView({ personnel, setPersonnel, areas, shifts, tags }) {
            const initialCaps = useMemo(() => {
                const c = { keyman: false };
                areas.forEach(a => c[a.capability] = (['stairs', 'backstage', 'dining', 'lobby', 'exterior'].includes(a.capability)));
                return c;
            }, [areas]);

            const [formData, setFormData] = useState({
                name: '',
                congregation: '',
                role: 'Exemplary',
                caps: initialCaps,
                keyManId: '',
                unavailable: [],
                tags: []
            });
            const [editingId, setEditingId] = useState(null);
            const [draggedPersonId, setDraggedPersonId] = useState(null);
            const [dragOverGroup, setDragOverGroup] = useState(null);

            const uniqueCongregations = useMemo(() => {
                return [...new Set(personnel.map(p => p.congregation).filter(c => c && c.trim() !== ''))].sort();
            }, [personnel]);

            // --- FORM HANDLERS ---
            const handleCapChange = (cap, checked) => {
                setFormData(prev => ({ ...prev, caps: { ...prev.caps, [cap]: checked } }));
            };

            const handleUnavailableChange = (shiftId, checked) => {
                setFormData(prev => {
                     const newUnavailable = checked
                        ? [...(prev.unavailable || []), shiftId]
                        : (prev.unavailable || []).filter(id => id !== shiftId);
                     return { ...prev, unavailable: newUnavailable };
                });
            };

            const handleTagAdd = (tagId) => {
                if (!tagId) return;
                setFormData(prev => {
                    const current = prev.tags || [];
                    if (current.includes(tagId)) return prev;
                    return { ...prev, tags: [...current, tagId] };
                });
            };

            const handleTagRemove = (tagId) => {
                setFormData(prev => ({ ...prev, tags: (prev.tags || []).filter(t => t !== tagId) }));
            };

            const startEdit = (person) => {
                setEditingId(person.id);
                const newCaps = { keyman: false };
                areas.forEach(a => newCaps[a.capability] = false);

                person.caps.forEach(c => { newCaps[c] = true; });
                setFormData({
                    name: person.name,
                    congregation: person.congregation || '',
                    role: person.role || 'Exemplary',
                    caps: newCaps,
                    keyManId: person.keyManId ? person.keyManId.toString() : '',
                    unavailable: person.unavailable || [],
                    tags: person.tags || []
                });
            };

            const cancelEdit = () => {
                setEditingId(null);
                setFormData({
                    name: '', congregation: '', role: 'Exemplary',
                    caps: initialCaps,
                    keyManId: '',
                    unavailable: [],
                    tags: []
                });
            };

            const savePerson = () => {
                if (!formData.name.trim()) return;
                const capabilityList = Object.keys(formData.caps).filter(k => formData.caps[k]);
                const newKeyManId = formData.keyManId ? parseInt(formData.keyManId) : null;

                const newPerson = {
                    name: formData.name,
                    congregation: formData.congregation,
                    role: formData.role,
                    caps: capabilityList,
                    keyManId: newKeyManId,
                    unavailable: formData.unavailable,
                    tags: formData.tags
                };

                if (editingId !== null) {
                    setPersonnel(personnel.map(p => p.id === editingId ? { ...p, ...newPerson } : p));
                    cancelEdit();
                } else {
                    const maxId = personnel.reduce((max, p) => (p.id > max ? p.id : max), 0);
                    setPersonnel([...personnel, { id: maxId + 1, ...newPerson }]);
                    setFormData({ name: '', congregation: '', role: 'Exemplary', caps: initialCaps, keyManId: '', unavailable: [], tags: [] });
                }
            };

            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const rows = parseCSV(event.target.result);
                        const dataRows = rows.slice(1).filter(r => r.length > 3 && r[3] && r[3].trim() !== '');
                        let newPersonnel = [...personnel];
                        let maxId = newPersonnel.reduce((max, p) => (p.id > max ? p.id : max), 0);

                        let updatedCount = 0;
                        let newCount = 0;

                        dataRows.forEach(row => {
                            const name = row[3].trim();
                            const rawRole = row[5] || "";
                            const keyManName = row[7] || "";

                            let role = 'Exemplary';
                            if (rawRole.includes('Elder')) role = 'Elder';
                            else if (rawRole.includes('Ministerial')) role = 'MS';

                            // Default caps logic (legacy support)
                            let caps = ['lobby', 'dining', 'stairs', 'exterior', 'backstage'];
                            if (role === 'Elder' || role === 'MS') caps.push('auditorium', 'upper_level', 'backstage');
                            if (keyManName.trim().toLowerCase() === name.toLowerCase()) caps.push('keyman');

                            // CHECK FOR EXISTING PERSON
                            const existingPersonIndex = newPersonnel.findIndex(p => p.name.toLowerCase() === name.toLowerCase());

                            if (existingPersonIndex >= 0) {
                                // UPDATE EXISTING
                                const existing = newPersonnel[existingPersonIndex];
                                const updatedCaps = [...new Set([...existing.caps, ...caps])];

                                newPersonnel[existingPersonIndex] = {
                                    ...existing,
                                    role: role,
                                    caps: updatedCaps,
                                    tempKeyManName: keyManName
                                };
                                updatedCount++;
                            } else {
                                // ADD NEW
                                maxId++;
                                newPersonnel.push({ id: maxId, name: name, role: role, caps: caps, tempKeyManName: keyManName });
                                newCount++;
                            }
                        });

                        // RE-LINK KEY MEN IDs
                        newPersonnel = newPersonnel.map(p => {
                            if (p.tempKeyManName && p.tempKeyManName.toLowerCase() !== p.name.toLowerCase()) {
                                const km = newPersonnel.find(c => c.name.toLowerCase() === p.tempKeyManName.toLowerCase());
                                if (km) return { ...p, keyManId: km.id };
                            }
                            return p;
                        });

                        setPersonnel(newPersonnel);
                        alert(`CSV Processed.\nAdded: ${newCount}\nUpdated: ${updatedCount}`);
                    } catch (err) { alert("Error parsing CSV: " + err.message); }
                };
                reader.readAsText(file);
            };

            const deletePerson = (id) => {
                if(confirm("Delete this person?")) {
                    setPersonnel(personnel.filter(p => p.id !== id));
                    if (editingId === id) cancelEdit();
                }
            };

            // --- DRAG AND DROP LOGIC ---
            const handleDragStart = (e, personId) => {
                setDraggedPersonId(personId);
                e.dataTransfer.effectAllowed = "move";
            };

            const handleDragOver = (e, groupId) => {
                e.preventDefault();
                setDragOverGroup(groupId);
            };

            const handleDrop = (e, targetKeyManId) => {
                e.preventDefault();
                setDragOverGroup(null);
                if (draggedPersonId === null) return;
                if (draggedPersonId === targetKeyManId) return;

                setPersonnel(prev => prev.map(p => {
                    if (p.id === draggedPersonId) {
                        return { ...p, keyManId: targetKeyManId };
                    }
                    return p;
                }));
                setDraggedPersonId(null);
            };


            const renderCheckbox = (key, label) => (
                <label className="flex items-center cursor-pointer mr-4 mb-2">
                    <input type="checkbox" checked={formData.caps[key]} onChange={e=>handleCapChange(key, e.target.checked)} className="mr-2"/>
                    <span className="text-xs font-bold text-gray-700 dark:text-gray-300">{label}</span>
                </label>
            );

            // --- GROUPING & SORTING LOGIC ---
            const keyMen = personnel.filter(p => p.caps && p.caps.includes('keyman'));
            keyMen.sort((a, b) => getLastName(a.name).localeCompare(getLastName(b.name)));

            const groups = keyMen.map(km => {
                const members = personnel.filter(p => p.keyManId === km.id);
                members.sort((a, b) => getLastName(a.name).localeCompare(getLastName(b.name)));
                return { keyMan: km, members: members };
            });

            const orphans = personnel.filter(p => !p.keyManId && (!p.caps || !p.caps.includes('keyman')));
            orphans.sort((a, b) => getLastName(a.name).localeCompare(getLastName(b.name)));

            if (orphans.length > 0) {
                groups.push({ keyMan: null, members: orphans });
            }

            if (personnel.length === 0) {
                return (
                    <div className="glass-panel p-8 rounded-3xl shadow-sm">
                        <div className="flex justify-between items-center mb-8">
                            <div>
                                <h2 className="text-2xl font-bold text-gray-900 tracking-tight dark:text-white">Personnel Roster</h2>
                                <p className="text-gray-500 text-sm mt-1 dark:text-gray-400">Start by adding your team</p>
                            </div>
                            <div className="relative overflow-hidden inline-block group">
                                <button className="bg-purple-500 text-white py-2 px-5 rounded-full font-semibold shadow-sm hover:bg-purple-600 hover:shadow-md transition-all active:scale-95 flex items-center gap-2 dark:bg-purple-600 dark:hover:bg-purple-700"><i className="fa fa-file-csv"></i> Import CSV</button>
                                <input type="file" accept=".csv" onChange={handleCSVUpload} className="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer" />
                            </div>
                        </div>

                        {/* EDIT FORM */}
                        <div className={`p-6 rounded-2xl border mb-8 bg-gray-50/50 border-gray-200 dark:bg-slate-800/50 dark:border-slate-700`}>
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-sm font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400">Add New Personnel</h3>
                            </div>
                            <div className="flex flex-wrap gap-4 items-end">
                                <div className="mb-2">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">Name</label>
                                    <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="border border-gray-300 p-2.5 rounded-xl w-48 bg-white text-gray-900 focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:ring-blue-800" placeholder="Full Name" />
                                </div>
                                <div className="mb-2">
                                    <label className="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1 dark:text-gray-400">Congregation</label>

                                                                ) : (
                                                                    <div>
                                                                        <div className="flex items-center gap-2">
                                                                            <i className="fa fa-grip-vertical text-gray-300 cursor-grab"></i>
                                                                            {p.name}
                                                                            {p.tags && p.tags.map(tid => {
                                                                                const t = tags ? tags.find(tag => tag.id === tid) : null;
                                                                                return t ? <span key={tid} className="ml-1 text-[10px] bg-purple-100 text-purple-800 px-1.5 py-0.5 rounded border border-purple-200"><i className="fa fa-tag mr-1"></i>{t.name}</span> : null;
                                                                            })}
                                                                        </div>
                                                                        {p.congregation && <div className="text-[10px] text-gray-400 ml-5 dark:text-gray-500">{p.congregation}</div>}
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td className="px-6 py-3">
                                                                {isEditing ? (
                                                                    <select
                                                                        value={formData.role}
                                                                        onChange={(e) => setFormData({...formData, role: e.target.value})}
                                                                        className="border p-1 rounded w-full text-xs dark:bg-slate-700 dark:border-slate-600 dark:text-white"
                                                                    >
                                                                        <option value="Exemplary">Exemplary</option>
                                                                        <option value="MS">MS</option>
                                                                        <option value="Elder">Elder</option>
                                                                    </select>
                                                                ) : (
                                                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide uppercase shadow-sm
                                                                        ${p.role === 'Elder' ? 'bg-yellow-100 text-yellow-700' :
                                                                          p.role === 'MS' ? 'bg-blue-100 text-blue-700' :
                                                                          'bg-gray-100 text-gray-600'}`}>
                                                                        {p.role}
                                                                    </span>
                                                                )}
                                                            </td>
                                                            <td className="px-6 py-3">
                                                                {isEditing ? (
                                                                    <div>
                                                                        <div className="flex flex-wrap gap-2 max-w-[200px] mb-2">
                                                                            {areas.map(area => (
                                                                                <label key={area.capability} className="flex items-center cursor-pointer text-[10px] bg-white border px-1 rounded hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300 dark:hover:bg-slate-600">
                                                                                    <input
                                                                                        type="checkbox"
                                                                                        checked={formData.caps[area.capability]}
                                                                                        onChange={e=>handleCapChange(area.capability, e.target.checked)}
                                                                                        className="mr-1 w-3 h-3"
                                                                                    />
                                                                                    {area.capability === 'auditorium' ? 'Aud' : area.capability.slice(0,3).toUpperCase()}
                                                                                </label>
                                                                            ))}
                                                                            <label className="flex items-center cursor-pointer text-[10px] bg-yellow-50 border border-yellow-200 px-1 rounded hover:bg-yellow-100 dark:bg-yellow-900/30 dark:border-yellow-700 dark:text-yellow-100 dark:hover:bg-yellow-900/50">
                                                                                <input
                                                                                    type="checkbox"
                                                                                    checked={formData.caps['keyman']}
                                                                                    onChange={e=>handleCapChange('keyman', e.target.checked)}
                                                                                    className="mr-1 w-3 h-3"
                                                                                />
                                                                                KM
                                                                            </label>
                                                                        </div>
                                                                        <div className="border-t border-gray-200 pt-1 dark:border-slate-600">
                                                                            <span className="text-[9px] font-bold uppercase text-gray-400 block mb-1">Unavailable</span>
                                                                            <div className="flex flex-wrap gap-1">
                                                                                {shifts.map(s => (
                                                                                    <label key={s.id} className="flex items-center cursor-pointer text-[10px] bg-white border px-1 rounded hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300 dark:hover:bg-slate-600">
                                                                                        <input
                                                                                            type="checkbox"
                                                                                            checked={formData.unavailable && formData.unavailable.includes(s.id)}
                                                                                            onChange={e=>handleUnavailableChange(s.id, e.target.checked)}
                                                                                            className="mr-1 w-3 h-3"
                                                                                        />
                                                                                        {s.label.split('(')[0]}
                                                                                    </label>
                                                                                ))}
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                ) : (
                                                                    <div className="flex flex-wrap gap-1">
                                                                        {p.caps.map(c => (
                                                                            <span key={c} className="text-[10px] bg-gray-100 border border-gray-200 px-2 py-0.5 rounded-full text-gray-500 font-medium">
                                                                                {c === 'auditorium' ? 'Aud' : c.charAt(0).toUpperCase() + c.slice(1)}
                                                                            </span>
                                                                        ))}
                                                                        {p.unavailable && p.unavailable.length > 0 && (
                                                                             <span className="text-[10px] bg-red-50 text-red-600 border border-red-100 px-2 py-0.5 rounded-full font-bold ml-1" title={p.unavailable.join(', ')}>
                                                                                Unavail ({p.unavailable.length})
                                                                             </span>
                                                                        )}

                                                                )}
