                        <button onClick={() => setActiveTab('shifts')} className={`px-4 py-2 ${activeTab === 'shifts' ? 'border-b-2 border-blue-600 font-bold text-blue-600' : 'text-gray-500'}`}>Shifts</button>
                        <button onClick={() => setActiveTab('positions')} className={`px-4 py-2 ${activeTab === 'positions' ? 'border-b-2 border-blue-600 font-bold text-blue-600' : 'text-gray-500'}`}>Positions</button>
                        <button onClick={() => setActiveTab('rules')} className={`px-4 py-2 ${activeTab === 'rules' ? 'border-b-2 border-blue-600 font-bold text-blue-600' : 'text-gray-500'}`}>Rules</button>
                    </div>

                    {/* RULES TAB */}
                    {activeTab === 'rules' && <RulesView rules={rules} setRules={setRules} />}

                    {/* AREAS TAB */}
                    {activeTab === 'areas' && (
                        <div>
                            <div className="bg-gray-50 p-4 rounded border mb-4">
                                <h3 className="font-bold mb-2">Add New Area</h3>
                                <div className="flex gap-2 mb-2">
                                    <input placeholder="ID (e.g. parking)" value={areaForm.id} onChange={e => setAreaForm({...areaForm, id: e.target.value})} className="border p-2 rounded w-32" />
                                    <input placeholder="Name (e.g. Parking Lot)" value={areaForm.name} onChange={e => setAreaForm({...areaForm, name: e.target.value})} className="border p-2 rounded w-64" />
                                    <input placeholder="Capability (opt)" value={areaForm.capability} onChange={e => setAreaForm({...areaForm, capability: e.target.value})} className="border p-2 rounded w-32" />
                                </div>
                                <div className="flex gap-2 items-center">
                                    <label className="text-sm">Bg Color:</label>
                                    <input type="color" value={areaForm.color} onChange={e => setAreaForm({...areaForm, color: e.target.value})} />
                                    <label className="text-sm ml-2">Text Color:</label>
                                    <input type="color" value={areaForm.textColor} onChange={e => setAreaForm({...areaForm, textColor: e.target.value})} />
                                    <button onClick={addArea} className="ml-auto bg-blue-600 text-white px-4 py-1 rounded">Add Area</button>
                                </div>
                            </div>
                            <table className="w-full text-sm">
                                <thead><tr className="bg-gray-100"><th className="p-2 text-left">ID</th><th className="p-2 text-left">Name</th><th className="p-2 text-left">Capability</th><th className="p-2 text-left">Preview</th><th className="p-2">Action</th></tr></thead>
                                <tbody>
                                    {areas.map(a => (
                                        <tr key={a.id} className="border-b">
                                            <td className="p-2">{a.id}</td>
                                            <td className="p-2">{a.name}</td>
                                            <td className="p-2">{a.capability}</td>
                                            <td className="p-2"><div style={a.style} className="px-2 py-1 text-xs rounded text-center">Preview</div></td>
                                            <td className="p-2 text-center"><button onClick={() => deleteArea(a.id)} className="text-red-500"><i className="fa fa-trash"></i></button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* SHIFTS TAB */}
                    {activeTab === 'shifts' && (
                        <div>
                            <div className="bg-gray-50 p-4 rounded border mb-4 flex gap-2 items-end">
                                <div>
                                    <label className="block text-xs font-bold text-gray-600">ID</label>
                                    <input value={shiftForm.id} onChange={e => setShiftForm({...shiftForm, id: e.target.value})} className="border p-2 rounded w-32" placeholder="e.g. mid_morning" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-600">Label</label>
                                    <input value={shiftForm.label} onChange={e => setShiftForm({...shiftForm, label: e.target.value})} className="border p-2 rounded w-64" placeholder="e.g. Mid-Morning (10:00-11:00)" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-600">Minutes</label>
                                    <input type="number" value={shiftForm.minutes} onChange={e => setShiftForm({...shiftForm, minutes: e.target.value})} className="border p-2 rounded w-24" />
                                </div>
                                <button onClick={addShift} className="bg-blue-600 text-white px-4 py-2 rounded h-10">Add Shift</button>
                            </div>
                            <table className="w-full text-sm">
                                <thead><tr className="bg-gray-100"><th className="p-2 text-left">ID</th><th className="p-2 text-left">Label</th><th className="p-2 text-left">Minutes</th><th className="p-2">Action</th></tr></thead>
                                <tbody>
                                    {shifts.map(s => (
                                        <tr key={s.id} className="border-b">
                                            <td className="p-2">{s.id}</td>
                                            <td className="p-2">{s.label}</td>
                                            <td className="p-2">{s.minutes}</td>
                                            <td className="p-2 text-center"><button onClick={() => deleteShift(s.id)} className="text-red-500"><i className="fa fa-trash"></i></button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* POSITIONS TAB */}
                    {activeTab === 'positions' && (
                        <div>
                            <div className="bg-gray-50 p-4 rounded border mb-4">
                                <div className="flex gap-2 mb-2">
                                    <input placeholder="ID (e.g. park_1)" value={posForm.id} onChange={e => setPosForm({...posForm, id: e.target.value})} className="border p-2 rounded w-32" />
                                    <input placeholder="Name (e.g. Lot Entrance)" value={posForm.name} onChange={e => setPosForm({...posForm, name: e.target.value})} className="border p-2 rounded w-64" />
                                    <select value={posForm.areaId} onChange={e => setPosForm({...posForm, areaId: e.target.value})} className="border p-2 rounded w-48">
                                        <option value="">-- Select Area --</option>
                                        {areas.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                    </select>
                                </div>
                                <div className="flex gap-4 items-center">
                                     <select value={posForm.type} onChange={e => setPosForm({...posForm, type: e.target.value})} className="border p-2 rounded w-32">
                                        <option value="rotational">Rotational</option>
                                        <option value="auditorium">Auditorium (All Day)</option>
                                    </select>
                                    <select value={posForm.teamKeyManId} onChange={e => setPosForm({...posForm, teamKeyManId: e.target.value})} className="border p-2 rounded w-48">
                                        <option value="">-- Any Team --</option>
                                        {keyMen.map(km => <option key={km.id} value={km.id}>Team: {km.name}</option>)}
                                    </select>
                                    <label className="flex items-center cursor-pointer">
                                        <input type="checkbox" checked={posForm.keyMan} onChange={e => setPosForm({...posForm, keyMan: e.target.checked})} className="mr-2" />
                                        <span className="text-sm font-bold">Key Man Only</span>
                                    </label>
                                    <button onClick={addPosition} className="ml-auto bg-blue-600 text-white px-4 py-1 rounded">Add Position</button>
                                </div>
                            </div>
                             <div className="h-96 overflow-y-auto border rounded">
                                <table className="w-full text-sm">
                                    <thead><tr className="bg-gray-100 sticky top-0"><th className="p-2 text-left">ID</th><th className="p-2 text-left">Name</th><th className="p-2 text-left">Area</th><th className="p-2 text-left">Team</th><th className="p-2 text-left">Type</th><th className="p-2">Action</th></tr></thead>
                                    <tbody>
                                        {positions.map(p => (
                                            <tr key={p.id} className="border-b hover:bg-gray-50">
                                                <td className="p-2">{p.id}</td>
                                                <td className="p-2">{p.name} {p.keyMan && <span className="text-[10px] bg-yellow-100 text-yellow-800 px-1 rounded border border-yellow-200">KM</span>}</td>
                                                <td className="p-2">{areas.find(a => a.id === p.areaId)?.name || p.areaId}</td>
                                                <td className="p-2 text-xs text-gray-500">{p.teamKeyManId ? (keyMen.find(k=>k.id===p.teamKeyManId)?.name || 'Unknown') : '-'}</td>
                                                <td className="p-2">{p.type}</td>
                                                <td className="p-2 text-center"><button onClick={() => deletePosition(p.id)} className="text-red-500"><i className="fa fa-trash"></i></button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- UNDO/REDO HOOK ---
        function useUndoRedo(initialState) {
            const [history, setHistory] = useState([initialState]);
            const [index, setIndex] = useState(0);

            const state = history[index];

            const setState = (newState) => {
                const newHistory = history.slice(0, index + 1);
                newHistory.push(newState);
                if(newHistory.length > 50) newHistory.shift();
                setHistory(newHistory);
                setIndex(newHistory.length - 1);
            };

            const undo = () => index > 0 && setIndex(index - 1);
            const redo = () => index < history.length - 1 && setIndex(index + 1);

            return { state, setState, undo, redo, canUndo: index > 0, canRedo: index < history.length - 1 };
        }

        function App() {
            const [view, setView] = useState('schedule');

            const INITIAL_STATE = {
                personnel: INITIAL_ROSTER,
                assignments: {},
                log: [],
                areas: DEFAULT_AREAS,
                positions: DEFAULT_POSITIONS,
                shifts: DEFAULT_SHIFTS,
                rules: {
                    capabilitySeverity: 'error',
                    doubleBookingSeverity: 'error',
                    unavailableSeverity: 'error',
                    avoidConsecutive: true,
                    anchorLimits: true,
                    maxWorkPercent: 50
                }
            };

            const { state, setState, undo, redo, canUndo, canRedo } = useUndoRedo(INITIAL_STATE);
            const { personnel, assignments, log, areas, positions, shifts, rules } = state;

            const [showSaveModal, setShowSaveModal] = useState(false);
            const [showLoadModal, setShowLoadModal] = useState(false);
            const [password, setPassword] = useState('');

            // --- WRAPPERS FOR STATE UPDATES ---
            const updateState = (updates) => setState({ ...state, ...updates });

            const setPersonnel = (val) => updateState({ personnel: typeof val === 'function' ? val(personnel) : val });
            const setAssignments = (val) => updateState({ assignments: typeof val === 'function' ? val(assignments) : val });
            const setAreas = (val) => updateState({ areas: typeof val === 'function' ? val(areas) : val });
            const setPositions = (val) => updateState({ positions: typeof val === 'function' ? val(positions) : val });
            const setShifts = (val) => updateState({ shifts: typeof val === 'function' ? val(shifts) : val });
            const setRules = (val) => updateState({ rules: typeof val === 'function' ? val(rules) : val });

            const handleAutoFill = (newAssignments, newLog) => {
                updateState({ assignments: newAssignments, log: newLog });
            };

            // --- PERSISTENCE ---
            useEffect(() => {
                const saved = localStorage.getItem('circuit_scheduler_data');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        // Merge default rules if not present in saved data
                        const defaultRules = INITIAL_STATE.rules;
                        const loadedState = {
                            ...INITIAL_STATE,
                            ...parsed,
                            rules: { ...defaultRules, ...(parsed.rules || {}) }
                        };
                        setState(loadedState);
                    } catch (e) { console.error("Failed to load cache", e); }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('circuit_scheduler_data', JSON.stringify(state));
            }, [state]);

            const resetAll = () => {
                if(confirm("Are you sure you want to clear EVERYTHING? This cannot be undone.")) {
                    localStorage.removeItem('circuit_scheduler_data');
                    window.location.reload();
                }
            };


            const handleExport = () => {
                if(!password) return alert("Please enter a password.");
                const data = JSON.stringify(state);
                const encrypted = CryptoJS.AES.encrypt(data, password).toString();
                const blob = new Blob([encrypted], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Attendants_Schedule_${new Date().toISOString().slice(0,10)}.lock`;
                a.click();
                setShowSaveModal(false);
                setPassword('');
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const encrypted = event.target.result;
                        const bytes = CryptoJS.AES.decrypt(encrypted, password);
                        const decryptedData = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
                        if(decryptedData.personnel && decryptedData.assignments) {
                            setState({ ...INITIAL_STATE, ...decryptedData });
                            alert("Loaded successfully!");
                            setShowLoadModal(false);
                            setPassword('');
                        } else {
                            throw new Error("Invalid structure");
                        }
                    } catch (err) {
                        alert("Failed to load! Incorrect password or corrupted file.");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen pb-10">
                    <div className="bg-blue-900 text-white p-4 shadow-lg">
                        <div className="container mx-auto flex justify-between items-center">
                            <h1 className="text-xl font-bold"><i className="fa fa-clipboard-user mr-2"></i> Circuit Attendant Scheduler</h1>
                            <div className="flex items-center gap-4">
                                <button onClick={undo} disabled={!canUndo} className={`px-3 py-1 rounded ${!canUndo ? 'bg-blue-800 text-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500'}`} title="Undo"><i className="fa fa-undo"></i></button>
                                <button onClick={redo} disabled={!canRedo} className={`px-3 py-1 rounded ${!canRedo ? 'bg-blue-800 text-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500'}`} title="Redo"><i className="fa fa-redo"></i></button>
                                <div className="w-px h-6 bg-blue-700 mx-2"></div>
                                <button onClick={() => setView('schedule')} className={`px-3 py-1 rounded ${view==='schedule'?'bg-blue-700':'hover:bg-blue-800'}`}>Schedule</button>
                                <button onClick={() => setView('roster')} className={`px-3 py-1 rounded ${view==='roster'?'bg-blue-700':'hover:bg-blue-800'}`}>Roster</button>
                                <button onClick={() => setView('stats')} className={`px-3 py-1 rounded ${view==='stats'?'bg-blue-700':'hover:bg-blue-800'}`}>Time Stats</button>
                                <button onClick={() => setView('dept')} className={`px-3 py-1 rounded ${view==='dept'?'bg-blue-700':'hover:bg-blue-800'}`}>Depts</button>
                                <button onClick={() => setView('log')} className={`px-3 py-1 rounded ${view==='log'?'bg-blue-700':'hover:bg-blue-800'}`}>Log</button>
                                <button onClick={() => setView('print')} className={`px-3 py-1 rounded ${view==='print'?'bg-blue-700':'hover:bg-blue-800'}`}><i className="fa fa-print mr-1"></i> Slips</button>
                                <button onClick={() => setView('config')} className={`px-3 py-1 rounded ${view==='config'?'bg-blue-700':'hover:bg-blue-800'}`}><i className="fa fa-cog mr-1"></i> Config</button>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={resetAll} className="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-bold text-white mr-2">Reset All</button>
                                <button onClick={() => setShowSaveModal(true)} className="bg-green-500 hover:bg-green-600 px-3 py-1 rounded text-sm font-bold">Save</button>
                                <button onClick={() => setShowLoadModal(true)} className="bg-yellow-500 hover:bg-yellow-600 px-3 py-1 rounded text-sm font-bold text-black">Load</button>
                            </div>
                        </div>
                    </div>
                    <div className="container mx-auto mt-6 px-4">
                        {view === 'roster' ? <RosterView personnel={personnel} setPersonnel={setPersonnel} areas={areas} shifts={shifts} /> :
                         view === 'stats' ? <StatsView personnel={personnel} assignments={assignments} shifts={shifts} positions={positions} /> :
                         view === 'dept' ? <DepartmentView personnel={personnel} assignments={assignments} areas={areas} positions={positions} shifts={shifts} /> :
                         view === 'log' ? <LogView log={log} /> :
                         view === 'print' ? <PrintView personnel={personnel} assignments={assignments} positions={positions} shifts={shifts} /> :
                         view === 'config' ? <ConfigView areas={areas} setAreas={setAreas} positions={positions} setPositions={setPositions} shifts={shifts} setShifts={setShifts} personnel={personnel} rules={rules} setRules={setRules} /> :
                         <ScheduleView personnel={personnel} assignments={assignments} setAssignments={setAssignments} onAutoFill={handleAutoFill} areas={areas} positions={positions} shifts={shifts} rules={rules} />}
                    </div>
                    {showSaveModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded shadow-xl w-96">
                                <h3 className="font-bold text-lg mb-4">Secure Export</h3>
                                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full border p-2 rounded mb-4" placeholder="Password" />
                                <div className="flex justify-end gap-2">
                                    <button onClick={()=>setShowSaveModal(false)} className="px-4 py-2 text-gray-600">Cancel</button>
                                    <button onClick={handleExport} className="px-4 py-2 bg-blue-600 text-white rounded">Download</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {showLoadModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded shadow-xl w-96">
                                <h3 className="font-bold text-lg mb-4">Load Schedule</h3>
                                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full border p-2 rounded mb-4" placeholder="Password" />
                                <input type="file" onChange={handleImport} className="w-full mb-4" />
                                <div className="flex justify-end gap-2">
                                    <button onClick={()=>setShowLoadModal(false)} className="px-4 py-2 text-gray-600">Cancel</button>
                                    <button onClick={handleExport} className="px-4 py-2 bg-blue-600 text-white rounded">Download</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
