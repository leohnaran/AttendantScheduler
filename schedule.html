                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-bold uppercase text-gray-400 mb-1 dark:text-gray-500">Tag Name</label>
                                                <input
                                                    type="text"
                                                    value={selectedTag.name}
                                                    onChange={(e) => updateTagName(selectedTag, e.target.value)}
                                                    className="border border-gray-200 p-2 rounded-lg w-full max-w-sm text-sm focus:ring-2 focus:ring-blue-100 outline-none dark:bg-slate-700 dark:border-slate-600 dark:text-white"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold uppercase text-gray-400 mb-2 dark:text-gray-500">Restricted Shifts</label>
                                                <div className="flex flex-wrap gap-2">
                                                    <label className={`flex items-center text-xs px-2.5 py-1 rounded-full cursor-pointer transition-all border ${selectedTag.restrictedShifts.includes('all_day') ? 'bg-blue-100 border-blue-200 text-blue-700 font-bold dark:bg-blue-900 dark:border-blue-700 dark:text-blue-300' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300'}`}>
                                                        <input
                                                            type="checkbox"
                                                            checked={selectedTag.restrictedShifts.includes('all_day')}
                                                            onChange={() => toggleShiftEdit(selectedTag, 'all_day')}
                                                            className="mr-1.5"
                                                        />
                                                        All Day
                                                    </label>
                                                    {shifts.map(s => (
                                                        <label key={s.id} className={`flex items-center text-xs px-2.5 py-1 rounded-full cursor-pointer transition-all border ${selectedTag.restrictedShifts.includes(s.id) ? 'bg-red-100 border-red-200 text-red-700 font-bold dark:bg-red-900/30 dark:border-red-800 dark:text-red-400' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300'}`}>
                                                            <input
                                                                type="checkbox"
                                                                checked={selectedTag.restrictedShifts.includes(s.id)}
                                                                onChange={() => toggleShiftEdit(selectedTag, s.id)}
                                                                className="mr-1.5"
                                                            />
                                                            {s.label}
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold uppercase text-gray-400 mb-2 dark:text-gray-500">Restricted Areas</label>
                                                <div className="flex flex-wrap gap-2">
                                                    {areas.map(a => (
                                                        <label key={a.id} className={`flex items-center text-xs px-2.5 py-1 rounded-full cursor-pointer transition-all border ${selectedTag.restrictedAreas && selectedTag.restrictedAreas.includes(a.id) ? 'bg-purple-100 border-purple-200 text-purple-700 font-bold dark:bg-purple-900/30 dark:border-purple-800 dark:text-purple-400' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300'}`}>
                                                            <input
                                                                type="checkbox"
                                                                checked={selectedTag.restrictedAreas && selectedTag.restrictedAreas.includes(a.id)}
                                                                onChange={() => toggleAreaEdit(selectedTag, a.id)}
                                                                className="mr-1.5"
                                                            />
                                                            {a.name}
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-center mb-2">
                                        <h4 className="font-bold text-gray-700 dark:text-gray-300 text-sm uppercase tracking-wide">Manage Members</h4>
                                        <div className="relative w-64">
                                            <i className="fa fa-search absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                                            <input
                                                type="text"
                                                placeholder="Search Name or Role..."
                                                value={filterName}
                                                onChange={e => setFilterName(e.target.value)}
                                                className="w-full border border-gray-200 p-2 pl-9 rounded-lg bg-white focus:ring-2 focus:ring-blue-100 outline-none transition-all shadow-sm text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex-1 overflow-y-auto border border-gray-100 rounded-xl bg-gray-50/50 shadow-inner dark:bg-slate-800/50 dark:border-slate-700">
                                        <table className="w-full text-sm">
                                            <thead className="bg-gray-100 sticky top-0 dark:bg-slate-700 dark:text-gray-300">
                                                <tr>
                                                    <th className="p-3 text-left w-10"></th>
                                                    <th className="p-3 text-left">Name</th>
                                                    <th className="p-3 text-left">Role</th>
                                                    <th className="p-3 text-left">Current Tags</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-200 dark:divide-slate-700">
                                                {filteredPersonnel.map(p => {
                                                    const isMember = p.tags && p.tags.includes(selectedTag.id);
                                                    return (
                                                        <tr key={p.id} className={`hover:bg-white transition-colors cursor-pointer group dark:hover:bg-slate-700 ${isMember ? 'bg-green-50 dark:bg-green-900/10' : ''}`} onClick={() => togglePersonTag(p.id, selectedTag.id)}>
                                                            <td className="p-3 text-center">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={isMember || false}
                                                                    onChange={() => {}} // Handled by row click
                                                                    className="w-4 h-4 cursor-pointer text-blue-600 rounded focus:ring-blue-500 dark:bg-slate-600 dark:border-slate-500"
                                                                />
                                                            </td>
                                                            <td className="p-3 font-medium text-gray-800 dark:text-gray-200 group-hover:text-blue-600 transition-colors">{p.name}</td>
                                                            <td className="p-3 text-xs text-gray-500 dark:text-gray-400">{p.role}</td>
                                                            <td className="p-3 text-xs text-gray-500">
                                                                {p.tags && p.tags.map(tid => {
                                                                    const t = tags.find(tag => tag.id === tid);
                                                                    return t ? <span key={tid} className="bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded mr-1 dark:bg-slate-600 dark:text-gray-300">{t.name}</span> : null;
                                                                })}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="mt-2 text-xs text-gray-400 text-right dark:text-gray-500">
                                        Click rows to toggle membership.
                                    </div>
                                </>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center text-gray-400 dark:text-gray-500">
                                    <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-2xl mb-4 dark:bg-slate-700">
                                        <i className="fa fa-tags"></i>
                                    </div>
                                    <p>Select a tag from the left to edit settings and manage members.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function ConfigView({ areas, setAreas, positions, setPositions, shifts, setShifts, personnel, rules, setRules, tags }) {
            const [activeTab, setActiveTab] = useState('areas');

            const keyMen = useMemo(() => personnel.filter(p => p.caps && p.caps.includes('keyman')), [personnel]);
            const uniqueCongregations = useMemo(() => {
                return [...new Set(personnel.map(p => p.congregation).filter(c => c && c.trim() !== ''))].sort();
            }, [personnel]);

            const renderConstraintSelector = (form, setForm, prefix) => (
                <div className="flex gap-2 items-center">
                    <select value={form.limitType || ''} onChange={e => setForm({...form, limitType: e.target.value, limitValue: ''})} className={`border p-1 rounded text-xs dark:bg-slate-700 dark:border-slate-600 dark:text-white ${prefix ? 'w-full' : 'w-24'}`}>
                        <option value="">Any</option>
                        <option value="keyman">Key Man</option>
                        <option value="congregation">Congregation</option>
                        <option value="tag">Tag</option>
                    </select>
                    {form.limitType && (
                        <select value={form.limitValue || ''} onChange={e => setForm({...form, limitValue: e.target.value})} className={`border p-1 rounded text-xs dark:bg-slate-700 dark:border-slate-600 dark:text-white ${prefix ? 'w-full' : 'w-32'}`}>
                            <option value="">-- Select --</option>
                            {form.limitType === 'keyman' && keyMen.map(km => <option key={km.id} value={km.id}>{km.name}</option>)}
                            {form.limitType === 'congregation' && uniqueCongregations.map(c => <option key={c} value={c}>{c}</option>)}
                            {form.limitType === 'tag' && tags.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                        </select>
                    )}
                </div>
            );

            const getConstraintLabel = (obj) => {
                if (!obj.limitType) return '-';
                if (obj.limitType === 'keyman') {
                    const km = keyMen.find(k => k.id == obj.limitValue);
                    return `KM: ${km ? km.name : 'Unknown'}`;
                }
                if (obj.limitType === 'congregation') return `Cong: ${obj.limitValue}`;
                if (obj.limitType === 'tag') {
                    const t = tags.find(tag => tag.id === obj.limitValue);
                    return `Tag: ${t ? t.name : 'Unknown'}`;
                }
                return '-';
            };

            // --- AREA MANAGEMENT ---
            const [areaForm, setAreaForm] = useState({ id: '', name: '', capability: '', color: '#ffffff', textColor: '#000000', limitType: '', limitValue: '' });
            const [editingAreaId, setEditingAreaId] = useState(null);
            const [editAreaForm, setEditAreaForm] = useState(null);

            const addArea = () => {
                if (!areaForm.id || !areaForm.name) return alert("ID and Name are required");
                if (areas.find(a => a.id === areaForm.id)) return alert("ID must be unique");
                setAreas([...areas, {
                    id: areaForm.id,
                    name: areaForm.name,
                    capability: areaForm.capability || areaForm.id,
                    style: { backgroundColor: areaForm.color, color: areaForm.textColor },
                    limitType: areaForm.limitType,
                    limitValue: areaForm.limitValue
                }]);
                setAreaForm({ id: '', name: '', capability: '', color: '#ffffff', textColor: '#000000', limitType: '', limitValue: '' });
            };
            const deleteArea = (id) => {
                if (confirm("Delete this area? This may break positions linked to it.")) {
                    setAreas(areas.filter(a => a.id !== id));
                    if (editingAreaId === id) cancelEditArea();
                }
            };

            const startEditArea = (area) => {
                setEditingAreaId(area.id);
                setEditAreaForm({
                    id: area.id,
                    name: area.name,
                    capability: area.capability,
                    color: area.style.backgroundColor,
                    textColor: area.style.color,
                    limitType: area.limitType || '',
                    limitValue: area.limitValue || ''
                });
            };

            const cancelEditArea = () => {
                setEditingAreaId(null);
                setEditAreaForm(null);
            };

            const saveAreaUpdate = () => {
                if (!editAreaForm.name) return alert("Name is required");

                // Update Area
                setAreas(areas.map(a => a.id === editingAreaId ? {
                    id: a.id, // ID remains immutable
                    name: editAreaForm.name,
                    capability: editAreaForm.capability,
                    style: { backgroundColor: editAreaForm.color, color: editAreaForm.textColor },
                    limitType: editAreaForm.limitType,
                    limitValue: editAreaForm.limitValue
                } : a));

                // Auto-apply to all positions in this area (Bulk Update)
                if (editAreaForm.limitType) {
                    setPositions(prev => prev.map(p => {
                        if (p.areaId === editingAreaId) {
                            return {
                                ...p,
                                limitType: editAreaForm.limitType,
                                limitValue: editAreaForm.limitValue
                            };
                        }
                        return p;
                    }));
                }

                cancelEditArea();
            };

            // --- SHIFT MANAGEMENT ---
            const [shiftForm, setShiftForm] = useState({ id: '', label: '', minutes: 150 });
            const addShift = () => {
                if (!shiftForm.id || !shiftForm.label) return alert("ID and Label are required");
                if (shifts.find(s => s.id === shiftForm.id)) return alert("ID must be unique");
                setShifts([...shifts, { ...shiftForm, minutes: parseInt(shiftForm.minutes) }]);
                setShiftForm({ id: '', label: '', minutes: 150 });
            };
            const deleteShift = (id) => {
                if (confirm("Delete this shift?")) {
                    setShifts(shifts.filter(s => s.id !== id));
                }
            };

            // --- POSITION MANAGEMENT ---
            const [posForm, setPosForm] = useState({ id: '', name: '', areaId: '', type: 'rotational', keyMan: false, limitType: '', limitValue: '', section: '' });
            const [editingPosId, setEditingPosId] = useState(null);
            const [editPosForm, setEditPosForm] = useState(null);

            const addPosition = () => {
                if (!posForm.id || !posForm.name || !posForm.areaId) return alert("ID, Name, and Area are required");
                if (positions.find(p => p.id === posForm.id)) return alert("ID must be unique");
                setPositions([...positions, { ...posForm }]);
                setPosForm({ id: '', name: '', areaId: '', type: 'rotational', keyMan: false, limitType: '', limitValue: '', section: '' });
            };

            // Auto-fill restriction when Area is selected
            useEffect(() => {
                if (posForm.areaId) {
                    const area = areas.find(a => a.id === posForm.areaId);
                    if (area && area.limitType) {
                        setPosForm(prev => ({
                            ...prev,
                            limitType: area.limitType,
                            limitValue: area.limitValue
                        }));
                    }
                }
            }, [posForm.areaId, areas]);
            const deletePosition = (id) => {
                if (confirm("Delete this position?")) {
                    setPositions(positions.filter(p => p.id !== id));
                    if (editingPosId === id) cancelEditPos();
                }
            };

            const startEditPos = (pos) => {
                setEditingPosId(pos.id);
                // Backward compatibility: map teamKeyManId to limitType='keyman' if present
                let lType = pos.limitType || '';
                let lVal = pos.limitValue || '';
                if (!lType && pos.teamKeyManId) {
                    lType = 'keyman';
                    lVal = pos.teamKeyManId;
                }

                setEditPosForm({
                    id: pos.id,
                    name: pos.name,
                    areaId: pos.areaId,
                    type: pos.type,
                    keyMan: pos.keyMan || false,
                    limitType: lType,
                    limitValue: lVal,
                    section: pos.section || ''
                });
            };

            const cancelEditPos = () => {
                setEditingPosId(null);
                setEditPosForm(null);
            };

            const savePosUpdate = () => {
                if (!editPosForm.name || !editPosForm.areaId) return alert("Name and Area are required");
                setPositions(positions.map(p => p.id === editingPosId ? {
                    id: p.id,
                    name: editPosForm.name,
                    areaId: editPosForm.areaId,
                    type: editPosForm.type,
                    keyMan: editPosForm.keyMan,
                    limitType: editPosForm.limitType,
                    limitValue: editPosForm.limitValue,
                    section: editPosForm.section
                } : p));
                cancelEditPos();
            };

            return (
                <div className="glass-panel p-8 rounded-3xl shadow-sm">
                    <h2 className="text-2xl font-bold text-gray-900 tracking-tight mb-6 dark:text-white">Configuration</h2>

                    <div className="flex border-b mb-6 overflow-x-auto dark:border-slate-700">
                        <button onClick={() => setActiveTab('areas')} className={`px-4 py-2 ${activeTab === 'areas' ? 'border-b-2 border-blue-600 font-bold text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400'}`}>Areas</button>
                        <button onClick={() => setActiveTab('shifts')} className={`px-4 py-2 ${activeTab === 'shifts' ? 'border-b-2 border-blue-600 font-bold text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400'}`}>Shifts</button>
                        <button onClick={() => setActiveTab('positions')} className={`px-4 py-2 ${activeTab === 'positions' ? 'border-b-2 border-blue-600 font-bold text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400'}`}>Positions</button>
                        <button onClick={() => setActiveTab('rules')} className={`px-4 py-2 ${activeTab === 'rules' ? 'border-b-2 border-blue-600 font-bold text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400'}`}>Rules</button>
                    </div>

                    {/* RULES TAB */}
                    {activeTab === 'rules' && <RulesView rules={rules} setRules={setRules} />}

                    {/* AREAS TAB */}
                    {activeTab === 'areas' && (
                        <div>
                            <div className="bg-gray-50 p-4 rounded border mb-4 dark:bg-slate-800 dark:border-slate-700">
                                <h3 className="font-bold mb-2 dark:text-white">Add New Area</h3>
                                <div className="flex gap-2 mb-2">

        // --- UNDO/REDO HOOK ---
        function useUndoRedo(initialState) {
            const [history, setHistory] = useState([initialState]);
            const [index, setIndex] = useState(0);

            const state = history[index];

            const setState = (newState) => {
                const newHistory = history.slice(0, index + 1);
                newHistory.push(newState);
                if(newHistory.length > 50) newHistory.shift();
                setHistory(newHistory);
                setIndex(newHistory.length - 1);
            };

            const undo = () => index > 0 && setIndex(index - 1);
            const redo = () => index < history.length - 1 && setIndex(index + 1);

            return { state, setState, undo, redo, canUndo: index > 0, canRedo: index < history.length - 1 };
        }

        function App() {
            const [view, setView] = useState('schedule');

            const INITIAL_STATE = {
                personnel: INITIAL_ROSTER,
                tags: [],
                assignments: {},
                log: [],
                areas: DEFAULT_AREAS,
                positions: DEFAULT_POSITIONS,
                shifts: DEFAULT_SHIFTS,
                rules: {
                    capabilitySeverity: 'error',
                    doubleBookingSeverity: 'error',
                    unavailableSeverity: 'error',
                    avoidConsecutive: true,
                    anchorLimits: true,
                    maxWorkPercent: 50,
                    auditoriumRotationMode: false,
                    auditoriumCoverage: 25
                }
            };

            const { state, setState, undo, redo, canUndo, canRedo } = useUndoRedo(INITIAL_STATE);
            const { personnel, tags, assignments, log, areas, positions, shifts, rules } = state;

            const [showSaveModal, setShowSaveModal] = useState(false);
            const [showLoadModal, setShowLoadModal] = useState(false);
            const [showQuickStart, setShowQuickStart] = useState(false);
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('dark_mode') === 'true');
            const [password, setPassword] = useState('');

            useEffect(() => {
                const hasSeen = localStorage.getItem('has_seen_quickstart');
                if (!hasSeen) setShowQuickStart(true);
            }, []);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('dark_mode', darkMode);
            }, [darkMode]);

            // --- WRAPPERS FOR STATE UPDATES ---
            const updateState = (updates) => setState({ ...state, ...updates });

            const setPersonnel = (val) => updateState({ personnel: typeof val === 'function' ? val(personnel) : val });
            const setTags = (val) => updateState({ tags: typeof val === 'function' ? val(tags) : val });
            const setAssignments = (val) => updateState({ assignments: typeof val === 'function' ? val(assignments) : val });
            const setAreas = (val) => updateState({ areas: typeof val === 'function' ? val(areas) : val });
            const setPositions = (val) => updateState({ positions: typeof val === 'function' ? val(positions) : val });
            const setShifts = (val) => updateState({ shifts: typeof val === 'function' ? val(shifts) : val });
            const setRules = (val) => updateState({ rules: typeof val === 'function' ? val(rules) : val });

            const handleAutoFill = (newAssignments, newLog) => {
                updateState({ assignments: newAssignments, log: newLog });
            };

            const handleDeleteTag = (tagId) => {
                 const newTags = tags.filter(t => t.id !== tagId);
                 const newPersonnel = personnel.map(p => ({
                    ...p,
                    tags: p.tags ? p.tags.filter(tid => tid !== tagId) : []
                 }));
                 updateState({ tags: newTags, personnel: newPersonnel });
            };

            // --- PERSISTENCE ---
            useEffect(() => {
                const saved = localStorage.getItem('circuit_scheduler_data');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        // Merge default rules if not present in saved data
                        const defaultRules = INITIAL_STATE.rules;
                        const loadedState = {
                            ...INITIAL_STATE,
                            ...parsed,
                            rules: { ...defaultRules, ...(parsed.rules || {}) }
                        };
                        setState(loadedState);
                    } catch (e) { console.error("Failed to load cache", e); }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('circuit_scheduler_data', JSON.stringify(state));
            }, [state]);

            const resetAll = () => {
                if(confirm("Are you sure you want to clear EVERYTHING? This cannot be undone.")) {
                    localStorage.removeItem('circuit_scheduler_data');
                    window.location.reload();
                }
            };


            const handleExport = () => {
                if(!password) return alert("Please enter a password.");
                const data = JSON.stringify(state);
                const encrypted = CryptoJS.AES.encrypt(data, password).toString();
                const blob = new Blob([encrypted], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Attendants_Schedule_${new Date().toISOString().slice(0,10)}.lock`;
                a.click();
                setShowSaveModal(false);
                setPassword('');
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const encrypted = event.target.result;
                        const bytes = CryptoJS.AES.decrypt(encrypted, password);
                        const decryptedData = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
                        if(decryptedData.personnel && decryptedData.assignments) {
                            setState({ ...INITIAL_STATE, ...decryptedData });
                            alert("Loaded successfully!");
                            setShowLoadModal(false);
                            setPassword('');
                        } else {
                            throw new Error("Invalid structure");
                        }
                    } catch (err) {
                        alert("Failed to load! Incorrect password or corrupted file.");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen pb-10 text-gray-800">
                    <header className="glass-header sticky top-0 z-50 px-6 py-3 shadow-sm mb-8">

                                        <i className="fa fa-clipboard-user"></i>
                                    </div>
                                    <span className="tracking-tight">Circuit Attendant Scheduler</span>
                                </h1>
                                <div className="h-6 w-px bg-gray-300 hidden sm:block"></div>
                                <div className="flex gap-1">
                                    <button onClick={undo} disabled={!canUndo} className={`w-8 h-8 flex items-center justify-center rounded-full transition-all ${!canUndo ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-100 hover:text-blue-600'}`} title="Undo"><i className="fa fa-undo"></i></button>
                                    <button onClick={redo} disabled={!canRedo} className={`w-8 h-8 flex items-center justify-center rounded-full transition-all ${!canRedo ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-100 hover:text-blue-600'}`} title="Redo"><i className="fa fa-redo"></i></button>
                                </div>
                            </div>

                            <nav className="flex items-center p-1 bg-gray-100/80 rounded-full overflow-hidden shadow-inner border border-gray-200">
                                {['schedule', 'roster', 'stats', 'dept', 'log', 'tags', 'print', 'config'].map(v => (
                                    <button
                                        key={v}
                                        onClick={() => setView(v)}
                                        className={`px-4 py-1.5 rounded-full text-xs font-semibold transition-all duration-200 ${view===v ? 'bg-white text-gray-900 shadow-sm ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-800'}`}
                                    >
                                        {v === 'schedule' ? 'Schedule' :
                                         v === 'roster' ? 'Roster' :
                                         v === 'stats' ? 'Time Stats' :
                                         v === 'dept' ? 'Depts' :
                                         v === 'log' ? 'Log' :
                                         v === 'tags' ? 'Tags' :
                                         v === 'print' ? 'Slips' : 'Config'}
                                    </button>
                                ))}
                            </nav>

                            <div className="flex gap-3 items-center">
                                <button onClick={() => setDarkMode(!darkMode)} className={`w-8 h-8 flex items-center justify-center rounded-full transition-all ${darkMode ? 'text-yellow-400 hover:bg-white/10' : 'text-gray-400 hover:text-yellow-500 hover:bg-yellow-50'}`} title="Toggle Dark Mode">
                                    <i className={`fa ${darkMode ? 'fa-sun' : 'fa-moon'}`}></i>
                                </button>
                                <button onClick={() => setShowQuickStart(true)} className="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-white/10 dark:text-gray-500 dark:hover:text-blue-400 transition-all" title="Help / Quick Start"><i className="fa fa-circle-question text-lg"></i></button>
                                <div className="w-px h-6 bg-gray-200 dark:bg-gray-700"></div>
                                <button onClick={resetAll} className="text-gray-400 hover:text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">Reset</button>
                                <button onClick={() => setShowSaveModal(true)} className="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 hover:border-gray-300 px-4 py-1.5 rounded-full text-xs font-semibold shadow-sm transition-all flex items-center gap-2 dark:bg-slate-800 dark:border-slate-700 dark:text-gray-300 dark:hover:bg-slate-700"><i className="fa fa-download text-blue-500"></i> Save</button>
                                <button onClick={() => setShowLoadModal(true)} className="bg-blue-600 text-white hover:bg-blue-700 px-4 py-1.5 rounded-full text-xs font-semibold shadow-sm shadow-blue-200 transition-all flex items-center gap-2"><i className="fa fa-upload"></i> Load</button>
                            </div>
                        </div>
                    </header>
                    {showQuickStart && <QuickStartModal onClose={() => setShowQuickStart(false)} />}
                    <div className="container mx-auto mt-6 px-4">
                        {view === 'roster' ? <RosterView personnel={personnel} setPersonnel={setPersonnel} areas={areas} shifts={shifts} tags={tags} /> :
                         view === 'stats' ? <StatsView personnel={personnel} assignments={assignments} shifts={shifts} positions={positions} /> :
                         view === 'dept' ? <DepartmentView personnel={personnel} assignments={assignments} areas={areas} positions={positions} shifts={shifts} /> :
                         view === 'log' ? <LogView log={log} /> :
                         view === 'tags' ? <TagsView tags={tags} setTags={setTags} personnel={personnel} setPersonnel={setPersonnel} shifts={shifts} areas={areas} onDeleteTag={handleDeleteTag} /> :
                         view === 'print' ? <PrintView personnel={personnel} assignments={assignments} positions={positions} shifts={shifts} /> :
                         view === 'config' ? <ConfigView areas={areas} setAreas={setAreas} positions={positions} setPositions={setPositions} shifts={shifts} setShifts={setShifts} personnel={personnel} rules={rules} setRules={setRules} tags={tags} /> :
                         <ScheduleView personnel={personnel} assignments={assignments} setAssignments={setAssignments} onAutoFill={handleAutoFill} areas={areas} positions={positions} shifts={shifts} rules={rules} tags={tags} />}
                    </div>
                    {showSaveModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded shadow-xl w-96">
                                <h3 className="font-bold text-lg mb-4">Secure Export</h3>
                                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full border p-2 rounded mb-4" placeholder="Password" />
                                <div className="flex justify-end gap-2">
                                    <button onClick={()=>setShowSaveModal(false)} className="px-4 py-2 text-gray-600">Cancel</button>
                                    <button onClick={handleExport} className="px-4 py-2 bg-blue-600 text-white rounded">Download</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {showLoadModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded shadow-xl w-96">
                                <h3 className="font-bold text-lg mb-4">Load Schedule</h3>
                                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full border p-2 rounded mb-4" placeholder="Password" />
                                <input type="file" onChange={handleImport} className="w-full mb-4" />
                                <div className="flex justify-end gap-2">
                                    <button onClick={()=>setShowLoadModal(false)} className="px-4 py-2 text-gray-600">Cancel</button>
                                    <button onClick={handleExport} className="px-4 py-2 bg-blue-600 text-white rounded">Download</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
